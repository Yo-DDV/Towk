syntax = "proto3";

package chatto.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Native notification endpoint and preference commands for the authenticated
// user. This contract is separate from browser Web Push subscriptions.
service NativeNotificationService {
  // Registers or idempotently refreshes one native application installation.
  rpc RegisterNativeEndpoint(RegisterNativeEndpointRequest) returns (RegisterNativeEndpointResponse);

  // Atomically replaces transport material for an existing installation.
  rpc RotateNativeEndpoint(RotateNativeEndpointRequest) returns (RotateNativeEndpointResponse);

  // Revokes exactly one endpoint owned by the authenticated user.
  rpc UnregisterNativeEndpoint(UnregisterNativeEndpointRequest) returns (UnregisterNativeEndpointResponse);

  // Lists the authenticated user's native installations.
  rpc ListNativeEndpoints(ListNativeEndpointsRequest) returns (ListNativeEndpointsResponse);

  // Updates opt-in delivery preferences without replacing transport material.
  rpc UpdateNativeEndpointPreferences(UpdateNativeEndpointPreferencesRequest)
      returns (UpdateNativeEndpointPreferencesResponse);
}

// Native client platform. macOS and iOS values are reserved for later phases;
// their presence is not a claim of implemented delivery.
enum NativeNotificationPlatform {
  NATIVE_NOTIFICATION_PLATFORM_UNSPECIFIED = 0;
  NATIVE_NOTIFICATION_PLATFORM_ANDROID = 1;
  NATIVE_NOTIFICATION_PLATFORM_LINUX = 2;
  NATIVE_NOTIFICATION_PLATFORM_WINDOWS = 3;
  NATIVE_NOTIFICATION_PLATFORM_MACOS = 4;
  NATIVE_NOTIFICATION_PLATFORM_IOS = 5;
}

// Delivery transport selected by a native installation.
enum NativeNotificationTransport {
  NATIVE_NOTIFICATION_TRANSPORT_UNSPECIFIED = 0;
  // Android UnifiedPush endpoint distributed by the operator-hosted ntfy app.
  NATIVE_NOTIFICATION_TRANSPORT_UNIFIED_PUSH = 1;
  // Authenticated Towk realtime session used by resident desktop agents.
  NATIVE_NOTIFICATION_TRANSPORT_LOCAL_REALTIME = 2;
}

// Last known lifecycle state of an endpoint.
enum NativeEndpointState {
  NATIVE_ENDPOINT_STATE_UNSPECIFIED = 0;
  NATIVE_ENDPOINT_STATE_ACTIVE = 1;
  NATIVE_ENDPOINT_STATE_DISABLED = 2;
  NATIVE_ENDPOINT_STATE_PERMANENTLY_INVALID = 3;
}

// Last transport outcome. The Towk API remains authoritative for content and
// read/dismiss state regardless of this value.
enum NativeDeliveryStatus {
  NATIVE_DELIVERY_STATUS_UNSPECIFIED = 0;
  NATIVE_DELIVERY_STATUS_NEVER_ATTEMPTED = 1;
  NATIVE_DELIVERY_STATUS_PENDING = 2;
  NATIVE_DELIVERY_STATUS_DELIVERED_TO_TRANSPORT = 3;
  NATIVE_DELIVERY_STATUS_RETRYABLE_FAILURE = 4;
  NATIVE_DELIVERY_STATUS_EXPIRED = 5;
  NATIVE_DELIVERY_STATUS_PERMANENTLY_INVALID = 6;
}

// Explicit delivery preferences stored per application installation.
message NativeEndpointPreferences {
  bool enabled = 1;
  bool messages = 2;
  bool calls = 3;
}

// Patch for endpoint preferences. Absent fields retain their current value.
message NativeEndpointPreferencesPatch {
  optional bool enabled = 1;
  optional bool messages = 2;
  optional bool calls = 3;
}

// One native installation owned by the authenticated user.
message NativeEndpoint {
  // Stable opaque identifier derived from the owner and logical installation.
  string endpoint_id = 1;
  // Stable application-installation identifier generated by the native client.
  string installation_id = 2;
  NativeNotificationPlatform platform = 3;
  NativeNotificationTransport transport = 4;
  // Native application identifier, for example com.yoddv.towk.android.
  string app_id = 5;
  // UnifiedPush endpoint when transport is UNIFIED_PUSH. It is returned only to
  // its authenticated owner and must not be logged or exposed in diagnostics.
  optional string unifiedpush_endpoint = 6;
  // RFC 8291 P-256 public key supplied by the UnifiedPush distributor.
  optional string web_push_public_key = 7;
  // RFC 9180 P-256 public key generated by the Android installation. The
  // corresponding private key never leaves Android Keystore.
  optional bytes client_public_key = 8;
  string locale = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp last_seen_at = 11;
  optional google.protobuf.Timestamp disabled_at = 12;
  NativeEndpointState state = 13;
  NativeDeliveryStatus last_delivery_status = 14;
  NativeEndpointPreferences preferences = 15;
  // Monotonic transport generation used for optimistic concurrency.
  uint64 generation = 16;
}

message RegisterNativeEndpointRequest {
  string installation_id = 1 [(buf.validate.field).string = {
    min_len: 16
    max_len: 128
    pattern: "^[A-Za-z0-9._~-]+$"
  }];
  NativeNotificationPlatform platform = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  NativeNotificationTransport transport = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string app_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9._-]+$"
  }];
  optional string unifiedpush_endpoint = 5 [(buf.validate.field).string.max_len = 4096];
  optional string web_push_public_key = 6 [(buf.validate.field).string.max_len = 256];
  optional string web_push_auth_secret = 7 [(buf.validate.field).string.max_len = 128];
  optional bytes client_public_key = 8 [(buf.validate.field).bytes.max_len = 256];
  optional string locale = 9 [(buf.validate.field).string.max_len = 16];
  optional NativeEndpointPreferencesPatch preferences = 10;
}

message RegisterNativeEndpointResponse {
  NativeEndpoint endpoint = 1;
}

message RotateNativeEndpointRequest {
  string endpoint_id = 1 [(buf.validate.field).string = {
    min_len: 16
    max_len: 64
    pattern: "^[A-Za-z0-9_-]+$"
  }];
  uint64 expected_generation = 2 [(buf.validate.field).uint64.gt = 0];
  string unifiedpush_endpoint = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  string web_push_public_key = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string web_push_auth_secret = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  bytes client_public_key = 6 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 256
  }];
  optional string locale = 7 [(buf.validate.field).string.max_len = 16];
}

message RotateNativeEndpointResponse {
  NativeEndpoint endpoint = 1;
}

message UnregisterNativeEndpointRequest {
  string endpoint_id = 1 [(buf.validate.field).string = {
    min_len: 16
    max_len: 64
    pattern: "^[A-Za-z0-9_-]+$"
  }];
  // Prevents a stale logout from revoking a newer post-reinstall endpoint.
  uint64 expected_generation = 2 [(buf.validate.field).uint64.gt = 0];
}

message UnregisterNativeEndpointResponse {
  bool unregistered = 1;
}

message ListNativeEndpointsRequest {}

message ListNativeEndpointsResponse {
  repeated NativeEndpoint endpoints = 1;
}

message UpdateNativeEndpointPreferencesRequest {
  string endpoint_id = 1 [(buf.validate.field).string = {
    min_len: 16
    max_len: 64
    pattern: "^[A-Za-z0-9_-]+$"
  }];
  uint64 expected_generation = 2 [(buf.validate.field).uint64.gt = 0];
  NativeEndpointPreferencesPatch preferences = 3 [(buf.validate.field).required = true];
}

message UpdateNativeEndpointPreferencesResponse {
  NativeEndpoint endpoint = 1;
}
