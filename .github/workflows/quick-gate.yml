name: quick gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - 'release-[0-9]*'

concurrency:
  group: quick-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-gate:
    name: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check README fact-checker syntax
        run: node --check tools/fact-check-readmes.mjs

      - name: Verify English README facts
        env:
          TOWK_README_LOCALE: en
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify French README facts
        env:
          TOWK_README_LOCALE: fr
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify German README facts
        env:
          TOWK_README_LOCALE: de
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Spanish README facts
        env:
          TOWK_README_LOCALE: es
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Portuguese README facts
        env:
          TOWK_README_LOCALE: pt
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Check repository and README presentation
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "${empty_tree}" HEAD
          node --check tools/check-public-surface.mjs
          node tools/check-public-surface.mjs
          node --check tools/check-readme-presentation.mjs
          node tools/check-readme-presentation.mjs

      - name: Test README metrics generators
        run: |
          set -euo pipefail
          node --check tools/generate-readme-project-pulse.mjs
          node --test tools/generate-readme-project-pulse.test.mjs
          node --check tools/update-readme-project-pulse-copy.mjs

      - name: Run shell and image guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/verify-compose-project-name.sh tools/verify-release-archives.sh tools/runtime-image-process.sh tools/runtime-image-process_test.sh tools/verify-runtime-image.sh docker/docker-entrypoint.sh
          bash tools/verify-compose-project-name.sh
          bash tools/runtime-image-process_test.sh

  pr173-export-sources:
    name: pr173-export-sources
    if: github.event.pull_request.head.ref == 'feat/read-receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Archive immutable reconciliation refs
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/pr173-exact-sources"
          mkdir -p "${output}"
          git fetch --no-tags origin main
          main_head="$(git rev-parse origin/main)"
          design_base=b9f61f1b28608784c1e1ed1e2232131e681a12b3
          feature_source=f07456ce30c48fd35d63fcc9d3480b5792f40cfa
          git cat-file -e "${design_base}^{commit}"
          git cat-file -e "${feature_source}^{commit}"
          git archive --format=tar "${design_base}" | gzip -9 > "${output}/design-base.tar.gz"
          git archive --format=tar "${feature_source}" | gzip -9 > "${output}/feature-source.tar.gz"
          git archive --format=tar "${main_head}" | gzip -9 > "${output}/current-main.tar.gz"
          printf 'design_base=%s\nfeature_source=%s\ncurrent_main=%s\npr_head=%s\n' \
            "${design_base}" "${feature_source}" "${main_head}" "${{ github.event.pull_request.head.sha }}" \
            > "${output}/refs.txt"
          sha256sum "${output}"/*.tar.gz > "${output}/SHA256SUMS"

      - name: Upload immutable source archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr173-exact-sources-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr173-exact-sources
          retention-days: 1
          if-no-files-found: error
