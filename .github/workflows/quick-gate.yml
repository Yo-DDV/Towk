name: quick gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - 'release-[0-9]*'
  push:
    branches:
      - feat/user-profiles
    paths:
      - .github/pr182-profile-polish-trigger

concurrency:
  group: quick-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-gate:
    name: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check README fact-checker syntax
        run: node --check tools/fact-check-readmes.mjs

      - name: Verify English README facts
        env:
          TOWK_README_LOCALE: en
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify French README facts
        env:
          TOWK_README_LOCALE: fr
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify German README facts
        env:
          TOWK_README_LOCALE: de
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Spanish README facts
        env:
          TOWK_README_LOCALE: es
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Portuguese README facts
        env:
          TOWK_README_LOCALE: pt
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Check repository and README presentation
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "${empty_tree}" HEAD
          node --check tools/check-public-surface.mjs
          node tools/check-public-surface.mjs
          node --check tools/check-readme-presentation.mjs
          node tools/check-readme-presentation.mjs

      - name: Test README metrics generators
        run: |
          set -euo pipefail
          node --check tools/generate-readme-project-pulse.mjs
          node --test tools/generate-readme-project-pulse.test.mjs
          node --check tools/update-readme-project-pulse-copy.mjs

      - name: Run shell and image guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/verify-compose-project-name.sh tools/verify-release-archives.sh tools/runtime-image-process.sh tools/runtime-image-process_test.sh tools/verify-runtime-image.sh docker/docker-entrypoint.sh
          bash tools/verify-compose-project-name.sh
          bash tools/runtime-image-process_test.sh

  apply-pr182-profile-polish:
    name: apply-pr182-profile-polish
    if: github.event_name == 'push' && github.ref_name == 'feat/user-profiles'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout profile branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/user-profiles
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main feat/user-profiles

      - name: Apply reviewed profile changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr182-profile-action-polish.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = []
          for line in workflow[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/pr182-profile-polish.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/pr182-profile-polish.py
          python3 - <<'PY'
          from pathlib import Path

          voice = Path('apps/frontend/src/lib/components/voice/VoiceCallPanel.svelte')
          text = voice.read_text()
          old = '    if (requestedJoinInFlight || isInThisCall || isConnecting) return;'
          new = '    if (requestedJoinInFlight || isInThisCall || isInAnotherCall || isConnecting) return;'
          if text.count(old) != 1:
              raise SystemExit('VoiceCallPanel: profile join guard not found exactly once')
          voice.write_text(text.replace(old, new, 1))

          spec = Path('apps/frontend/src/lib/components/voice/VoiceCallPanel.svelte.spec.ts')
          source = spec.read_text()
          test = """

  it('does not launch a profile call while another room call is active', async () => {
    const join = vi.fn();
    setPendingRoomCallJoin('storybook-call-server', 'storybook-call-room');

    const { container } = render(VoiceCallPanelStoryHarness, {
      props: {
        layout: 'sidebar',
        scenario: 'voice',
        onStoreSeeded: (store) => {
          store.voiceCall.connected = true;
          store.voiceCall.connecting = false;
          store.voiceCall.roomId = 'another-room';
          store.voiceCall.participants = [];
          vi.spyOn(store.voiceCall, 'join').mockImplementation(async (...args) => {
            join(...args);
            return { status: 'joined' as const };
          });
        }
      }
    });

    await vi.waitFor(() => {
      expect(container.querySelector('[data-testid=\"call-observer-panel\"]')).not.toBeNull();
    });
    await new Promise((resolve) => setTimeout(resolve, 75));
    expect(join).not.toHaveBeenCalled();
  });
"""
          pos = source.rfind('\n});')
          if pos == -1:
              raise SystemExit('VoiceCallPanel spec: describe end missing')
          spec.write_text(source[:pos] + test + source[pos:])

          fdr = Path('docs/fdr/FDR-022-user-profile.md')
          fdr_text = fdr.read_text()
          old_fdr = '- **Profile actions** — the server returns viewer-specific Message and Call capabilities. The call action is exposed only when direct messaging is allowed and LiveKit is configured. Deleted accounts expose neither action.'
          new_fdr = '- **Profile actions** — the server returns viewer-specific Message and Call capabilities. Message opens the direct conversation and focuses its composer. Call opens the direct conversation, exposes the call surface, and starts the existing device-aware join flow. The call action is exposed only when direct messaging is allowed and LiveKit is configured, and it does not interrupt another active room call. Deleted accounts expose neither action.'
          if fdr_text.count(old_fdr) == 1:
              fdr.write_text(fdr_text.replace(old_fdr, new_fdr, 1))
          elif fdr_text.count(new_fdr) != 1:
              raise SystemExit('FDR-022: profile action contract is neither old nor expected final text')
          PY

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Format and lint touched frontend sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec prettier --write \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/voice/VoiceCallPanel.svelte \
            src/lib/components/voice/VoiceCallPanel.svelte.spec.ts \
            src/lib/dm/startDM.ts \
            src/lib/dm/startDM.svelte.spec.ts \
            src/lib/storage/roomSidebarPanel.ts \
            src/lib/storage/roomSidebarPanel.spec.ts
          pnpm --dir apps/frontend exec eslint \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/voice/VoiceCallPanel.svelte \
            src/lib/components/voice/VoiceCallPanel.svelte.spec.ts \
            src/lib/dm/startDM.ts \
            src/lib/dm/startDM.svelte.spec.ts \
            src/lib/storage/roomSidebarPanel.ts \
            src/lib/storage/roomSidebarPanel.spec.ts

      - name: Frontend typecheck
        run: pnpm --dir apps/frontend run check

      - name: Server tests for pending call state
        run: pnpm --dir apps/frontend exec vitest run --project server src/lib/storage/roomSidebarPanel.spec.ts

      - name: Install Chromium
        run: pnpm --dir apps/frontend exec playwright install --with-deps chromium

      - name: Targeted browser component tests
        env:
          VITEST_BROWSER: chromium
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec vitest run --project client \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/voice/VoiceCallPanel.svelte.spec.ts \
            src/lib/dm/startDM.svelte.spec.ts

      - name: Build and repository checks
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend run build
          mise run license-check
          mise run public-surface-check
          git diff --check

      - name: Commit product changes and remove temporary files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/quick-gate.yml
          rm -f \
            .github/workflows/pr182-profile-action-polish.yml \
            .github/workflows/pr182-fix-polish-workflow.yml \
            .github/pr182-profile-polish-trigger
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          ! git ls-files | grep -E '^\.github/(workflows/(pr182-profile-action-polish|pr182-fix-polish-workflow)\.yml|pr182-profile-polish-trigger)$'
          ! git diff --cached | grep -Ei '(^|[[:space:]])(Co-authored-by|Generated-by|Assisted-by|Pair-programmed-by):'
          author_name=$(git show -s --format=%an "$EXPECTED_HEAD")
          author_email=$(git show -s --format=%ae "$EXPECTED_HEAD")
          GIT_AUTHOR_NAME="$author_name" GIT_AUTHOR_EMAIL="$author_email" \
          GIT_COMMITTER_NAME="$author_name" GIT_COMMITTER_EMAIL="$author_email" \
            git commit -m 'fix(profiles): refine identity and launch actions'
          git push origin HEAD:feat/user-profiles
