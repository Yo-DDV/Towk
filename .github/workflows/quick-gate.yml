name: quick gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - 'release-[0-9]*'

concurrency:
  group: quick-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-gate:
    name: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check README fact-checker syntax
        run: node --check tools/fact-check-readmes.mjs

      - name: Verify English README facts
        env:
          TOWK_README_LOCALE: en
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify French README facts
        env:
          TOWK_README_LOCALE: fr
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify German README facts
        env:
          TOWK_README_LOCALE: de
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Spanish README facts
        env:
          TOWK_README_LOCALE: es
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Portuguese README facts
        env:
          TOWK_README_LOCALE: pt
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Check repository and README presentation
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "${empty_tree}" HEAD
          node --check tools/check-public-surface.mjs
          node tools/check-public-surface.mjs
          node --check tools/check-readme-presentation.mjs
          node tools/check-readme-presentation.mjs

      - name: Test README metrics generators
        run: |
          set -euo pipefail
          node --check tools/generate-readme-project-pulse.mjs
          node --test tools/generate-readme-project-pulse.test.mjs
          node --check tools/update-readme-project-pulse-copy.mjs

      - name: Run shell and image guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/verify-compose-project-name.sh tools/verify-release-archives.sh tools/runtime-image-process.sh tools/runtime-image-process_test.sh tools/verify-runtime-image.sh docker/docker-entrypoint.sh
          bash tools/verify-compose-project-name.sh
          bash tools/runtime-image-process_test.sh

  pr173-product-verification:
    name: pr173-product-verification
    if: github.event.pull_request.head.ref == 'feat/read-receipts'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact verification head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Build exact clean candidate
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly PRODUCT_HEAD=7d215af03673e02a1b0667970781d1fb720d0842
          readonly TARGET_BRANCH=feat/read-receipts
          source_head="$(git rev-parse HEAD)"
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git fetch --no-tags origin main "${TARGET_BRANCH}"
          main_head="$(git rev-parse origin/main)"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${source_head}"
          git merge-base --is-ancestor "${PRODUCT_HEAD}" "${source_head}"
          product_tree="$(git show -s --format=%T "${PRODUCT_HEAD}")"
          candidate="$(printf '%s\n' 'feat(read-receipts): finalize privacy-safe delivery' | git commit-tree "${product_tree}" -p "${source_head}" -p "${main_head}")"
          git checkout --detach "${candidate}"
          test -z "$(git diff --diff-filter=D --name-only "${main_head}..${candidate}")"
          test -z "$(git diff --name-only "${main_head}..${candidate}" -- .github)"
          printf 'candidate=%s\nmain_head=%s\nsource_head=%s\n' "${candidate}" "${main_head}" "${source_head}" >> "${GITHUB_OUTPUT}"

      - name: Regenerate and verify contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mise run codegen-proto
          pnpm --filter @towk/api-types build
          git diff --exit-code
          (
            cd proto
            mise x -- buf build
            mise x -- buf lint \
              --path chatto/api/v1/read_state.proto \
              --path chatto/core/v1/live_events.proto \
              --path chatto/realtime/v1/realtime.proto
          )

      - name: Verify backend
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd cli
            mise x -- go test -race -trimpath -tags test_endpoints \
              ./internal/core ./internal/connectapi ./internal/http_server ./internal/events \
              -run 'ReadReceipt|ReadReceipts|RealtimeMapper|UserSettings|ServerUserPreferences|Subject|ServerCapabilities' \
              -count=1
            mise x -- go vet ./internal/core ./internal/connectapi ./internal/http_server ./internal/events
          )

      - name: Verify frontend source and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec vitest --run \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client-tests/viewer.spec.ts \
            src/lib/api-client-tests/serverState.spec.ts \
            src/lib/state/server/store.svelte.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts'
          pnpm --dir apps/frontend exec eslint \
            src/lib/ServerSettings.svelte \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client/account.ts \
            src/lib/api-client/readState.ts \
            src/lib/api-client/serverState.ts \
            src/lib/api-client/viewer.ts \
            src/lib/components/settings/ProfileDetailsSettings.svelte \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/realtimeEventMapper.ts \
            src/lib/state/userSettings.svelte.ts \
            src/routes/chat/AuthenticatedChatProvider.svelte \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/MessageEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/MessageMetaBar.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ThreadPane.svelte' \
            'src/routes/chat/[serverId]/[roomId]/TimelineEventsPane.svelte' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/+page.svelte' \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts'

      - name: Verify browser, builds, license, and public surface
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir apps/frontend exec playwright install chromium
          pnpm --dir apps/frontend exec vitest --run --project client \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts'
          mise run build-frontend
          pnpm run build:docs
          mise run license-check
          mise run public-surface-check
          git diff --check
          git diff --exit-code

      - name: Verify privacy, provenance, and publish exact head
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate='${{ steps.candidate.outputs.candidate }}'
          main_head='${{ steps.candidate.outputs.main_head }}'
          source_head='${{ steps.candidate.outputs.source_head }}'
          summary="$(sed -n '/message ReadReceiptSummary {/,/^}/p' proto/chatto/api/v1/read_state.proto)"
          printf '%s\n' "${summary}" | grep -Fq 'string message_event_id = 1;'
          printf '%s\n' "${summary}" | grep -Fq 'int32 reader_count = 2;'
          ! printf '%s\n' "${summary}" | grep -Eq 'preview_user_ids[[:space:]]*=|latest_read_at[[:space:]]*='
          for spec in \
            'proto/chatto/core/v1/live_events.proto:PublicReadReceiptAdvancedEvent' \
            'proto/chatto/realtime/v1/realtime.proto:RealtimeReadReceiptAdvancedEvent'; do
            path="${spec%%:*}"
            message="${spec##*:}"
            block="$(sed -n "/message ${message} {/,/^}/p" "${path}")"
            printf '%s\n' "${block}" | grep -Fq 'string room_id = 1;'
            printf '%s\n' "${block}" | grep -Fq 'optional string thread_root_event_id = 2;'
            ! printf '%s\n' "${block}" | grep -Eq '[[:space:]](user_id|event_id|event_sequence|read_at)[[:space:]]*='
          done
          test -f docs/fdr/FDR-031-read-receipts.md
          test -f docs/adr/ADR-055-read-receipt-publication-boundary.md
          grep -Fq 'FDR-031-read-receipts.md' docs/fdr/INDEX.md
          grep -Fq 'ADR-055-read-receipt-publication-boundary.md' docs/adr/INDEX.md
          test -z "$(git diff --diff-filter=D --name-only "${main_head}..${candidate}")"
          test -z "$(git diff --name-only "${main_head}..${candidate}" -- .github)"
          identity="$(git show -s --format='%an%n%cn%n%B' "${candidate}")"
          printf '%s\n' "${identity}" | grep -Fxq 'Yo-DDV'
          ! printf '%s\n' "${identity}" | grep -Eiq '^(Co-authored-by|Generated-by|Assisted-by|Pair-programmed-by):'
          git fetch --no-tags origin main feat/read-receipts
          test "$(git rev-parse origin/main)" = "${main_head}"
          test "$(git rev-parse origin/feat/read-receipts)" = "${source_head}"
          git push origin "${candidate}:refs/heads/feat/read-receipts"
          printf 'terminal_head=%s\nmain_head=%s\n' "${candidate}" "${main_head}" > "${RUNNER_TEMP}/pr173-product-verification.txt"

      - name: Upload verification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr173-product-verification-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr173-product-verification.txt
          retention-days: 1
          if-no-files-found: warn
