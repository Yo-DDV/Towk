name: quick gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - "release-[0-9]*"

concurrency:
  group: quick-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-gate:
    name: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check README fact-checker syntax
        run: node --check tools/fact-check-readmes.mjs

      - name: Verify English README facts
        env:
          TOWK_README_LOCALE: en
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify French README facts
        env:
          TOWK_README_LOCALE: fr
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify German README facts
        env:
          TOWK_README_LOCALE: de
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Spanish README facts
        env:
          TOWK_README_LOCALE: es
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Portuguese README facts
        env:
          TOWK_README_LOCALE: pt
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Check repository and README presentation
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "${empty_tree}" HEAD
          node --check tools/check-public-surface.mjs
          node tools/check-public-surface.mjs
          node --check tools/check-readme-presentation.mjs
          node tools/check-readme-presentation.mjs

      - name: Test README metrics generators
        run: |
          set -euo pipefail
          node --check tools/generate-readme-project-pulse.mjs
          node --test tools/generate-readme-project-pulse.test.mjs
          node --check tools/update-readme-project-pulse-copy.mjs

      - name: Run shell and image guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/verify-compose-project-name.sh tools/verify-compose-resource-envelope.sh tools/verify-release-archives.sh tools/runtime-image-process.sh tools/runtime-image-process_test.sh tools/verify-runtime-image.sh docker/docker-entrypoint.sh
          bash tools/verify-compose-project-name.sh
          bash tools/verify-compose-resource-envelope.sh
          bash tools/runtime-image-process_test.sh

  pr312-source:
    name: pr312-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr312-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1

  pr312-frontend:
    name: pr312-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"
      - name: Typecheck frontend
        id: frontend-check
        shell: bash
        run: |
          set +e
          pnpm run check:frontend > frontend-check.log 2>&1
          status=$?
          cat frontend-check.log
          exit "$status"
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr312-frontend-diagnostics
          path: frontend-check.log
          if-no-files-found: error
      - name: Lint frontend
        run: pnpm run lint:frontend
      - name: Run grade tests
        run: pnpm --filter towk-frontend exec vitest run src/lib/components/rbac/gradeTemplates.spec.ts src/routes/chat/[serverId]/[roomId]/memberRoleSections.spec.ts

  pr312-backend:
    name: pr312-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Build frontend assets
        shell: bash
        run: |
          set +e
          mise build-frontend > backend-build.log 2>&1
          status=$?
          cat backend-build.log
          exit "$status"
      - name: Run RBAC and ConnectRPC tests
        shell: bash
        run: |
          set +e
          cd cli
          go test -trimpath -p 1 -tags test_endpoints ./internal/core ./internal/connectapi > ../backend-test.log 2>&1
          status=$?
          cat ../backend-test.log
          exit "$status"
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr312-backend-diagnostics
          path: |
            backend-build.log
            backend-test.log
          if-no-files-found: warn
