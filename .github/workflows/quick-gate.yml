name: quick gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - 'release-[0-9]*'

concurrency:
  group: quick-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-gate:
    name: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check README fact-checker syntax
        run: node --check tools/fact-check-readmes.mjs

      - name: Verify English README facts
        env:
          TOWK_README_LOCALE: en
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify French README facts
        env:
          TOWK_README_LOCALE: fr
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify German README facts
        env:
          TOWK_README_LOCALE: de
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Spanish README facts
        env:
          TOWK_README_LOCALE: es
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Portuguese README facts
        env:
          TOWK_README_LOCALE: pt
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Check repository and README presentation
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "${empty_tree}" HEAD
          node --check tools/check-public-surface.mjs
          node tools/check-public-surface.mjs
          node --check tools/check-readme-presentation.mjs
          node tools/check-readme-presentation.mjs

      - name: Test README metrics generators
        run: |
          set -euo pipefail
          node --check tools/generate-readme-project-pulse.mjs
          node --test tools/generate-readme-project-pulse.test.mjs
          node --check tools/update-readme-project-pulse-copy.mjs

      - name: Run shell and image guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/verify-compose-project-name.sh tools/verify-release-archives.sh tools/runtime-image-process.sh tools/runtime-image-process_test.sh tools/verify-runtime-image.sh docker/docker-entrypoint.sh
          bash tools/verify-compose-project-name.sh
          bash tools/runtime-image-process_test.sh

  pr173-terminal-finalize:
    name: pr173-terminal-finalize
    if: github.event.pull_request.head.ref == 'feat/read-receipts'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Execute terminal finalizer payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR173_DESIGN_BASE: b9f61f1b28608784c1e1ed1e2232131e681a12b3
          PR173_FEATURE_SOURCE: f07456ce30c48fd35d63fcc9d3480b5792f40cfa
          PR173_EXPECTED_MAIN: d277c59d2ebb16d076de6ae793e4679251be38b4
          TARGET_BRANCH: feat/read-receipts
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/read-receipts-terminal-finalize.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          marker = '        run: |'
          try:
              index = lines.index(marker)
          except ValueError as exc:
              raise SystemExit('terminal finalizer run block was not found') from exc
          body = []
          for line in lines[index + 1:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line:
                  body.append('')
              else:
                  raise SystemExit(f'unexpected line outside terminal run block: {line!r}')
          target = Path('/tmp/pr173-terminal-finalize.sh')
          target.write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          chmod +x /tmp/pr173-terminal-finalize.sh
          bash -x /tmp/pr173-terminal-finalize.sh
