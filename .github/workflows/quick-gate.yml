name: quick gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - "release-[0-9]*"

concurrency:
  group: quick-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-gate:
    name: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check README fact-checker syntax
        run: node --check tools/fact-check-readmes.mjs

      - name: Verify English README facts
        env:
          TOWK_README_LOCALE: en
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify French README facts
        env:
          TOWK_README_LOCALE: fr
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify German README facts
        env:
          TOWK_README_LOCALE: de
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Spanish README facts
        env:
          TOWK_README_LOCALE: es
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Verify Portuguese README facts
        env:
          TOWK_README_LOCALE: pt
        run: node --test tools/fact-check-readmes.test.mjs

      - name: Check repository and README presentation
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "${empty_tree}" HEAD
          node --check tools/check-public-surface.mjs
          node tools/check-public-surface.mjs
          node --check tools/check-readme-presentation.mjs
          node tools/check-readme-presentation.mjs

      - name: Test README metrics generators
        run: |
          set -euo pipefail
          node --check tools/generate-readme-project-pulse.mjs
          node --test tools/generate-readme-project-pulse.test.mjs
          node --check tools/update-readme-project-pulse-copy.mjs

      - name: Run shell and image guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/verify-compose-project-name.sh tools/verify-compose-resource-envelope.sh tools/verify-release-archives.sh tools/runtime-image-process.sh tools/runtime-image-process_test.sh tools/verify-runtime-image.sh docker/docker-entrypoint.sh
          bash tools/verify-compose-project-name.sh
          bash tools/verify-compose-resource-envelope.sh
          bash tools/runtime-image-process_test.sh

  pr312-apply-remediation:
    name: pr312-apply-remediation
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/localized-default-grades'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Apply validated remediation once
        shell: bash
        run: |
          set -euo pipefail
          if test -f cli/internal/core/role_template_apply.go; then
            echo 'Remediation already present; nothing to apply.'
            exit 0
          fi
          test "$(find .github/pr312-patch -maxdepth 1 -name 'part-*' | wc -l)" -eq 8
          cat .github/pr312-patch/part-* > /tmp/pr312-remediation.patch.gz.b64
          sha256sum /tmp/pr312-remediation.patch.gz.b64
          base64 --decode /tmp/pr312-remediation.patch.gz.b64 | gzip --decompress > /tmp/pr312-remediation.patch
          git apply --check /tmp/pr312-remediation.patch
          git apply --index /tmp/pr312-remediation.patch
          git diff --cached --check
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git commit -m 'feat(rbac): complete safe grade template application'
          git push origin HEAD:feat/localized-default-grades
