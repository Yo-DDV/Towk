name: Materialize README source files

on:
  push:
    branches:
      - docs/readme-repository-activity

permissions:
  contents: read

concurrency:
  group: materialize-readme-repository-activity
  cancel-in-progress: true

jobs:
  materialize:
    if: github.repository == 'Yo-DDV/Towk'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Upload the source README files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readme-source-files
          path: |
            README.md
            README.de.md
            README.es.md
            README.fr.md
            README.pt.md
          if-no-files-found: error
          retention-days: 1
