name: read-receipts presentation push finalizer

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-presentation-push-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Apply compact receipt presentation rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          event_list = Path('apps/frontend/src/routes/chat/[serverId]/[roomId]/EventList.svelte')
          source = event_list.read_text(encoding='utf-8')

          import_marker = "  import { latestVisibleReadReceiptTarget, visibleMessageEventIds } from './readReceiptVisibility';\n"
          import_replacement = import_marker + "  import { readReceiptIndicatorEventIds } from './readReceiptPresentation';\n"
          if import_replacement not in source:
              if source.count(import_marker) != 1:
                  raise SystemExit('unexpected read receipt import state')
              source = source.replace(import_marker, import_replacement, 1)

          count_marker = "  let messageEventCount = $derived(\n"
          count_replacement = (
              "  let readReceiptIndicatorIds = $derived(readReceiptIndicatorEventIds(filteredEvents));\n"
              + count_marker
          )
          if 'readReceiptIndicatorIds = $derived' not in source:
              if source.count(count_marker) != 1:
                  raise SystemExit('unexpected message count state')
              source = source.replace(count_marker, count_replacement, 1)

          old_ids = (
              "  function renderedMessageEventIds(): string[] {\n"
              "    return filteredEvents\n"
              "      .filter((event) => isMessagePostedEvent(event.event))\n"
              "      .map((event) => event.id)\n"
              "      .slice(-120);\n"
              "  }\n"
          )
          new_ids = (
              "  function renderedMessageEventIds(): string[] {\n"
              "    return filteredEvents\n"
              "      .filter((event) => readReceiptIndicatorIds.has(event.id))\n"
              "      .map((event) => event.id)\n"
              "      .slice(-120);\n"
              "  }\n"
          )
          if old_ids in source:
              source = source.replace(old_ids, new_ids, 1)
          elif new_ids not in source:
              raise SystemExit('unexpected summary ID selection state')

          old_prop = "                  readReceiptSummary={readReceiptSummaries.get(eventData.id)}\n"
          new_prop = (
              "                  readReceiptSummary={readReceiptIndicatorIds.has(eventData.id)\n"
              "                    ? readReceiptSummaries.get(eventData.id)\n"
              "                    : undefined}\n"
          )
          if old_prop in source:
              source = source.replace(old_prop, new_prop, 1)
          elif new_prop not in source:
              raise SystemExit('unexpected read receipt prop state')

          event_list.write_text(source, encoding='utf-8')

          for workflow in (
              '.github/workflows/read-receipts-presentation-finalizer.yml',
              '.github/workflows/read-receipts-presentation-push.yml',
          ):
              Path(workflow).unlink(missing_ok=True)
          PY
          git diff --check

      - name: Format affected sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec prettier --write \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts'
          pnpm exec prettier --write docs/fdr/FDR-031-read-receipts.md
          git diff --check

      - name: Check Svelte and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @towk/api-types build
          pnpm --dir apps/frontend run check

      - name: Run focused presentation tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec vitest --run \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts'

      - name: Lint affected frontend sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec eslint \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts'

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          mise run build-frontend
          git diff --check

      - name: Commit and push validated presentation update
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(frontend): reduce read receipt visual noise'
          git push origin HEAD:feat/read-receipts
