name: read-receipts finalizer v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: read-receipts-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/read-receipts'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Synchronize current main without publishing
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          printf 'source_head=%s\n' "${source_head}" >> "${GITHUB_OUTPUT}"
          printf 'main_sha=%s\n' "${main_sha}" >> "${GITHUB_OUTPUT}"
          if git merge-base --is-ancestor "${main_sha}" "${source_head}"; then
            printf 'needs_merge=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'needs_merge=true\n' >> "${GITHUB_OUTPUT}"
            git merge --no-commit --no-ff "${main_sha}"
          fi
          git diff --check

      - name: Apply verified privacy remediation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_GZIP_SHA256: b417f306713672f4cdce90e3098999fa2b2a20b515896c479cb1856762ba2f27
          PATCH_SHA256: ed06045e6a501fd4a4b47442daf16b3abfbba3138352a9af1b0c2003e764ff9c
          PATCH_PART_SHAS: >-
            e48d04421ffc32f2985bf7bdd46956419db2f4e2
            4e651e6b972f1f12031b7ddad6c638b093dcb250
        run: |
          set -euo pipefail
          encoded="${RUNNER_TEMP}/privacy.patch.gz.b64"
          archive="${RUNNER_TEMP}/privacy.patch.gz"
          patch="${RUNNER_TEMP}/privacy.patch"
          : > "${encoded}"
          for sha in ${PATCH_PART_SHAS}; do
            chunk="${RUNNER_TEMP}/${sha}.part"
            curl --fail --silent --show-error --location --retry 3 \
              --header "Accept: application/vnd.github.raw+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" > "${chunk}"
            test "$(git hash-object "${chunk}")" = "${sha}"
            cat "${chunk}" >> "${encoded}"
          done
          base64 -d "${encoded}" > "${archive}"
          printf '%s  %s\n' "${PATCH_GZIP_SHA256}" "${archive}" | sha256sum --check --strict
          gzip -dc "${archive}" > "${patch}"
          printf '%s  %s\n' "${PATCH_SHA256}" "${patch}" | sha256sum --check --strict
          if git apply --check "${patch}"; then
            git apply "${patch}"
          elif git apply --reverse --check "${patch}"; then
            echo 'Privacy remediation already present.'
          else
            exit 40
          fi

      - name: Apply verified frontend compatibility remediation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: f12b1b4277d103f7d6b742fe1d442bbbcc2d2500
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/frontend.payload"
          d1="${RUNNER_TEMP}/frontend.d1"
          d2="${RUNNER_TEMP}/frontend.d2"
          candidate="${RUNNER_TEMP}/frontend.patch"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" \
            | jq -er '.content' | tr -d '\r\n' | base64 -d > "${payload}"
          test "$(git hash-object "${payload}")" = "${PATCH_BLOB_SHA}"
          apply_candidate() {
            local input="$1"
            if git apply --check "${input}" >/dev/null 2>&1; then git apply "${input}"; return 0; fi
            if git apply --reverse --check "${input}" >/dev/null 2>&1; then return 0; fi
            return 1
          }
          if apply_candidate "${payload}"; then true
          elif gzip -t "${payload}" >/dev/null 2>&1 && gzip -dc "${payload}" > "${candidate}" && apply_candidate "${candidate}"; then true
          elif base64 -di "${payload}" > "${d1}" 2>/dev/null && apply_candidate "${d1}"; then true
          elif gzip -t "${d1}" >/dev/null 2>&1 && gzip -dc "${d1}" > "${candidate}" && apply_candidate "${candidate}"; then true
          elif base64 -di "${d1}" > "${d2}" 2>/dev/null && apply_candidate "${d2}"; then true
          elif gzip -t "${d2}" >/dev/null 2>&1 && gzip -dc "${d2}" > "${candidate}" && apply_candidate "${candidate}"; then true
          else exit 41
          fi

      - name: Remove every temporary read-receipts workflow from candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/read-receipts-candidate-tree.yml \
            .github/workflows/read-receipts-snapshot.yml \
            .github/workflows/read-receipts-remediation.yml \
            .github/workflows/read-receipts-frontend-diagnostic.yml \
            .github/workflows/read-receipts-finalize-20260726.yml \
            .github/workflows/read-receipts-finalize-v2-20260726.yml
          git diff --check

      - name: Regenerate protobuf and build API types
        shell: bash
        run: |
          set -euo pipefail
          mise run codegen-proto
          pnpm --filter @towk/api-types build

      - name: Verify count-only public summary contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          proto = Path('proto/chatto/api/v1/read_state.proto').read_text(encoding='utf-8')
          start = proto.index('message ReadReceiptSummary {')
          end = proto.index('\n}', start) + 2
          section = proto[start:end]
          assert 'int32 reader_count = 2;' in section
          assert 'reserved 3;' in section
          assert 'reserved "preview_user_ids";' in section
          assert 'repeated string preview_user_ids' not in section
          backend = Path('cli/internal/connectapi/read_state.go').read_text(encoding='utf-8')
          assert 'PreviewUserIds' not in backend
          assert 'previewUserIds' not in backend
          go = Path('cli/internal/pb/chatto/api/v1/read_state.pb.go').read_text(encoding='utf-8')
          ts = Path('packages/api-types/src/chatto/api/v1/read_state_pb.ts').read_text(encoding='utf-8')
          for text in (go, ts):
              start = text.index('ReadReceiptSummary')
              window = text[start:start + 5000]
              assert 'PreviewUserIds' not in window
              assert 'previewUserIds' not in window
          PY
          test -f 'apps/frontend/src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte'
          test -f 'apps/frontend/src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.ts'
          test -f docs/fdr/FDR-031-read-receipts.md
          test -f docs/adr/ADR-054-read-receipt-publication-boundary.md

      - name: Validate protobuf and backend
        shell: bash
        run: |
          set -euo pipefail
          (cd proto && buf build && buf lint --path chatto/api/v1/read_state.proto)
          (cd cli && go test -race -trimpath -tags test_endpoints \
            ./internal/core ./internal/connectapi ./internal/http_server ./internal/events \
            -run 'ReadReceipt|ReadReceipts|UserSettings|ServerUserPreferences|Subject' -count=1)
          (cd cli && go vet ./internal/core ./internal/connectapi ./internal/http_server ./internal/events)

      - name: Validate frontend behavior and source quality
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec vitest --run \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client-tests/viewer.spec.ts \
            src/lib/api-client-tests/serverState.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts'
          pnpm --dir apps/frontend exec eslint \
            src/lib/ServerSettings.svelte \
            src/lib/api-client/readState.ts \
            src/lib/api-client/serverState.ts \
            src/lib/api-client/viewer.ts \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.ts \
            src/lib/state/userSettings.svelte.ts \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/MessageEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/MessageMetaBar.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ThreadPane.svelte' \
            'src/routes/chat/[serverId]/[roomId]/TimelineEventsPane.svelte' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/+page.svelte'

      - name: Build and verify distributable surfaces
        shell: bash
        run: |
          set -euo pipefail
          mise run build-frontend
          pnpm run build:docs
          mise run public-surface-check
          mise run license-check
          git diff --check

      - name: Publish validated synchronized commit
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ steps.refs.outputs.source_head }}
          MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
          NEEDS_MERGE: ${{ steps.refs.outputs.needs_merge }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${MAIN_SHA}"
          git add -A
          git diff --cached --check
          tree_sha="$(git write-tree)"
          for path in \
            .github/workflows/read-receipts-candidate-tree.yml \
            .github/workflows/read-receipts-snapshot.yml \
            .github/workflows/read-receipts-remediation.yml \
            .github/workflows/read-receipts-frontend-diagnostic.yml \
            .github/workflows/read-receipts-finalize-20260726.yml \
            .github/workflows/read-receipts-finalize-v2-20260726.yml; do
            ! git ls-tree -r --name-only "${tree_sha}" | grep -Fxq "${path}"
          done
          if test "${NEEDS_MERGE}" = true; then
            parents="$(jq -n --arg source "${SOURCE_HEAD}" --arg main "${MAIN_SHA}" '[ $source, $main ]')"
          else
            parents="$(jq -n --arg source "${SOURCE_HEAD}" '[ $source ]')"
          fi
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          payload="${RUNNER_TEMP}/commit.json"
          response="${RUNNER_TEMP}/commit-response.json"
          jq -n --arg message 'fix(messages): remediate read receipt privacy and frontend' \
            --arg tree "${tree_sha}" --argjson parents "${parents}" \
            --arg name 'Yo-DDV' --arg email '116607353+Yo-DDV@users.noreply.github.com' --arg date "${timestamp}" \
            '{message:$message,tree:$tree,parents:$parents,author:{name:$name,email:$email,date:$date},committer:{name:$name,email:$email,date:$date}}' > "${payload}"
          curl --fail --silent --show-error --location --retry 3 --request POST \
            --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" --data-binary @"${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits" | tee "${response}"
          commit_sha="$(jq -er '.sha' "${response}")"
          current_ref="$(curl --fail --silent --show-error --location --retry 3 \
            --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/feat/read-receipts" | jq -er '.object.sha')"
          test "${current_ref}" = "${SOURCE_HEAD}"
          jq -n --arg sha "${commit_sha}" '{sha:$sha,force:false}' | curl --fail --silent --show-error --location --retry 3 \
            --request PATCH --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" --data-binary @- \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/feat/read-receipts"
          printf 'commit_sha=%s\n' "${commit_sha}" >> "${GITHUB_OUTPUT}"
          printf 'tree_sha=%s\n' "${tree_sha}" >> "${GITHUB_OUTPUT}"
          printf 'source_head=%s\nmain_sha=%s\nfinal_commit=%s\nfinal_tree=%s\n' \
            "${SOURCE_HEAD}" "${MAIN_SHA}" "${commit_sha}" "${tree_sha}" \
            > "${RUNNER_TEMP}/read-receipts-finalizer-status.txt"

      - name: Update pull request handoff truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.commit_sha }}
          MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/pr-body.md"
          cat > "${body}" <<EOF
          Closes #172

          ## Summary

          Implements privacy-aware read receipts for direct messages, group conversations, channels, and threads. Public summaries are strictly count-only; reader identities are returned only by the authorized paginated detail endpoint. The complete responsive frontend, visibility/focus gating, realtime invalidation, profile/admin controls, translations, tests, FDR-031, and ADR-054 are included.

          ## Privacy and compatibility

          \`ReadReceiptSummary\` exposes only \`reader_count\` and \`latest_read_at\`. Field number 3 and \`preview_user_ids\` are reserved. Private unread markers remain authoritative. Reads made while the server or user switch is disabled are never published retroactively. No data migration is required; the server-wide switch is the operational rollback.

          ## Verification

          Exact head for the next Docker 1 campaign: \`${FINAL_SHA}\`.
          Current main integrated additively: \`${MAIN_SHA}\`.

          Green before publication: protobuf/codegen/docs regeneration; count-only contract checks; targeted Buf; Go race tests and vet; Svelte/TypeScript; targeted Vitest and ESLint; frontend/docs builds; public-surface; REUSE/license; diff hygiene. All temporary read-receipts workflows are absent from the final tree.

          Not claimed: authenticated physical Docker 1 browser/PWA/device qualification. This is the next gate.

          ## Docker 1 validation requested

          Integrate \`#173@${FINAL_SHA}\` into a fresh additive aggregate. Do not reuse \`e2ea1937e58e76d6f8431d3066e804b0e644a405\`, merge to main, force-push, tag, release, or publish a release image. Revalidate count-only summaries, authorized paginated detail, DM/group/channel/thread behavior, server/user opt-out without backfill, realtime multi-tab/device propagation, visibility/focus gating, responsive/PWA/accessibility, and unread/notification/message regressions.

          ## Checklist

          - [x] Docker 1 privacy leak removed.
          - [x] Missing frontend component and full integration restored.
          - [x] Current main synchronized without code removal or force-push.
          - [x] Backend, frontend, realtime, bindings, docs, i18n, FDR, ADR, and tests included.
          - [x] Temporary workflows absent from final diff.
          - [x] Ready for a fresh Docker 1 qualification campaign.
          EOF
          jq -Rs '{body:.}' < "${body}" | curl --fail --silent --show-error --location --retry 3 \
            --request PATCH --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" --data-binary @- \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/173"

      - name: Upload finalizer proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: towk-read-receipts-finalizer-v2-proof
          path: ${{ runner.temp }}/read-receipts-finalizer-status.txt
          retention-days: 1
          if-no-files-found: error
