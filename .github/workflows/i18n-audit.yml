name: temporary main snapshot

on:
  push:
    branches:
      - fix/localization-completeness
    paths:
      - '.github/workflows/i18n-audit.yml'

concurrency:
  group: temporary-main-snapshot
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Pack current main source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude='**/node_modules' \
            --exclude='**/.svelte-kit' \
            --exclude='**/dist' \
            --exclude='**/coverage' \
            --exclude='**/playwright-report' \
            --exclude='**/test-results' \
            -czf towk-main-source-snapshot.tgz .

      - name: Upload current main source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: i18n-main-snapshot-${{ github.sha }}
          path: towk-main-source-snapshot.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Publish snapshot reference
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: '5080736416'
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          <!-- towk-i18n-audit-report -->
          ### Localization integration snapshot

          - Branch head: `${GITHUB_SHA}`
          - Main checked out: `${GITHUB_WORKFLOW_SHA}`
          - Workflow run ID: `${GITHUB_RUN_ID}`
          - Artifact: `i18n-main-snapshot-${GITHUB_SHA}`
          - Purpose: ephemeral current-main integration snapshot; not part of the final pull-request diff.
          EOF
          )
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
            -f body="$body"
