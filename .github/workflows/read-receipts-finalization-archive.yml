name: read-receipts reconciliation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: read-receipts-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'feat/read-receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Rebuild, validate, and publish the additive candidate
        id: reconcile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/pr173-reconcile.sh')
          source = path.read_text(encoding='utf-8')

          old = '''  git read-tree --reset -u "${feature_head}" >/dev/null 2>&1 || true
          git restore --staged --worktree . >/dev/null 2>&1 || true
          '''
          new = '''  git merge --abort >/dev/null 2>&1 || true
          git checkout --detach "${feature_head}" >/dev/null 2>&1 || true
          git restore --staged --worktree . >/dev/null 2>&1 || true
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one failure reset block, got {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''stage="merge-tree"
          if git read-tree -m -u "${DESIGN_BASE}" "${FEATURE_SOURCE}" "${EXPECTED_MAIN}"; then
            merge_status=0
          else
            merge_status=$?
          fi
          '''
          new = '''stage="prepare-tree"
          git checkout --detach "${FEATURE_SOURCE}"

          stage="merge-tree"
          if git merge --no-commit --no-ff "${EXPECTED_MAIN}"; then
            merge_status=0
          else
            merge_status=$?
          fi
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one merge-tree block, got {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''stage="publish"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          git commit -m 'fix(integration): reconcile privacy-aware read receipts with main [skip pr173-main-finalizer] [skip pr173-merge-diagnostic]'
          git push origin "HEAD:${TARGET_BRANCH}"
          trap - ERR
          '''
          new = '''stage="publish"
          git fetch --no-tags origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${feature_head}"
          candidate_tree="$(git write-tree)"
          candidate_commit="$(printf '%s\\n' 'fix(integration): reconcile privacy-aware read receipts with main [skip pr173-main-finalizer] [skip pr173-merge-diagnostic]' | git commit-tree "${candidate_tree}" -p "${feature_head}")"
          git push origin "${candidate_commit}:refs/heads/${TARGET_BRANCH}"
          printf 'candidate_commit=%s\\n' "${candidate_commit}"
          trap - ERR
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one publish block, got {source.count(old)}')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

          set +e
          set -o pipefail
          bash .github/scripts/pr173-reconcile.sh 2>&1 | tee "${RUNNER_TEMP}/pr173-reconcile.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "${status}"

      - name: Collect bounded reconciliation diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/pr173-reconciliation-diagnostics"
          mkdir -p "${output}"
          cp "${RUNNER_TEMP}/pr173-reconcile.log" "${output}/reconcile.log"
          if test -f .github/read-receipts-main-merge-finalizer-status.txt; then
            cp .github/read-receipts-main-merge-finalizer-status.txt "${output}/status.txt"
          fi
          {
            printf 'event_head=%s\n' "${{ github.event.pull_request.head.sha }}"
            printf 'step_outcome=%s\n' "${{ steps.reconcile.outcome }}"
            printf 'step_conclusion=%s\n' "${{ steps.reconcile.conclusion }}"
          } > "${output}/workflow.txt"
          tail -n 260 "${RUNNER_TEMP}/pr173-reconcile.log" > "${output}/reconcile-tail.log"

      - name: Upload reconciliation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr173-reconciliation-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr173-reconciliation-diagnostics
          retention-days: 1
          if-no-files-found: error

      - name: Preserve reconciliation failure
        if: steps.reconcile.outcome == 'failure'
        shell: bash
        run: exit 1
