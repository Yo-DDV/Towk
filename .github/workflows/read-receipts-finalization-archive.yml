name: read-receipts finalizer instrumentation

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-finalizer-instrumentation
  cancel-in-progress: true

jobs:
  instrument:
    if: ${{ contains(github.event.head_commit.message, '[run pr173-instrument]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Add bounded failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/read-receipts-main-merge-finalizer.yml')
          source = path.read_text(encoding='utf-8')

          old_status = '''              printf 'failed_stage=%s\\n' "${stage}"
              printf 'exit_code=%s\\n' "${code}"
          '''
          new_status = '''              printf 'failed_stage=%s\\n' "${stage}"
              printf 'exit_code=%s\\n' "${code}"
              printf 'run_id=%s\\n' "${GITHUB_RUN_ID}"
              printf 'run_attempt=%s\\n' "${GITHUB_RUN_ATTEMPT}"
          '''
          if source.count(old_status) != 1:
              raise SystemExit(f'expected one status block, got {source.count(old_status)}')
          source = source.replace(old_status, new_status, 1)

          old_contract = '''          stage=contract
          python3 - <<'PY'
          '''
          new_contract = '''          stage=contract-assertions
          python3 - <<'PY'
          '''
          if source.count(old_contract) != 1:
              raise SystemExit(f'expected one contract stage, got {source.count(old_contract)}')
          source = source.replace(old_contract, new_contract, 1)

          old_buf = '''          PY
          (cd proto && mise x -- buf build && mise x -- buf lint --path chatto/api/v1/read_state.proto --path chatto/core/v1/live_events.proto --path chatto/realtime/v1/realtime.proto)

          stage=backend
          '''
          new_buf = '''          PY

          stage=contract-buf-build
          (cd proto && mise x -- buf build)

          stage=contract-buf-lint
          (cd proto && mise x -- buf lint --path chatto/api/v1/read_state.proto --path chatto/core/v1/live_events.proto --path chatto/realtime/v1/realtime.proto)

          stage=backend
          '''
          if source.count(old_buf) != 1:
              raise SystemExit(f'expected one buf contract block, got {source.count(old_buf)}')
          source = source.replace(old_buf, new_buf, 1)

          path.write_text(source, encoding='utf-8')
          PY

          rm -f .github/workflows/read-receipts-finalizer-instrument.yml
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(ci): add bounded read receipt finalizer diagnostics [skip pr173-main-finalizer] [skip pr173-merge-diagnostic]'
          git push origin HEAD:feat/read-receipts
