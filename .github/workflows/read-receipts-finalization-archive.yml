name: read-receipts terminal finalization

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: read-receipts-terminal-finalization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/read-receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact temporary head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Reconstruct, validate, and publish the clean product tree
        id: terminal
        continue-on-error: true
        shell: bash
        env:
          PR173_DESIGN_BASE: b9f61f1b28608784c1e1ed1e2232131e681a12b3
          PR173_FEATURE_SOURCE: f07456ce30c48fd35d63fcc9d3480b5792f40cfa
          PR173_EXPECTED_MAIN: d277c59d2ebb16d076de6ae793e4679251be38b4
          TARGET_BRANCH: feat/read-receipts
        run: |
          set -euo pipefail
          cat .github/pr173-reconstruct.part00 \
              .github/pr173-reconstruct.part01 \
              .github/pr173-reconstruct.part02.00 \
              .github/pr173-reconstruct.part02.01 \
              .github/pr173-reconstruct.part02.02 \
              .github/pr173-reconstruct.part02.03 \
              .github/pr173-reconstruct.part02.04 \
              .github/pr173-reconstruct.part02.05 \
              .github/pr173-reconstruct.part03 \
              .github/pr173-reconstruct.part04 \
              > "${RUNNER_TEMP}/pr173-reconstruct.py.gz.b64"
          base64 -d .github/pr173-terminal.sh.gz.b64 | gzip -d > "${RUNNER_TEMP}/pr173-terminal.sh"
          sed -i 's#base64 -d \.github/pr173-reconstruct\.py\.gz\.b64#base64 -d "${RUNNER_TEMP}/pr173-reconstruct.py.gz.b64"#' "${RUNNER_TEMP}/pr173-terminal.sh"
          python3 - "${RUNNER_TEMP}/pr173-terminal.sh" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding='utf-8')
          needle = 'python3 "${RUNNER_TEMP}/pr173-reconstruct.py"\n'
          inserted = '''python3 "${RUNNER_TEMP}/pr173-reconstruct.py"
          python3 - <<'PYFIX'
          from pathlib import Path
          import re

          expected_counts = {
              'apps/frontend/src/lib/api-client/account.ts': 2,
              'apps/frontend/src/lib/api-client/viewer.ts': 1,
              'apps/frontend/src/lib/eventBus.svelte.ts': 2,
          }
          pattern = re.compile(r'(readReceiptsEnabled\??:\s*boolean;),')
          for name, expected_count in expected_counts.items():
              file_path = Path(name)
              text = file_path.read_text(encoding='utf-8')
              corrected, count = pattern.subn(lambda match: match.group(1), text)
              if count != expected_count:
                  raise SystemExit(
                      f'{name}: expected {expected_count} malformed merged declarations, got {count}'
                  )
              file_path.write_text(corrected, encoding='utf-8')
          PYFIX
          '''
          if source.count(needle) != 1:
              raise SystemExit(f'expected one reconstruction command, got {source.count(needle)}')
          path.write_text(source.replace(needle, inserted, 1), encoding='utf-8')
          PY
          chmod +x "${RUNNER_TEMP}/pr173-terminal.sh"
          set +e
          set -o pipefail
          bash -x "${RUNNER_TEMP}/pr173-terminal.sh" 2>&1 | tee "${RUNNER_TEMP}/pr173-terminal.log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "${status}" > "${RUNNER_TEMP}/pr173-terminal-status.txt"
          exit "${status}"

      - name: Collect bounded terminal diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/pr173-terminal-diagnostics"
          mkdir -p "${output}"
          cp "${RUNNER_TEMP}/pr173-terminal-status.txt" "${output}/status.txt" 2>/dev/null || true
          if test -f "${RUNNER_TEMP}/pr173-terminal.log"; then
            tail -n 420 "${RUNNER_TEMP}/pr173-terminal.log" > "${output}/terminal-tail.log"
          else
            printf '%s\n' 'terminal log was not created' > "${output}/terminal-tail.log"
          fi
          printf 'event_head=%s\nstep_outcome=%s\nstep_conclusion=%s\n' \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ steps.terminal.outcome }}" \
            "${{ steps.terminal.conclusion }}" \
            > "${output}/workflow.txt"

      - name: Upload terminal diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr173-terminal-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr173-terminal-diagnostics
          retention-days: 1
          if-no-files-found: error

      - name: Preserve terminal failure
        if: steps.terminal.outcome == 'failure'
        shell: bash
        run: exit 1
