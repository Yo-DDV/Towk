name: read-receipts finalizer instrumentation

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-finalizer-instrumentation
  cancel-in-progress: true

jobs:
  instrument:
    if: ${{ contains(github.event.head_commit.message, '[run pr173-instrument]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Add bounded failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/read-receipts-main-merge-finalizer.yml')
          source = path.read_text(encoding='utf-8')

          old = "              printf 'exit_code=%s\\n' \"${code}\"\n"
          new = old + "              printf 'run_id=%s\\n' \"${GITHUB_RUN_ID}\"\n" + "              printf 'run_attempt=%s\\n' \"${GITHUB_RUN_ATTEMPT}\"\n"
          if source.count(old) != 1:
              raise SystemExit(f'expected one exit-code status line, got {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '          stage=contract\n'
          new = '          stage=contract-assertions\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected one contract stage line, got {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '          (cd proto && mise x -- buf build && mise x -- buf lint --path chatto/api/v1/read_state.proto --path chatto/core/v1/live_events.proto --path chatto/realtime/v1/realtime.proto)\n'
          new = "          stage=contract-buf-build\n          (cd proto && mise x -- buf build)\n\n          stage=contract-buf-lint\n          (cd proto && mise x -- buf lint --path chatto/api/v1/read_state.proto --path chatto/core/v1/live_events.proto --path chatto/realtime/v1/realtime.proto)\n"
          if source.count(old) != 1:
              raise SystemExit(f'expected one buf contract line, got {source.count(old)}')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

          rm -f .github/workflows/read-receipts-finalizer-instrument.yml
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(ci): add bounded read receipt finalizer diagnostics [skip pr173-main-finalizer] [skip pr173-merge-diagnostic]'
          git push origin HEAD:feat/read-receipts
