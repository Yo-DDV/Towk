name: finalize profile dialog title

on:
  push:
    branches:
      - feat/user-profiles
    paths:
      - .github/workflows/pr182-finalize-dialog-title.yml

permissions:
  contents: write

concurrency:
  group: pr182-finalize-dialog-title
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out profile branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/user-profiles
          fetch-depth: 0
          persist-credentials: true

      - name: Remove the redundant visible dialog heading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              value = file.read_text(encoding='utf-8')
              if value.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {value.count(old)}')
              file.write_text(value.replace(old, new, 1), encoding='utf-8')

          dialog = 'apps/frontend/src/lib/ui/Dialog.svelte'
          replace_once(
              dialog,
              "    title,\n    size = 'md',",
              "    title,\n    ariaLabel,\n    size = 'md',",
          )
          replace_once(
              dialog,
              "    title?: string;\n    size?: 'sm' | 'md' | 'lg';",
              "    title?: string;\n    /** Accessible name used when the dialog does not render a visible title. */\n    ariaLabel?: string;\n    size?: 'sm' | 'md' | 'lg';",
          )
          replace_once(
              dialog,
              "  aria-labelledby={title ? titleId : undefined}\n  aria-describedby={describedBy}",
              "  aria-labelledby={title ? titleId : undefined}\n  aria-label={title ? undefined : ariaLabel}\n  aria-describedby={describedBy}",
          )

          menu = 'apps/frontend/src/lib/components/menus/UserContextMenu.svelte'
          replace_once(
              menu,
              "  title={m['chat.user_menu.profile']()}",
              "  ariaLabel={m['chat.user_menu.profile']()}",
          )

          spec = 'apps/frontend/src/lib/components/menus/UserContextMenu.svelte.spec.ts'
          replace_once(
              spec,
              "    await expect.element(q(container, '[data-testid=\"user-profile-dialog\"]')).toBeInTheDocument();\n    await vi.waitFor(() => expect(container.textContent).toContain('Moderator'));",
              "    await expect.element(q(container, '[data-testid=\"user-profile-dialog\"]')).toBeInTheDocument();\n    const dialog = container.querySelector('dialog');\n    if (!dialog) throw new Error('Expected the profile dialog to be rendered.');\n    expect(dialog.getAttribute('aria-label')).toBe('User profile');\n    expect(dialog.querySelector('header h2')).toBeNull();\n    await vi.waitFor(() => expect(container.textContent).toContain('Moderator'));",
          )
          PY

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'
          install-frontend-deps: 'true'

      - name: Format, lint, type-check, and test the profile dialog
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @towk/api-types build
          pnpm --dir apps/frontend exec prettier --write \
            src/lib/ui/Dialog.svelte \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts
          pnpm --dir apps/frontend exec eslint \
            src/lib/ui/Dialog.svelte \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts
          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec playwright install --with-deps chromium
          VITEST_BROWSER=chromium pnpm --dir apps/frontend exec vitest run --project client \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts
          git diff --check

      - name: Publish the final profile correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr182-finalize-dialog-title.yml
          git add \
            .github/workflows/pr182-finalize-dialog-title.yml \
            apps/frontend/src/lib/ui/Dialog.svelte \
            apps/frontend/src/lib/components/menus/UserContextMenu.svelte \
            apps/frontend/src/lib/components/menus/UserContextMenu.svelte.spec.ts
          git diff --cached --check
          test -z "$(git diff --cached | grep -Ei '(^|[[:space:]])(Co-authored-by|Generated-by|Assisted-by|Pair-programmed-by):' || true)"
          author_name=$(git show -s --format=%an HEAD)
          author_email=$(git show -s --format=%ae HEAD)
          GIT_AUTHOR_NAME="$author_name" GIT_AUTHOR_EMAIL="$author_email" \
          GIT_COMMITTER_NAME="$author_name" GIT_COMMITTER_EMAIL="$author_email" \
            git commit -m 'fix(profiles): remove redundant dialog heading'
          git push origin HEAD:feat/user-profiles
