name: read-receipts final remediation publisher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: read-receipts-final-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-publish-tree:
    if: github.event.pull_request.head.ref == 'feat/read-receipts'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull request merge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Verify merge parents
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          parents="$(git show -s --format=%P HEAD)"
          test "$(wc -w <<< "${parents}")" -eq 2
          case " ${parents} " in
            *" ${current_main} "*) ;;
            *) echo "merge parent missing current main ${current_main}: ${parents}" >&2; exit 11 ;;
          esac
          case " ${parents} " in
            *" ${EXPECTED_HEAD_SHA} "*) ;;
            *) echo "merge parent missing PR head ${EXPECTED_HEAD_SHA}: ${parents}" >&2; exit 12 ;;
          esac
          {
            printf 'merge_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'main_sha=%s\n' "${current_main}"
            printf 'head_sha=%s\n' "${EXPECTED_HEAD_SHA}"
            printf 'parents=%s\n' "${parents}"
          } > "${RUNNER_TEMP}/read-receipts-remediation-identity.txt"

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Apply privacy remediation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_GZIP_SHA256: b417f306713672f4cdce90e3098999fa2b2a20b515896c479cb1856762ba2f27
          PATCH_SHA256: ed06045e6a501fd4a4b47442daf16b3abfbba3138352a9af1b0c2003e764ff9c
          PATCH_PART_SHAS: >-
            e48d04421ffc32f2985bf7bdd46956419db2f4e2
            4e651e6b972f1f12031b7ddad6c638b093dcb250
        run: |
          set -euo pipefail
          encoded="${RUNNER_TEMP}/read-receipts-remediation.patch.gz.b64"
          archive="${RUNNER_TEMP}/read-receipts-remediation.patch.gz"
          patch="${RUNNER_TEMP}/read-receipts-remediation.patch"
          : > "${encoded}"

          for sha in ${PATCH_PART_SHAS}; do
            chunk="${RUNNER_TEMP}/read-receipts-remediation-${sha}.part"
            curl --fail --silent --show-error --location --retry 3 \
              --header "Accept: application/vnd.github.raw+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              > "${chunk}"
            test "$(git hash-object "${chunk}")" = "${sha}"
            cat "${chunk}" >> "${encoded}"
          done

          base64 -d "${encoded}" > "${archive}"
          printf '%s  %s\n' "${PATCH_GZIP_SHA256}" "${archive}" | sha256sum --check --strict
          gzip -dc "${archive}" > "${patch}"
          printf '%s  %s\n' "${PATCH_SHA256}" "${patch}" | sha256sum --check --strict
          git apply --check --verbose "${patch}"
          git apply "${patch}"
          git diff --check

      - name: Apply current-main frontend compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMPAT_PATCH_BLOB_SHA: f12b1b4277d103f7d6b742fe1d442bbbcc2d2500
          COMPAT_PATCH_SHA256: c8e173a44287692814a7ddcd94843ae00b86d14ee54d34091ce526f6b93964a8
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/read-receipts-main-compat.patch"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Accept: application/vnd.github.raw+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${COMPAT_PATCH_BLOB_SHA}" \
            > "${patch}"
          test "$(git hash-object "${patch}")" = "${COMPAT_PATCH_BLOB_SHA}"
          printf '%s  %s\n' "${COMPAT_PATCH_SHA256}" "${patch}" | sha256sum --check --strict
          git apply --check --verbose "${patch}"
          git apply "${patch}"
          git diff --check

      - name: Verify remediation source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx '  reserved 3;' proto/chatto/api/v1/read_state.proto
          grep -Fqx '  reserved "preview_user_ids";' proto/chatto/api/v1/read_state.proto
          ! grep -En 'PreviewUserIds|previewUserIds' \
            cli/internal/connectapi/read_state.go \
            cli/internal/core/read_receipts.go
          test -f 'apps/frontend/src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte'
          test -f 'apps/frontend/src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.ts'
          test -f docs/fdr/FDR-031-read-receipts.md
          test -f docs/adr/ADR-054-read-receipt-publication-boundary.md
          ! grep -Fq "room.message.meta.read_receipts" \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte'
          ! grep -Fq 'reader.user.' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte'

      - name: Regenerate protobuf bindings and build API types
        shell: bash
        run: |
          set -euo pipefail
          mise run codegen-proto
          pnpm --dir packages/api-types run build

      - name: Verify count-only summary schema
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx '  reserved "preview_user_ids";' proto/chatto/api/v1/read_state.proto
          ! grep -En 'PreviewUserIds|GetPreviewUserIds' \
            cli/internal/pb/chatto/api/v1/read_state.pb.go
          ! grep -En 'previewUserIds' \
            packages/api-types/src/chatto/api/v1/read_state_pb.ts
          python3 - <<'PY'
          from pathlib import Path

          anchor = '<a id="chatto-api-v1-ReadReceiptSummary"></a>'
          paths = (
              Path('apps/docs-website/src/generated/connectrpc-api/api.raw.mdx'),
              Path('apps/docs-website/src/content/docs/reference/connectrpc-api/types.mdx'),
          )

          for path in paths:
              text = path.read_text(encoding='utf-8')
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit(f'{path}: ReadReceiptSummary anchor missing')
              end = text.find('\n<a id="', start + len(anchor))
              section = text[start:] if end < 0 else text[start:end]
              if '| `reader_count` |' not in section:
                  raise SystemExit(f'{path}: reader_count missing from ReadReceiptSummary')
              if 'preview_user_ids' in section:
                  raise SystemExit(f'{path}: preview_user_ids leaked from ReadReceiptSummary')
          PY

      - name: Validate protobuf surface
        shell: bash
        run: |
          set -euo pipefail
          cd proto
          buf build
          buf lint --path chatto/api/v1/read_state.proto

      - name: Test affected backend under race
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -race -trimpath -tags test_endpoints \
            ./internal/core ./internal/connectapi ./internal/http_server ./internal/events \
            -run 'ReadReceipt|ReadReceipts|UserSettings|ServerUserPreferences|Subject' \
            -count=1
          go vet ./internal/core ./internal/connectapi ./internal/http_server ./internal/events

      - name: Check formatting and frontend types
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec prettier --check \
            messages/de/room.json \
            messages/en/room.json \
            messages/es/room.json \
            messages/fr/room.json \
            messages/pt/room.json \
            'src/routes/chat/[serverId]/[roomId]/MessageEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte'
          pnpm --dir apps/frontend run check

      - name: Test affected frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec vitest --run \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client-tests/viewer.spec.ts \
            src/lib/api-client-tests/serverState.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts'
          pnpm --dir apps/frontend exec eslint \
            src/lib/ServerSettings.svelte \
            src/lib/api-client/readState.ts \
            src/lib/api-client/serverState.ts \
            src/lib/api-client/viewer.ts \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.ts \
            src/lib/state/userSettings.svelte.ts \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/MessageEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/MessageMetaBar.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ThreadPane.svelte' \
            'src/routes/chat/[serverId]/[roomId]/TimelineEventsPane.svelte' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/+page.svelte'

      - name: Build frontend and docs
        shell: bash
        run: |
          set -euo pipefail
          mise run build-frontend
          pnpm run build:docs
          mise run public-surface-check

      - name: Check license and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          mise run license-check
          git diff --check

      - name: Create validated final tree
        id: final_tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="${RUNNER_TEMP}/read-receipts-remediation-files.txt"
          allowed="${RUNNER_TEMP}/read-receipts-remediation-allowed.txt"
          entries="${RUNNER_TEMP}/read-receipts-remediation-entries.json"
          response="${RUNNER_TEMP}/read-receipts-remediation-tree.json"
          status_file="${RUNNER_TEMP}/read-receipts-remediation-status.txt"
          base_tree="$(git show -s --format=%T HEAD)"
          current_main="$(git rev-parse HEAD^1)"

          printf '%s\n' \
            'apps/docs-website/src/content/docs/reference/connectrpc-api/types.mdx' \
            'apps/docs-website/src/generated/connectrpc-api/api.raw.mdx' \
            'apps/frontend/messages/de/room.json' \
            'apps/frontend/messages/de/server_settings.json' \
            'apps/frontend/messages/en/room.json' \
            'apps/frontend/messages/en/server_settings.json' \
            'apps/frontend/messages/es/room.json' \
            'apps/frontend/messages/es/server_settings.json' \
            'apps/frontend/messages/fr/room.json' \
            'apps/frontend/messages/fr/server_settings.json' \
            'apps/frontend/messages/pt/room.json' \
            'apps/frontend/messages/pt/server_settings.json' \
            'apps/frontend/src/lib/ServerSettings.svelte' \
            'apps/frontend/src/lib/api-client-tests/account.spec.ts' \
            'apps/frontend/src/lib/api-client-tests/serverState.spec.ts' \
            'apps/frontend/src/lib/api-client/serverState.ts' \
            'apps/frontend/src/lib/api-client/viewer.ts' \
            'apps/frontend/src/lib/i18n/messages.ts' \
            'apps/frontend/src/lib/state/server/store.svelte.spec.ts' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/MessageEvent.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/MessageMetaBar.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/ThreadPane.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/TimelineEventsPane.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.ts' \
            'cli/internal/connectapi/read_state.go' \
            'cli/internal/connectapi/read_state_privacy_test.go' \
            'cli/internal/core/read_receipts.go' \
            'cli/internal/pb/chatto/api/v1/read_state.pb.go' \
            'docs/adr/ADR-054-read-receipt-publication-boundary.md' \
            'docs/adr/INDEX.md' \
            'docs/fdr/FDR-031-read-receipts.md' \
            'packages/api-types/src/chatto/api/v1/read_state_pb.ts' \
            'proto/chatto/api/v1/read_state.proto' > "${allowed}"
          sort -u -o "${allowed}" "${allowed}"

          git diff --name-status HEAD > "${files}"
          git ls-files --others --exclude-standard | sed 's/^/A\t/' >> "${files}"
          sort -u -o "${files}" "${files}"

          while IFS=$'\t' read -r change path; do
            test -n "${path}"
            grep -Fxq "${path}" "${allowed}" || {
              echo "Unexpected generated or build modification: ${change} ${path}" >&2
              exit 70
            }
          done < "${files}"

          printf '[]' > "${entries}"
          while IFS=$'\t' read -r change path; do
            test -n "${path}"
            if [[ "${change}" = D* ]]; then
              jq --arg path "${path}" \
                '. + [{path: $path, mode: "100644", type: "blob", sha: null}]' \
                "${entries}" > "${entries}.next"
              mv "${entries}.next" "${entries}"
              continue
            fi

            test -f "${path}"
            blob_sha="$({
              base64 -w0 "${path}" \
                | jq -Rs '{content: ., encoding: "base64"}' \
                | curl --fail --silent --show-error --location --retry 3 \
                    --request POST \
                    --header "Accept: application/vnd.github+json" \
                    --header "Authorization: Bearer ${GH_TOKEN}" \
                    --header "X-GitHub-Api-Version: 2022-11-28" \
                    --data-binary @- \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
                | jq -er '.sha'
            })"
            test "$(git hash-object "${path}")" = "${blob_sha}"
            jq --arg path "${path}" --arg sha "${blob_sha}" \
              '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' \
              "${entries}" > "${entries}.next"
            mv "${entries}.next" "${entries}"
          done < "${files}"

          for temporary_path in \
            '.github/workflows/read-receipts-remediation.yml' \
            '.github/workflows/read-receipts-frontend-diagnostic.yml'
          do
            jq --arg path "${temporary_path}" \
              '. + [{path: $path, mode: "100644", type: "blob", sha: null}]' \
              "${entries}" > "${entries}.next"
            mv "${entries}.next" "${entries}"
          done

          jq -n --arg base_tree "${base_tree}" --slurpfile tree "${entries}" \
            '{base_tree: $base_tree, tree: $tree[0]}' \
            | curl --fail --silent --show-error --location --retry 3 \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary @- \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/trees" \
            | tee "${response}"

          tree_sha="$(jq -er '.sha' "${response}")"
          printf 'tree_sha=%s\n' "${tree_sha}" >> "${GITHUB_OUTPUT}"
          {
            printf 'source_head_sha=%s\n' "${SOURCE_HEAD_SHA}"
            printf 'main_sha=%s\n' "${current_main}"
            printf 'merge_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'tree_sha=%s\n' "${tree_sha}"
            printf 'files_sha256=%s\n' "$(sha256sum "${files}" | cut -d' ' -f1)"
            printf 'privacy_schema=count-only\n'
            printf 'protobuf=success\n'
            printf 'backend=success\n'
            printf 'frontend=success\n'
            printf 'build=success\n'
            printf 'license=success\n'
          } > "${status_file}"

      - name: Upload remediation proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: towk-read-receipts-final-remediation-tree
          path: |
            ${{ runner.temp }}/read-receipts-remediation-identity.txt
            ${{ runner.temp }}/read-receipts-remediation-tree.json
            ${{ runner.temp }}/read-receipts-remediation-status.txt
            ${{ runner.temp }}/read-receipts-remediation-files.txt
          retention-days: 1
          if-no-files-found: warn
