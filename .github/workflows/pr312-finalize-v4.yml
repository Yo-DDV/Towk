name: pr312 preparation diagnosis

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-final-clean
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'chore(ci): record PR 312 diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Fetch blob
        id: fetch_blob
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/blobs/1e35f3e90ca24587fd326d4dd22691a7b7b1f3c1" \
            > /tmp/pr312-blob.json
          jq -e '.encoding == "base64" and (.content | type == "string")' /tmp/pr312-blob.json
          jq -r '.content' /tmp/pr312-blob.json | tr -d '\n' | base64 --decode \
            > /tmp/pr312-remediation.patch.gz
          test -s /tmp/pr312-remediation.patch.gz

      - name: Verify checksum
        id: checksum
        if: steps.fetch_blob.outcome == 'success'
        continue-on-error: true
        run: >-
          echo 'e728dbb49039fe94ca0f4c6d52786fed421c7a29de61eeaebc16b27dafeedb4f  /tmp/pr312-remediation.patch.gz'
          | sha256sum -c -

      - name: Verify gzip
        id: gzip
        if: steps.checksum.outcome == 'success'
        continue-on-error: true
        run: gzip --test /tmp/pr312-remediation.patch.gz

      - name: Decompress patch
        id: decompress
        if: steps.gzip.outcome == 'success'
        continue-on-error: true
        run: gzip --decompress --stdout /tmp/pr312-remediation.patch.gz > /tmp/pr312-remediation.patch

      - name: Check patch applicability
        id: patch_check
        if: steps.decompress.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if patch -p1 --forward --batch --dry-run < /tmp/pr312-remediation.patch; then
            echo forward > /tmp/pr312-patch-direction
          elif patch -p1 --reverse --batch --dry-run < /tmp/pr312-remediation.patch; then
            echo reverse > /tmp/pr312-patch-direction
          else
            exit 1
          fi

      - name: Apply patch
        id: patch_apply
        if: steps.patch_check.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          direction="$(cat /tmp/pr312-patch-direction)"
          if test "${direction}" = forward; then
            patch -p1 --forward --batch < /tmp/pr312-remediation.patch
          else
            echo 'Patch already applied.'
          fi

      - name: Format changed Go files
        id: gofmt
        if: steps.patch_apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_go < <(
            { git diff --name-only; git ls-files --others --exclude-standard; } \
              | grep -E '\.go$' | sort -u
          )
          if test "${#changed_go[@]}" -gt 0; then
            gofmt -w "${changed_go[@]}"
          fi

      - name: Check diff
        id: diff_check
        if: steps.gofmt.outcome == 'success'
        continue-on-error: true
        run: git diff --check

      - name: Record diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage='PREPARE_SUCCESS'
          test '${{ steps.fetch_blob.outcome }}' = success || stage='FETCH_BLOB_FAILED'
          if test "${stage}" = PREPARE_SUCCESS; then test '${{ steps.checksum.outcome }}' = success || stage='CHECKSUM_FAILED'; fi
          if test "${stage}" = PREPARE_SUCCESS; then test '${{ steps.gzip.outcome }}' = success || stage='GZIP_FAILED'; fi
          if test "${stage}" = PREPARE_SUCCESS; then test '${{ steps.decompress.outcome }}' = success || stage='DECOMPRESS_FAILED'; fi
          if test "${stage}" = PREPARE_SUCCESS; then test '${{ steps.patch_check.outcome }}' = success || stage='PATCH_CHECK_FAILED'; fi
          if test "${stage}" = PREPARE_SUCCESS; then test '${{ steps.patch_apply.outcome }}' = success || stage='PATCH_APPLY_FAILED'; fi
          if test "${stage}" = PREPARE_SUCCESS; then test '${{ steps.gofmt.outcome }}' = success || stage='GOFMT_FAILED'; fi
          if test "${stage}" = PREPARE_SUCCESS; then test '${{ steps.diff_check.outcome }}' = success || stage='DIFF_CHECK_FAILED'; fi
          git restore --source=HEAD --staged --worktree .
          while IFS= read -r -d '' path; do rm -rf -- "${path}"; done < <(git ls-files --others --exclude-standard -z)
          rm -rf .github/pr312-diag
          mkdir -p .github/pr312-diag
          : > ".github/pr312-diag/${stage}"
          git add .github/pr312-diag
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' \
            commit -m 'chore(ci): record PR 312 diagnostic'
          git push origin HEAD:feat/localized-default-grades
