name: pr312 pnpm bootstrap diagnosis

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-final-clean
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'chore(ci): record PR 312 diagnostic v10'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Check Node
        id: node
        continue-on-error: true
        run: node --version

      - name: Check npm
        id: npm
        continue-on-error: true
        run: npm --version

      - name: Check Go
        id: go
        continue-on-error: true
        run: go version

      - name: Read package manager
        id: spec
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          spec="$(node -p "require('./package.json').packageManager")"
          version="${spec#pnpm@}"
          version="${version%%+*}"
          test "${spec}" != undefined
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install locked pnpm
        id: pnpm_install
        if: steps.spec.outcome == 'success'
        continue-on-error: true
        run: npm install --global "pnpm@${{ steps.spec.outputs.version }}"

      - name: Resolve pnpm
        id: pnpm
        if: steps.pnpm_install.outcome == 'success'
        continue-on-error: true
        run: pnpm --version

      - name: Install dependencies
        id: install
        if: steps.pnpm.outcome == 'success'
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Record diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage='V10_SETUP_SUCCESS'
          test '${{ steps.node.outcome }}' = success || stage='V10_NODE_FAILED'
          if test "${stage}" = V10_SETUP_SUCCESS; then test '${{ steps.npm.outcome }}' = success || stage='V10_NPM_MISSING'; fi
          if test "${stage}" = V10_SETUP_SUCCESS; then test '${{ steps.go.outcome }}' = success || stage='V10_GO_FAILED'; fi
          if test "${stage}" = V10_SETUP_SUCCESS; then test '${{ steps.spec.outcome }}' = success || stage='V10_PACKAGE_MANAGER_FAILED'; fi
          if test "${stage}" = V10_SETUP_SUCCESS; then test '${{ steps.pnpm_install.outcome }}' = success || stage='V10_PNPM_INSTALL_FAILED'; fi
          if test "${stage}" = V10_SETUP_SUCCESS; then test '${{ steps.pnpm.outcome }}' = success || stage='V10_PNPM_RESOLVE_FAILED'; fi
          if test "${stage}" = V10_SETUP_SUCCESS; then test '${{ steps.install.outcome }}' = success || stage='V10_DEPENDENCIES_FAILED'; fi
          rm -rf .github/pr312-diag
          mkdir -p .github/pr312-diag
          : > ".github/pr312-diag/${stage}"
          git add .github/pr312-diag
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'chore(ci): record PR 312 diagnostic v10'
          git push origin HEAD:feat/localized-default-grades
