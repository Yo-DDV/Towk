name: pr173 exact terminal finalization

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: pr173-exact-terminal-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[run pr173-terminal-exact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Publish and validate exact terminal head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/pr173-terminal-exact.sh

      - name: Upload terminal handoff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr173-terminal-handoff-${{ github.sha }}
          path: |
            /tmp/pr173-terminal-result.txt
            /tmp/pr173-codex-docker1-prompt.txt
          retention-days: 7
          if-no-files-found: warn
