name: presence product publication

on:
  push:
    branches:
      - feat/pwa-presence-leases

concurrency:
  group: presence-product-publication
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  qualify-and-publish:
    name: qualify-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish run coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg state pending \
            --arg context 'presence-product-publication' \
            --arg description "qualification run ${GITHUB_RUN_ID}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Materialize hardened candidate on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git -c user.name='Yo-DDV' \
              -c user.email='116607353+Yo-DDV@users.noreply.github.com' \
              merge --no-edit origin/main

          cat .github/presence-source/chunk-*.txt | base64 -d > /tmp/presence-source.tar.gz
          tar -xzf /tmp/presence-source.tar.gz -C .

          cat .github/presence-source/hardened-[0-9][0-9].txt | \
            base64 -d > /tmp/presence-hardened-overlay.tar.gz
          test "$(sha256sum /tmp/presence-hardened-overlay.tar.gz | cut -d' ' -f1)" = \
            f95fae79f6e4f271187c89a655bc907e8935cfe38d80ba3e62b2dd543e16542e
          tar -xzf /tmp/presence-hardened-overlay.tar.gz -C .

          cat .github/presence-source/hardening2-[0-9][0-9].txt | \
            base64 -d > /tmp/presence-ordering-overlay.tar.gz
          test "$(sha256sum /tmp/presence-ordering-overlay.tar.gz | cut -d' ' -f1)" = \
            8ee913b0d1565b0efddc07b791b59b61d98e3eed317d0babf82935711f5cb7df
          tar -xzf /tmp/presence-ordering-overlay.tar.gz -C .

          gofmt -w \
            cli/internal/core/presence.go \
            cli/internal/core/presence_model.go \
            cli/internal/core/presence_session.go \
            cli/internal/core/presence_session_hub.go \
            cli/internal/core/presence_session_test.go \
            cli/internal/connectapi/presence.go \
            cli/internal/connectapi/presence_session_test.go

          rm -rf .github/presence-source
          rm -f .github/workflows/presence-candidate.yml
          git diff --check

      - name: Setup repository toolchain
        uses: ./.github/actions/setup

      - name: Generate bindings
        shell: bash
        run: |
          set -euo pipefail
          mise codegen-proto
          pnpm --dir packages/api-types run build

      - name: Focused backend qualification
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -trimpath ./internal/core ./internal/connectapi -run 'Presence|LastActivity' -count=1
          go test -race -trimpath ./internal/core ./internal/connectapi -run 'Presence' -count=1
          go vet ./internal/core ./internal/connectapi

      - name: Focused frontend qualification
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec vitest run \
            src/lib/api-client/presence.spec.ts \
            src/lib/presenceTracking.spec.ts \
            src/lib/auth/signOut.spec.ts
          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec eslint \
            src/lib/api-client/presence.ts \
            src/lib/api-client/presence.spec.ts \
            src/lib/presenceTracking.ts \
            src/lib/presenceTracking.spec.ts \
            src/lib/auth/signOut.ts \
            src/lib/auth/signOut.spec.ts
          mise build-frontend

      - name: Repository quality gate
        shell: bash
        env:
          TOWK_LOCAL_WORKERS: '4'
        run: |
          set -euo pipefail
          mise test

      - name: Build clean product commit from current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary origin/main > /tmp/presence-product.patch
          test -s /tmp/presence-product.patch

          if git diff --name-only origin/main | grep -E '^\.github/(presence-source/|workflows/presence-candidate\.yml$)'; then
            echo 'temporary transfer surface leaked into product diff' >&2
            exit 1
          fi
          if git diff origin/main | grep -Ei 'Co-authored-by:|Generated-by:|Assisted-by:|Pair-programmed-by:'; then
            echo 'forbidden authorship trailer found' >&2
            exit 1
          fi

          git worktree add /tmp/presence-product origin/main
          cd /tmp/presence-product
          git switch -c feat/resilient-pwa-presence
          git apply --index --whitespace=error /tmp/presence-product.patch
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

          if git ls-files | grep -E '^\.github/(presence-source/|workflows/presence-candidate\.yml$)'; then
            echo 'temporary transfer surface exists in product tree' >&2
            exit 1
          fi

          git -c user.name='Yo-DDV' \
              -c user.email='116607353+Yo-DDV@users.noreply.github.com' \
              commit -m 'feat(presence): add resilient PWA presence leases'
          product_sha=$(git rev-parse HEAD)
          git push origin HEAD:refs/heads/feat/resilient-pwa-presence
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"

      - name: Publish exact product status
        if: ${{ steps.publish.outputs.product_sha != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_SHA: ${{ steps.publish.outputs.product_sha }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg state success \
            --arg context 'presence-product-publication' \
            --arg description "qualified and published by run ${GITHUB_RUN_ID}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${PRODUCT_SHA}" \
            -d "$payload" >/dev/null
