name: read-receipts realtime privacy finalizer

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-realtime-privacy-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip read-receipts-privacy]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up repository toolchain
        id: setup
        continue-on-error: true
        uses: ./.github/actions/setup

      - name: Apply anonymous realtime invalidation contract
        id: patch
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              if source.count(old) != 1:
                  raise SystemExit(f'unexpected source state for {path}: expected one exact match, got {source.count(old)}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'proto/chatto/core/v1/live_events.proto',
              '''// PublicReadReceiptAdvancedEvent carries a compact room-scoped cursor delta.
          // Reader lists are fetched separately through the authenticated API.
          message PublicReadReceiptAdvancedEvent {
            string room_id = 1;
            optional string thread_root_event_id = 2;
            string user_id = 3;
            string event_id = 4;
            uint64 event_sequence = 5;
            google.protobuf.Timestamp read_at = 6;
          }
          ''',
              '''// PublicReadReceiptAdvancedEvent is an anonymous room-scoped invalidation.
          // Clients refetch authorized count-only summaries; reader identity, read time,
          // target message and sequence remain behind the explicit paginated detail API.
          message PublicReadReceiptAdvancedEvent {
            reserved 3, 4, 5, 6;
            reserved "user_id", "event_id", "event_sequence", "read_at";

            string room_id = 1;
            optional string thread_root_event_id = 2;
          }
          ''',
          )

          replace_once(
              'proto/chatto/realtime/v1/realtime.proto',
              '''// Compact public read-receipt cursor delta.
          //
          // Clients use this as an invalidation signal and refetch bounded summaries for
          // rendered messages through `RoomService.GetReadReceiptSummaries`.
          message RealtimeReadReceiptAdvancedEvent {
            // Room containing the affected timeline.
            string room_id = 1;
            // Thread root when the cursor belongs to a thread timeline.
            optional string thread_root_event_id = 2;
            // User whose public cursor advanced.
            string user_id = 3;
            // Highest message event covered by the advance.
            string event_id = 4;
            // Monotonic room-stream sequence for event_id.
            uint64 event_sequence = 5;
            // Server-recorded time of the advance.
            google.protobuf.Timestamp read_at = 6;
          }
          ''',
              '''// Anonymous public read-receipt invalidation.
          //
          // Clients refetch authorized count-only summaries for rendered messages through
          // `RoomService.GetReadReceiptSummaries`. Reader identity, read time, target
          // message and sequence are intentionally excluded from the realtime stream.
          message RealtimeReadReceiptAdvancedEvent {
            reserved 3, 4, 5, 6;
            reserved "user_id", "event_id", "event_sequence", "read_at";

            // Room containing the affected timeline.
            string room_id = 1;
            // Thread root when the invalidation belongs to a thread timeline.
            optional string thread_root_event_id = 2;
          }
          ''',
          )

          replace_once(
              'cli/internal/core/read_receipts.go',
              '''		s.publishAdvance(ctx, actorID, kind, room.GetId(), threadRootEventID, advance)
          ''',
              '''		s.publishAdvance(ctx, kind, room.GetId(), threadRootEventID, advance)
          ''',
          )
          replace_once(
              'cli/internal/core/read_receipts.go',
              '''func (s *ReadReceiptModel) publishAdvance(ctx context.Context, actorID string, kind RoomKind, roomID, threadRootEventID string, advance *ReadReceiptAdvance) {
          	if advance == nil || !advance.Updated {
          		return
          	}
          	event := newLiveEvent(actorID, &corev1.LiveEvent{Event: &corev1.LiveEvent_PublicReadReceiptAdvanced{
          		PublicReadReceiptAdvanced: &corev1.PublicReadReceiptAdvancedEvent{
          			RoomId:            roomID,
          			ThreadRootEventId: optionalString(threadRootEventID),
          			UserId:            actorID,
          			EventId:           advance.EventID,
          			EventSequence:     advance.EventSequence,
          			ReadAt:            timestamppb.New(advance.ReadAt),
          		},
          	}})
          	if err := s.core.publishLiveEvent(ctx, subjects.LiveSyncRoomEvent(string(kind), roomID, "read_receipt"), event); err != nil {
          		s.core.logger.Warn("failed to publish public read receipt delta", "error", err)
          	}
          }
          ''',
              '''func (s *ReadReceiptModel) publishAdvance(ctx context.Context, kind RoomKind, roomID, threadRootEventID string, advance *ReadReceiptAdvance) {
          	if advance == nil || !advance.Updated {
          		return
          	}
          	event := newLiveEvent("", &corev1.LiveEvent{Event: &corev1.LiveEvent_PublicReadReceiptAdvanced{
          		PublicReadReceiptAdvanced: &corev1.PublicReadReceiptAdvancedEvent{
          			RoomId:            roomID,
          			ThreadRootEventId: optionalString(threadRootEventID),
          		},
          	}})
          	// This room-wide signal is an anonymous invalidation. Keeping the live
          	// envelope free of actor and creation metadata prevents identity or read
          	// timing from escaping through alternate realtime adapters.
          	event.ActorId = ""
          	event.CreatedAt = nil
          	if err := s.core.publishLiveEvent(ctx, subjects.LiveSyncRoomEvent(string(kind), roomID, "read_receipt"), event); err != nil {
          		s.core.logger.Warn("failed to publish public read receipt invalidation", "error", err)
          	}
          }
          ''',
          )

          replace_once(
              'cli/internal/core/my_events_model.go',
              '''		if event.GetPublicReadReceiptAdvanced() != nil {
          			enabled, _ := s.core.ReadReceipts().Policy(userID)
          			if !enabled {
          				return nil, false
          			}
          		}
          ''',
              '''		if receipt := event.GetPublicReadReceiptAdvanced(); receipt != nil {
          			enabled, _ := s.core.ReadReceipts().Policy(userID)
          			if !enabled {
          				return nil, false
          			}
          			// Rebuild the event at the authorization boundary. This also strips
          			// legacy unknown fields from mixed-version producers and guarantees
          			// that no actor or read timestamp reaches downstream adapters.
          			event = &corev1.LiveEvent{
          				Id: event.GetId(),
          				Event: &corev1.LiveEvent_PublicReadReceiptAdvanced{
          					PublicReadReceiptAdvanced: &corev1.PublicReadReceiptAdvancedEvent{
          						RoomId:            receipt.GetRoomId(),
          						ThreadRootEventId: optionalString(receipt.GetThreadRootEventId()),
          					},
          				},
          			}
          		}
          ''',
          )

          replace_once(
              'cli/internal/http_server/realtime.go',
              '''	case *corev1.LiveEvent_PublicReadReceiptAdvanced:
          		receipt := payload.PublicReadReceiptAdvanced
          		envelope.Event = &realtimev1.RealtimeEventEnvelope_ReadReceiptAdvanced{ReadReceiptAdvanced: &realtimev1.RealtimeReadReceiptAdvancedEvent{
          			RoomId:            receipt.GetRoomId(),
          			ThreadRootEventId: receipt.ThreadRootEventId,
          			UserId:            receipt.GetUserId(),
          			EventId:           receipt.GetEventId(),
          			EventSequence:     receipt.GetEventSequence(),
          			ReadAt:            receipt.GetReadAt(),
          		}}
          ''',
              '''	case *corev1.LiveEvent_PublicReadReceiptAdvanced:
          		receipt := payload.PublicReadReceiptAdvanced
          		// Read-receipt realtime delivery is an anonymous invalidation. The
          		// explicitly authorized paginated detail API owns identity and time.
          		envelope.CreatedAt = nil
          		envelope.ActorId = nil
          		envelope.Event = &realtimev1.RealtimeEventEnvelope_ReadReceiptAdvanced{ReadReceiptAdvanced: &realtimev1.RealtimeReadReceiptAdvancedEvent{
          			RoomId:            receipt.GetRoomId(),
          			ThreadRootEventId: receipt.ThreadRootEventId,
          		}}
          ''',
          )

          for path in (
              'apps/frontend/src/lib/api-client/renderTypes.ts',
              'apps/frontend/src/lib/eventBus.svelte.ts',
          ):
              replace_once(
                  path,
                  '''  | {
                kind: typeof RoomEventKind.ReadReceiptAdvanced;
                roomId: string;
                threadRootEventId?: string | null;
                userId: string;
                eventId: string;
                readAt?: string | null;
              }
          ''' if path.endswith('eventBus.svelte.ts') else '''  | {
                kind: 'readReceiptAdvanced';
                roomId: string;
                threadRootEventId?: string | null;
                userId: string;
                eventId: string;
                readAt?: string | null;
              }
          ''',
                  '''  | {
                kind: typeof RoomEventKind.ReadReceiptAdvanced;
                roomId: string;
                threadRootEventId?: string | null;
              }
          ''' if path.endswith('eventBus.svelte.ts') else '''  | {
                kind: 'readReceiptAdvanced';
                roomId: string;
                threadRootEventId?: string | null;
              }
          ''',
              )

          replace_once(
              'apps/frontend/src/lib/realtimeEventMapper.ts',
              '''    case 'readReceiptAdvanced': {
                const value = frame.event.value;
                return {
                  ...base,
                  event: {
                    kind: RoomEventKind.ReadReceiptAdvanced,
                    roomId: value.roomId,
                    threadRootEventId: value.threadRootEventId ?? null,
                    userId: value.userId,
                    eventId: value.eventId,
                    readAt: optionalTimestampToISO(value.readAt)
                  }
                } as unknown as EventEnvelope;
              }
          ''',
              '''    case 'readReceiptAdvanced': {
                const value = frame.event.value;
                return {
                  ...base,
                  createdAt: '',
                  actorId: null,
                  event: {
                    kind: RoomEventKind.ReadReceiptAdvanced,
                    roomId: value.roomId,
                    threadRootEventId: value.threadRootEventId ?? null
                  }
                } as unknown as EventEnvelope;
              }
          ''',
          )

          presentation = Path('apps/frontend/src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts')
          source = presentation.read_text(encoding='utf-8')
          if 'READ_RECEIPT_SUMMARY_BATCH_LIMIT' in source:
              raise SystemExit('read receipt summary batch helper already present unexpectedly')
          source += '''

          export const READ_RECEIPT_SUMMARY_BATCH_LIMIT = 100;

          /**
           * Returns the bounded message batch used by the count-only summary API.
           * Hidden members of an uninterrupted author run are excluded before the
           * protobuf limit is applied.
           */
          export function readReceiptSummaryEventIds(events: readonly RoomEventView[]): string[] {
            return events
              .filter(
                (event) =>
                  isMessagePostedEvent(event.event) && shouldShowReadReceiptIndicator(event)
              )
              .map((event) => event.id)
              .slice(-READ_RECEIPT_SUMMARY_BATCH_LIMIT);
          }
          '''
          presentation.write_text(source, encoding='utf-8')

          event_list = Path('apps/frontend/src/routes/chat/[serverId]/[roomId]/EventList.svelte')
          source = event_list.read_text(encoding='utf-8')
          import_marker = "  import { latestVisibleReadReceiptTarget, visibleMessageEventIds } from './readReceiptVisibility';\n"
          import_block = import_marker + "  import { readReceiptSummaryEventIds, withReadReceiptPresentation } from './readReceiptPresentation';\n"
          if source.count(import_marker) != 1:
              raise SystemExit('unexpected EventList read receipt import state')
          source = source.replace(import_marker, import_block, 1)
          filtered_marker = '''  let messageEventCount = $derived(
              filteredEvents.filter((event) => isMessagePostedEvent(event.event)).length
            );
          '''
          filtered_block = '''  let presentedEvents = $derived(withReadReceiptPresentation(filteredEvents));
            let messageEventCount = $derived(
              filteredEvents.filter((event) => isMessagePostedEvent(event.event)).length
            );
          '''
          if source.count(filtered_marker) != 1:
              raise SystemExit('unexpected EventList filtered event state')
          source = source.replace(filtered_marker, filtered_block, 1)
          source = source.replace(
              '  let eventsWithMeta = $derived(computeEventMetadata(filteredEvents, userSettings, activeLocale));\n',
              '  let eventsWithMeta = $derived(computeEventMetadata(presentedEvents, userSettings, activeLocale));\n',
              1,
          )
          old_ids = '''  function renderedMessageEventIds(): string[] {
              return filteredEvents
                .filter((event) => isMessagePostedEvent(event.event))
                .map((event) => event.id)
                .slice(-120);
            }
          '''
          new_ids = '''  function renderedMessageEventIds(): string[] {
              return readReceiptSummaryEventIds(presentedEvents);
            }
          '''
          if source.count(old_ids) != 1:
              raise SystemExit('unexpected EventList summary batch state')
          source = source.replace(old_ids, new_ids, 1)
          event_list.write_text(source, encoding='utf-8')

          test = Path('apps/frontend/src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts')
          source = test.read_text(encoding='utf-8')
          source = source.replace(
              '''  readReceiptIndicatorEventIds,
            shouldShowReadReceiptIndicator,
            withReadReceiptPresentation
          ''',
              '''  READ_RECEIPT_SUMMARY_BATCH_LIMIT,
            readReceiptIndicatorEventIds,
            readReceiptSummaryEventIds,
            shouldShowReadReceiptIndicator,
            withReadReceiptPresentation
          ''',
              1,
          )
          marker = '''  it('decorates each timeline independently and leaves source events untouched', () => {
          '''
          additions = '''  it('requests summaries only for the final message of each author run', () => {
              const presented = withReadReceiptPresentation([
                message('a1', 'alice'),
                message('a2', 'alice'),
                message('b1', 'bob')
              ]);

              expect(readReceiptSummaryEventIds(presented)).toEqual(['a2', 'b1']);
            });

            it('bounds summary requests to the protobuf batch limit', () => {
              const presented = withReadReceiptPresentation(
                Array.from({ length: READ_RECEIPT_SUMMARY_BATCH_LIMIT + 5 }, (_, index) =>
                  message(`m${index}`, `user-${index}`)
                )
              );
              const ids = readReceiptSummaryEventIds(presented);

              expect(ids).toHaveLength(READ_RECEIPT_SUMMARY_BATCH_LIMIT);
              expect(ids[0]).toBe('m5');
              expect(ids.at(-1)).toBe(`m${READ_RECEIPT_SUMMARY_BATCH_LIMIT + 4}`);
            });

          '''
          if source.count(marker) != 1:
              raise SystemExit('unexpected read receipt presentation spec state')
          test.write_text(source.replace(marker, additions + marker, 1), encoding='utf-8')

          mapper_spec = Path('apps/frontend/src/lib/realtimeEventMapper.spec.ts')
          source = mapper_spec.read_text(encoding='utf-8')
          source = source.replace(
              '''  RealtimeNotificationCreatedEventSchema
          ''',
              '''  RealtimeNotificationCreatedEventSchema,
            RealtimeReadReceiptAdvancedEventSchema
          ''',
              1,
          )
          marker = "  it('preserves per-client notification-center suppression', () => {\n"
          addition = '''  it('maps read receipt realtime frames as anonymous invalidations', () => {
              const event = realtimeEventToEventEnvelope(
                create(RealtimeEventEnvelopeSchema, {
                  id: 'evt-read-receipt',
                  event: {
                    case: 'readReceiptAdvanced',
                    value: create(RealtimeReadReceiptAdvancedEventSchema, {
                      roomId: 'room-1',
                      threadRootEventId: 'thread-1'
                    })
                  }
                })
              );

              expect(event).toMatchObject({
                id: 'evt-read-receipt',
                createdAt: '',
                actorId: null,
                event: {
                  kind: RoomEventKind.ReadReceiptAdvanced,
                  roomId: 'room-1',
                  threadRootEventId: 'thread-1'
                }
              });
              expect(event?.event).not.toHaveProperty('userId');
              expect(event?.event).not.toHaveProperty('eventId');
              expect(event?.event).not.toHaveProperty('readAt');
            });

          '''
          if source.count(marker) != 1:
              raise SystemExit('unexpected realtime mapper spec insertion state')
          mapper_spec.write_text(source.replace(marker, addition + marker, 1), encoding='utf-8')

          core_test = Path('cli/internal/core/read_receipts_test.go')
          source = core_test.read_text(encoding='utf-8')
          source = source.replace(
              'func TestReadReceiptModel_AdvancesMonotonicallyAndPublishesCompactDelta(t *testing.T) {',
              'func TestReadReceiptModel_AdvancesMonotonicallyAndPublishesAnonymousInvalidation(t *testing.T) {',
              1,
          )
          old_assert = '''	delta := live.GetPublicReadReceiptAdvanced()
          	if delta == nil || delta.GetRoomId() != f.room.Id || delta.GetUserId() != f.reader.Id || delta.GetEventId() != second.Id {
          		t.Fatalf("delta = %+v", delta)
          	}
          '''
          new_assert = '''	invalidation := live.GetPublicReadReceiptAdvanced()
          	if invalidation == nil || invalidation.GetRoomId() != f.room.Id || invalidation.GetThreadRootEventId() != "" {
          		t.Fatalf("invalidation = %+v", invalidation)
          	}
          	if live.GetActorId() != "" || live.GetCreatedAt() != nil {
          		t.Fatalf("live envelope leaked metadata: actor=%q created_at=%v", live.GetActorId(), live.GetCreatedAt())
          	}
          	descriptor := invalidation.ProtoReflect().Descriptor()
          	if descriptor.Fields().Len() != 2 ||
          		descriptor.Fields().ByName("user_id") != nil ||
          		descriptor.Fields().ByName("event_id") != nil ||
          		descriptor.Fields().ByName("event_sequence") != nil ||
          		descriptor.Fields().ByName("read_at") != nil ||
          		!descriptor.ReservedRanges().Has(3) ||
          		!descriptor.ReservedRanges().Has(4) ||
          		!descriptor.ReservedRanges().Has(5) ||
          		!descriptor.ReservedRanges().Has(6) ||
          		!descriptor.ReservedNames().Has("user_id") ||
          		!descriptor.ReservedNames().Has("event_id") ||
          		!descriptor.ReservedNames().Has("event_sequence") ||
          		!descriptor.ReservedNames().Has("read_at") {
          		t.Fatalf("unsafe public read receipt descriptor: %v", descriptor)
          	}
          '''
          if source.count(old_assert) != 1:
              raise SystemExit('unexpected core read receipt assertion state')
          source = source.replace(old_assert, new_assert, 1)
          insertion = '''
          func TestReadReceiptModel_FilterLiveSyncEventStripsLegacyEnvelopeMetadata(t *testing.T) {
          	f := newReadReceiptFixture(t)
          	threadRoot := "ROOT1"
          	live := &corev1.LiveEvent{
          		Id:        "legacy-receipt-invalidation",
          		ActorId:   f.reader.Id,
          		CreatedAt: timestamppb.Now(),
          		Event: &corev1.LiveEvent_PublicReadReceiptAdvanced{PublicReadReceiptAdvanced: &corev1.PublicReadReceiptAdvancedEvent{
          			RoomId:            f.room.Id,
          			ThreadRootEventId: &threadRoot,
          		}},
          	}
          	envelope, ok := f.core.myEvents().filterLiveSyncEvent(
          		testContext(t),
          		f.viewer.Id,
          		map[string]struct{}{f.room.Id: {}},
          		&nats.Msg{Subject: subjects.LiveSyncRoomEvent(string(KindChannel), f.room.Id, "read_receipt")},
          		live,
          	)
          	if !ok || envelope == nil || envelope.LiveEvent() == nil {
          		t.Fatalf("filterLiveSyncEvent = (%v, %v), want deliverable event", envelope, ok)
          	}
          	sanitized := envelope.LiveEvent()
          	if sanitized.GetActorId() != "" || sanitized.GetCreatedAt() != nil {
          		t.Fatalf("sanitized envelope leaked metadata: actor=%q created_at=%v", sanitized.GetActorId(), sanitized.GetCreatedAt())
          	}
          	invalidation := sanitized.GetPublicReadReceiptAdvanced()
          	if invalidation == nil || invalidation.GetRoomId() != f.room.Id || invalidation.GetThreadRootEventId() != threadRoot {
          		t.Fatalf("sanitized invalidation = %+v", invalidation)
          	}
          }

          '''
          marker = 'func TestReadReceiptModel_DoesNotPublishReceiptForOwnMessage(t *testing.T) {\n'
          if source.count(marker) != 1:
              raise SystemExit('unexpected core read receipt test insertion state')
          core_test.write_text(source.replace(marker, insertion + marker, 1), encoding='utf-8')

          http_test = Path('cli/internal/http_server/realtime_test.go')
          source = http_test.read_text(encoding='utf-8')
          start = source.index('func TestRealtimeMapperMapsReadReceiptAdvance(t *testing.T) {')
          end = source.index('\nfunc TestRealtimeMapperIncludesReadReceiptPreference', start)
          replacement = '''func TestRealtimeMapperMapsAnonymousReadReceiptInvalidation(t *testing.T) {
          	threadRoot := "ROOT1"
          	frame, err := (&HTTPServer{}).realtimeEventEnvelope(context.Background(), "", core.NewLiveEventEnvelope(&corev1.LiveEvent{
          		Id:        "receipt-live-1",
          		ActorId:   "U1",
          		CreatedAt: timestamppb.New(time.Unix(1_700_000_000, 123).UTC()),
          		Event: &corev1.LiveEvent_PublicReadReceiptAdvanced{PublicReadReceiptAdvanced: &corev1.PublicReadReceiptAdvancedEvent{
          			RoomId:            "R1",
          			ThreadRootEventId: &threadRoot,
          		}},
          	}))
          	if err != nil {
          		t.Fatalf("realtimeEventEnvelope: %v", err)
          	}
          	receipt := frame.GetReadReceiptAdvanced()
          	if receipt == nil {
          		t.Fatalf("event = %T, want read_receipt_advanced", frame.GetEvent())
          	}
          	if receipt.GetRoomId() != "R1" || receipt.GetThreadRootEventId() != threadRoot {
          		t.Fatalf("read_receipt_advanced = %+v", receipt)
          	}
          	if frame.ActorId != nil || frame.GetCreatedAt() != nil {
          		t.Fatalf("realtime envelope leaked metadata: actor=%v created_at=%v", frame.ActorId, frame.GetCreatedAt())
          	}
          	descriptor := receipt.ProtoReflect().Descriptor()
          	if descriptor.Fields().Len() != 2 ||
          		descriptor.Fields().ByName("user_id") != nil ||
          		descriptor.Fields().ByName("event_id") != nil ||
          		descriptor.Fields().ByName("event_sequence") != nil ||
          		descriptor.Fields().ByName("read_at") != nil ||
          		!descriptor.ReservedRanges().Has(3) ||
          		!descriptor.ReservedRanges().Has(4) ||
          		!descriptor.ReservedRanges().Has(5) ||
          		!descriptor.ReservedRanges().Has(6) ||
          		!descriptor.ReservedNames().Has("user_id") ||
          		!descriptor.ReservedNames().Has("event_id") ||
          		!descriptor.ReservedNames().Has("event_sequence") ||
          		!descriptor.ReservedNames().Has("read_at") {
          		t.Fatalf("unsafe realtime read receipt descriptor: %v", descriptor)
          	}
          }
          '''
          http_test.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          replace_once(
              'docs/adr/ADR-054-read-receipt-publication-boundary.md',
              'Realtime delivery uses a compact room-scoped event that carries the room, optional thread root, reader, message event ID, event sequence, and read timestamp. Clients use it to refresh local summaries, not as an authorization source.\n',
              'Realtime delivery uses an anonymous room-scoped invalidation containing only the room and optional thread root. It omits the reader, read timestamp, target message, sequence, envelope actor, and envelope creation time. Clients refetch authorized count-only summaries; reader identities and read timestamps remain behind the explicit paginated detail request.\n',
          )
          replace_once(
              'docs/adr/ADR-054-read-receipt-publication-boundary.md',
              '- Counts can be rendered without exposing reader identities in every message response.\n',
              '- Counts can be rendered without exposing reader identities in every message response or realtime frame.\n',
          )

          fdr = Path('docs/fdr/FDR-031-read-receipts.md')
          source = fdr.read_text(encoding='utf-8')
          source = source.replace(
              '- The compact message footer shows only the number of readers.\n',
              '- The compact message footer shows only a subdued receipt icon and reader count. Within an uninterrupted run from one author, only the final message renders the indicator.\n',
              1,
          )
          source = source.replace(
              '- Opening the footer detail requests a paginated reader list for the selected message. Reader identities and timestamps are not part of the compact summary.\n',
              '- Opening the footer detail requests a paginated reader list for the selected message. Reader identities and timestamps are not part of the compact summary or realtime invalidation.\n- Realtime invalidation contains only the room and optional thread root. It carries no reader identity, read timestamp, target message ID, sequence, envelope actor, or envelope creation time.\n',
              1,
          )
          source = source.replace(
              '**Decision:** Message footers use batch summaries that expose enabled state and reader counts. Reader identities and read timestamps are fetched only from the explicit detail action for one message.\n',
              '**Decision:** Message footers use bounded batch summaries that expose enabled state and reader counts. Realtime signals are anonymous room/thread invalidations. Reader identities and read timestamps are fetched only from the explicit detail action for one message.\n',
              1,
          )
          fdr.write_text(source, encoding='utf-8')
          PY

          gofmt -w \
            cli/internal/core/read_receipts.go \
            cli/internal/core/read_receipts_test.go \
            cli/internal/core/my_events_model.go \
            cli/internal/http_server/realtime.go \
            cli/internal/http_server/realtime_test.go
          (cd proto && mise x -- buf format -w chatto/core/v1/live_events.proto chatto/realtime/v1/realtime.proto)
          pnpm --dir apps/frontend exec prettier --write \
            src/lib/api-client/renderTypes.ts \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.ts \
            src/lib/realtimeEventMapper.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts'
          pnpm exec prettier --write \
            docs/fdr/FDR-031-read-receipts.md \
            docs/adr/ADR-054-read-receipt-publication-boundary.md
          git diff --check

      - name: Regenerate protobuf bindings and API documentation
        id: codegen
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mise run codegen-proto
          pnpm --filter @towk/api-types build
          git diff --check

      - name: Verify anonymous source and descriptor contract
        id: contract
        if: steps.codegen.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def message_block(path: str, name: str) -> str:
              text = Path(path).read_text(encoding='utf-8')
              start = text.index(f'message {name} {{')
              end = text.index('\n}', start) + 2
              return text[start:end]

          for path, name in (
              ('proto/chatto/core/v1/live_events.proto', 'PublicReadReceiptAdvancedEvent'),
              ('proto/chatto/realtime/v1/realtime.proto', 'RealtimeReadReceiptAdvancedEvent'),
          ):
              block = message_block(path, name)
              assert 'string room_id = 1;' in block
              assert 'optional string thread_root_event_id = 2;' in block
              assert 'reserved 3, 4, 5, 6;' in block
              assert 'reserved "user_id", "event_id", "event_sequence", "read_at";' in block
              for forbidden in ('string user_id =', 'string event_id =', 'uint64 event_sequence =', 'Timestamp read_at ='):
                  assert forbidden not in block

          for path in (
              'cli/internal/pb/chatto/core/v1/live_events.pb.go',
              'cli/internal/pb/chatto/realtime/v1/realtime.pb.go',
              'packages/api-types/src/chatto/realtime/v1/realtime_pb.ts',
          ):
              text = Path(path).read_text(encoding='utf-8')
              marker = 'ReadReceiptAdvancedEvent'
              start = text.index(marker)
              window = text[start:start + 8000]
              for forbidden in ('UserId', 'EventSequence', 'ReadAt', 'userId', 'eventSequence', 'readAt'):
                  assert forbidden not in window, (path, forbidden)

          event_list = Path('apps/frontend/src/routes/chat/[serverId]/[roomId]/EventList.svelte').read_text(encoding='utf-8')
          assert 'withReadReceiptPresentation(filteredEvents)' in event_list
          assert 'readReceiptSummaryEventIds(presentedEvents)' in event_list
          assert '.slice(-120)' not in event_list
          PY
          (cd proto && mise x -- buf build && mise x -- buf lint --path chatto/core/v1/live_events.proto --path chatto/realtime/v1/realtime.proto)

      - name: Test affected backend under race
        id: backend
        if: steps.contract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -race -trimpath -tags test_endpoints \
            ./internal/core ./internal/connectapi ./internal/http_server ./internal/events \
            -run 'ReadReceipt|ReadReceipts|RealtimeMapper|UserSettings|ServerUserPreferences|Subject' \
            -count=1
          go vet ./internal/core ./internal/connectapi ./internal/http_server ./internal/events

      - name: Check and test affected frontend
        id: frontend
        if: steps.contract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec vitest --run \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client-tests/viewer.spec.ts \
            src/lib/api-client-tests/serverState.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts'
          pnpm --dir apps/frontend exec eslint \
            src/lib/api-client/renderTypes.ts \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.ts \
            src/lib/realtimeEventMapper.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts'

      - name: Build distributable surfaces
        id: build
        if: steps.backend.outcome == 'success' && steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mise run build-frontend
          pnpm run build:docs
          mise run public-surface-check
          mise run license-check
          git diff --check

      - name: Publish validated privacy remediation
        if: >-
          steps.setup.outcome == 'success' &&
          steps.patch.outcome == 'success' &&
          steps.codegen.outcome == 'success' &&
          steps.contract.outcome == 'success' &&
          steps.backend.outcome == 'success' &&
          steps.frontend.outcome == 'success' &&
          steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          rm -f \
            .github/workflows/read-receipts-main-sync-diagnostic.yml \
            .github/workflows/read-receipts-realtime-privacy-finalizer.yml \
            .github/read-receipts-privacy-finalizer-status.txt
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(realtime): anonymize read receipt invalidation'
          git push origin HEAD:feat/read-receipts

      - name: Record bounded failure status
        if: >-
          always() && !(
          steps.setup.outcome == 'success' &&
          steps.patch.outcome == 'success' &&
          steps.codegen.outcome == 'success' &&
          steps.contract.outcome == 'success' &&
          steps.backend.outcome == 'success' &&
          steps.frontend.outcome == 'success' &&
          steps.build.outcome == 'success')
        shell: bash
        env:
          SETUP: ${{ steps.setup.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          CODEGEN: ${{ steps.codegen.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          cat > .github/read-receipts-privacy-finalizer-status.txt <<EOF
          source_head=${{ github.sha }}
          setup=${SETUP}
          patch=${PATCH}
          codegen=${CODEGEN}
          contract=${CONTRACT}
          backend=${BACKEND}
          frontend=${FRONTEND}
          build=${BUILD}
          EOF
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git add .github/read-receipts-privacy-finalizer-status.txt
          git diff --cached --quiet && exit 1
          git commit -m 'chore(ci): record read receipt privacy gate failure [skip read-receipts-privacy]'
          git push origin HEAD:feat/read-receipts
          exit 1
