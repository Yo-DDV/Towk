name: read-receipts main merge fixer

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-main-merge-fixer
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message, '[run pr173-merge-fixer]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Correct merge conflict status handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/read-receipts-main-merge-finalizer.yml')
          source = path.read_text(encoding='utf-8')
          old = '''          stage=merge
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if test "${merge_status}" -gt 1; then
            exit "${merge_status}"
          fi
'''
          new = '''          stage=merge
          if git merge --no-commit --no-ff origin/main; then
            merge_status=0
          else
            merge_status=$?
          fi
          if test "${merge_status}" -gt 1; then
            exit "${merge_status}"
          fi
'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one merge controller block, got {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/read-receipts-main-merge-fixer.yml
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(ci): correct merge conflict status handling [skip pr173-main-finalizer] [skip pr173-merge-diagnostic]'
          git push origin HEAD:feat/read-receipts
