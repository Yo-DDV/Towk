          new_mount = """  onMount(() => {
              pictureInPictureAvailable = supportsVideoPictureInPicture();
              const syncPictureInPictureState = () => {
                pictureInPictureActive = Boolean(document.pictureInPictureElement);
              };
              const handleProfileCallJoinRequest = (event: Event) => {
                const detail = (event as CustomEvent<RoomCallJoinRequestDetail>).detail;
                if (!detail || detail.serverId !== getActiveServer() || detail.roomId !== roomId) return;
                consumePendingRoomCallJoin(detail.serverId, detail.roomId);
                void joinFromProfileRequest();
              };
              document.addEventListener('enterpictureinpicture', syncPictureInPictureState, true);
              document.addEventListener('leavepictureinpicture', syncPictureInPictureState, true);
              window.addEventListener(ROOM_CALL_JOIN_REQUEST_EVENT, handleProfileCallJoinRequest);
              queueMicrotask(() => {
                const serverId = getActiveServer();
                if (consumePendingRoomCallJoin(serverId, roomId)) void joinFromProfileRequest();
              });
              return () => {
                document.removeEventListener('enterpictureinpicture', syncPictureInPictureState, true);
                document.removeEventListener('leavepictureinpicture', syncPictureInPictureState, true);
                window.removeEventListener(ROOM_CALL_JOIN_REQUEST_EVENT, handleProfileCallJoinRequest);
              };
            });
          """
          if old_mount not in voice:
              raise SystemExit('VoiceCallPanel: mount block missing')
          voice = voice.replace(old_mount, new_mount, 1)
          old_join = """  async function handleJoin() {
              await joinWithMode('ask');
            }
          """
          new_join = """  async function joinFromProfileRequest(): Promise<void> {
              if (requestedJoinInFlight || isInThisCall || isConnecting) return;
              requestedJoinInFlight = true;
              try {
                await joinWithMode('ask');
              } finally {
                requestedJoinInFlight = false;
              }
            }

            async function handleJoin() {
              await joinWithMode('ask');
            }
          """
          if old_join not in voice:
