      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Format touched sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec prettier --write \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/voice/VoiceCallPanel.svelte \
            src/lib/components/voice/VoiceCallPanel.svelte.spec.ts \
            src/lib/dm/startDM.ts \
            src/lib/dm/startDM.svelte.spec.ts \
            src/lib/storage/roomSidebarPanel.ts \
            src/lib/storage/roomSidebarPanel.spec.ts

      - name: Frontend typecheck
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend run check

      - name: Server tests for pending call state
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec vitest run --project server \
            src/lib/storage/roomSidebarPanel.spec.ts

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec playwright install --with-deps chromium

      - name: Targeted browser component tests
        shell: bash
        env:
          VITEST_BROWSER: chromium
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec vitest run --project client \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/voice/VoiceCallPanel.svelte.spec.ts \
            src/lib/dm/startDM.svelte.spec.ts

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend run build

      - name: Commit final profile polish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr182-profile-action-polish.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached --name-only | grep -E '^\.github/workflows/pr182-profile-action-polish\.yml$'
          ! git diff --cached | grep -Ei '(^|[[:space:]])(Co-authored-by|Generated-by|Assisted-by|Pair-programmed-by):'
          author_name=$(git show -s --format=%an HEAD)
          author_email=$(git show -s --format=%ae HEAD)
          GIT_AUTHOR_NAME="$author_name" GIT_AUTHOR_EMAIL="$author_email" \
          GIT_COMMITTER_NAME="$author_name" GIT_COMMITTER_EMAIL="$author_email" \
            git commit -m 'fix(profiles): polish identity and launch actions'
          git push origin HEAD:feat/user-profiles
