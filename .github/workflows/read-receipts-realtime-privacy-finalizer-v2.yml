name: read-receipts realtime privacy finalizer v2

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-realtime-privacy-finalizer-v2
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip read-receipts-privacy-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up repository toolchain
        id: setup
        continue-on-error: true
        uses: ./.github/actions/setup

      - name: Apply anonymous realtime invalidation contract
        id: patch
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2> >(tee "${RUNNER_TEMP}/read-receipts-privacy-patch.err" >&2)
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def sub_once(path: str, pattern: str, replacement: str, *, flags: int = 0) -> None:
              source = read(path)
              updated, count = re.subn(pattern, lambda _: replacement, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match for {pattern!r}, got {count}')
              write(path, updated)

          sub_once(
              'proto/chatto/core/v1/live_events.proto',
              r'(?ms)^// PublicReadReceiptAdvancedEvent.*?^message PublicReadReceiptAdvancedEvent \{\n.*?^\}\n?',
              '''// PublicReadReceiptAdvancedEvent is an anonymous room-scoped invalidation.
          // Clients refetch authorized count-only summaries; reader identity, read time,
          // target message and sequence remain behind the explicit paginated detail API.
          message PublicReadReceiptAdvancedEvent {
            reserved 3, 4, 5, 6;
            reserved "user_id", "event_id", "event_sequence", "read_at";

            string room_id = 1;
            optional string thread_root_event_id = 2;
          }
          ''',
          )

          sub_once(
              'proto/chatto/realtime/v1/realtime.proto',
              r'(?ms)^// Compact public read-receipt cursor delta\..*?^message RealtimeReadReceiptAdvancedEvent \{\n.*?^\}\n?',
              '''// Anonymous public read-receipt invalidation.
          //
          // Clients refetch authorized count-only summaries for rendered messages through
          // `RoomService.GetReadReceiptSummaries`. Reader identity, read time, target
          // message and sequence are intentionally excluded from the realtime stream.
          message RealtimeReadReceiptAdvancedEvent {
            reserved 3, 4, 5, 6;
            reserved "user_id", "event_id", "event_sequence", "read_at";

            // Room containing the affected timeline.
            string room_id = 1;
            // Thread root when the invalidation belongs to a thread timeline.
            optional string thread_root_event_id = 2;
          }
          ''',
          )

          path = 'cli/internal/core/read_receipts.go'
          source = read(path)
          call_old = 's.publishAdvance(ctx, actorID, kind, room.GetId(), threadRootEventID, advance)'
          call_new = 's.publishAdvance(ctx, kind, room.GetId(), threadRootEventID, advance)'
          if source.count(call_old) != 1:
              raise SystemExit(f'{path}: expected one publish call, got {source.count(call_old)}')
          write(path, source.replace(call_old, call_new, 1))
          sub_once(
              path,
              r'(?ms)^func \(s \*ReadReceiptModel\) publishAdvance\(.*?^}\n',
              '''func (s *ReadReceiptModel) publishAdvance(ctx context.Context, kind RoomKind, roomID, threadRootEventID string, advance *ReadReceiptAdvance) {
          	if advance == nil || !advance.Updated {
          		return
          	}
          	event := newLiveEvent("", &corev1.LiveEvent{Event: &corev1.LiveEvent_PublicReadReceiptAdvanced{
          		PublicReadReceiptAdvanced: &corev1.PublicReadReceiptAdvancedEvent{
          			RoomId:            roomID,
          			ThreadRootEventId: optionalString(threadRootEventID),
          		},
          	}})
          	// This room-wide signal is an anonymous invalidation. Keeping the live
          	// envelope free of actor and creation metadata prevents identity or read
          	// timing from escaping through alternate realtime adapters.
          	event.ActorId = ""
          	event.CreatedAt = nil
          	if err := s.core.publishLiveEvent(ctx, subjects.LiveSyncRoomEvent(string(kind), roomID, "read_receipt"), event); err != nil {
          		s.core.logger.Warn("failed to publish public read receipt invalidation", "error", err)
          	}
          }
          ''',
          )

          sub_once(
              'cli/internal/core/my_events_model.go',
              r'(?ms)^\t\tif event\.GetPublicReadReceiptAdvanced\(\) != nil \{\n.*?^\t\t}\n',
              '''		if receipt := event.GetPublicReadReceiptAdvanced(); receipt != nil {
          			enabled, _ := s.core.ReadReceipts().Policy(userID)
          			if !enabled {
          				return nil, false
          			}
          			// Rebuild the event at the authorization boundary. This also strips
          			// legacy unknown fields from mixed-version producers and guarantees
          			// that no actor or read timestamp reaches downstream adapters.
          			event = &corev1.LiveEvent{
          				Id: event.GetId(),
          				Event: &corev1.LiveEvent_PublicReadReceiptAdvanced{
          					PublicReadReceiptAdvanced: &corev1.PublicReadReceiptAdvancedEvent{
          						RoomId:            receipt.GetRoomId(),
          						ThreadRootEventId: optionalString(receipt.GetThreadRootEventId()),
          					},
          				},
          			}
          		}
          ''',
          )

          sub_once(
              'cli/internal/http_server/realtime.go',
              r'(?ms)^\tcase \*corev1\.LiveEvent_PublicReadReceiptAdvanced:\n.*?(?=^\tcase \*corev1\.LiveEvent_ThreadFollowChanged:)',
              '''	case *corev1.LiveEvent_PublicReadReceiptAdvanced:
          		receipt := payload.PublicReadReceiptAdvanced
          		// Read-receipt realtime delivery is an anonymous invalidation. The
          		// explicitly authorized paginated detail API owns identity and time.
          		envelope.CreatedAt = nil
          		envelope.ActorId = nil
          		envelope.Event = &realtimev1.RealtimeEventEnvelope_ReadReceiptAdvanced{ReadReceiptAdvanced: &realtimev1.RealtimeReadReceiptAdvancedEvent{
          			RoomId:            receipt.GetRoomId(),
          			ThreadRootEventId: receipt.ThreadRootEventId,
          		}}
          ''',
          )

          sub_once(
              'apps/frontend/src/lib/api-client/renderTypes.ts',
              r"(?ms)^  \| \{\n      kind: 'readReceiptAdvanced';\n.*?^    \}\n",
              '''  | {
                kind: 'readReceiptAdvanced';
                roomId: string;
                threadRootEventId?: string | null;
              }
          ''',
          )
          sub_once(
              'apps/frontend/src/lib/eventBus.svelte.ts',
              r'(?ms)^  \| \{\n      kind: typeof RoomEventKind\.ReadReceiptAdvanced;\n.*?^    \}\n',
              '''  | {
                kind: typeof RoomEventKind.ReadReceiptAdvanced;
                roomId: string;
                threadRootEventId?: string | null;
              }
          ''',
          )
          sub_once(
              'apps/frontend/src/lib/realtimeEventMapper.ts',
              r"(?ms)^    case 'readReceiptAdvanced': \{\n.*?^    \}\n(?=    case 'roomGroupsUpdated':)",
              '''    case 'readReceiptAdvanced': {
                const value = frame.event.value;
                return {
                  ...base,
                  createdAt: '',
                  actorId: null,
                  event: {
                    kind: RoomEventKind.ReadReceiptAdvanced,
                    roomId: value.roomId,
                    threadRootEventId: value.threadRootEventId ?? null
                  }
                } as unknown as EventEnvelope;
              }
          ''',
          )

          presentation_path = 'apps/frontend/src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts'
          source = read(presentation_path)
          if 'export const READ_RECEIPT_SUMMARY_BATCH_LIMIT = 100;' not in source:
              source += '''

          export const READ_RECEIPT_SUMMARY_BATCH_LIMIT = 100;

          /**
           * Returns the bounded message batch used by the count-only summary API.
           * Hidden members of an uninterrupted author run are excluded before the
           * protobuf limit is applied.
           */
          export function readReceiptSummaryEventIds(events: readonly RoomEventView[]): string[] {
            return events
              .filter(
                (event) =>
                  isMessagePostedEvent(event.event) && shouldShowReadReceiptIndicator(event)
              )
              .map((event) => event.id)
              .slice(-READ_RECEIPT_SUMMARY_BATCH_LIMIT);
          }
          '''
              write(presentation_path, source)

          event_list_path = 'apps/frontend/src/routes/chat/[serverId]/[roomId]/EventList.svelte'
          source = read(event_list_path)
          visibility_import = "  import { latestVisibleReadReceiptTarget, visibleMessageEventIds } from './readReceiptVisibility';\n"
          presentation_import = "  import { readReceiptSummaryEventIds, withReadReceiptPresentation } from './readReceiptPresentation';\n"
          if presentation_import not in source:
              if source.count(visibility_import) != 1:
                  raise SystemExit(f'{event_list_path}: unexpected visibility import state')
              source = source.replace(visibility_import, visibility_import + presentation_import, 1)
          if 'let presentedEvents = $derived(withReadReceiptPresentation(filteredEvents));' not in source:
              marker = '  let messageEventCount = $derived(\n'
              if source.count(marker) != 1:
                  raise SystemExit(f'{event_list_path}: unexpected message count marker state')
              source = source.replace(
                  marker,
                  '  let presentedEvents = $derived(withReadReceiptPresentation(filteredEvents));\n' + marker,
                  1,
              )
          old_metadata = 'computeEventMetadata(filteredEvents, userSettings, activeLocale)'
          if old_metadata in source:
              source = source.replace(old_metadata, 'computeEventMetadata(presentedEvents, userSettings, activeLocale)', 1)
          elif 'computeEventMetadata(presentedEvents, userSettings, activeLocale)' not in source:
              raise SystemExit(f'{event_list_path}: unexpected event metadata state')
          function_pattern = r'(?ms)^  function renderedMessageEventIds\(\): string\[\] \{\n.*?^  \}\n'
          updated, count = re.subn(
              function_pattern,
              lambda _: '''  function renderedMessageEventIds(): string[] {
              return readReceiptSummaryEventIds(presentedEvents);
            }
          ''',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'{event_list_path}: expected one summary function, got {count}')
          write(event_list_path, updated)

          presentation_spec_path = 'apps/frontend/src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts'
          source = read(presentation_spec_path)
          if 'READ_RECEIPT_SUMMARY_BATCH_LIMIT' not in source:
              source = source.replace(
                  '''  readReceiptIndicatorEventIds,
            shouldShowReadReceiptIndicator,
            withReadReceiptPresentation
          ''',
                  '''  READ_RECEIPT_SUMMARY_BATCH_LIMIT,
            readReceiptIndicatorEventIds,
            readReceiptSummaryEventIds,
            shouldShowReadReceiptIndicator,
            withReadReceiptPresentation
          ''',
                  1,
              )
              marker = "  it('decorates each timeline independently and leaves source events untouched', () => {\n"
              additions = '''  it('requests summaries only for the final message of each author run', () => {
              const presented = withReadReceiptPresentation([
                message('a1', 'alice'),
                message('a2', 'alice'),
                message('b1', 'bob')
              ]);

              expect(readReceiptSummaryEventIds(presented)).toEqual(['a2', 'b1']);
            });

            it('bounds summary requests to the protobuf batch limit', () => {
              const presented = withReadReceiptPresentation(
                Array.from({ length: READ_RECEIPT_SUMMARY_BATCH_LIMIT + 5 }, (_, index) =>
                  message(`m${index}`, `user-${index}`)
                )
              );
              const ids = readReceiptSummaryEventIds(presented);

              expect(ids).toHaveLength(READ_RECEIPT_SUMMARY_BATCH_LIMIT);
              expect(ids[0]).toBe('m5');
              expect(ids.at(-1)).toBe(`m${READ_RECEIPT_SUMMARY_BATCH_LIMIT + 4}`);
            });

          '''
              if source.count(marker) != 1:
                  raise SystemExit(f'{presentation_spec_path}: unexpected insertion state')
              source = source.replace(marker, additions + marker, 1)
              write(presentation_spec_path, source)

          mapper_spec_path = 'apps/frontend/src/lib/realtimeEventMapper.spec.ts'
          source = read(mapper_spec_path)
          if 'RealtimeReadReceiptAdvancedEventSchema' not in source:
              import_marker = '  RealtimeNotificationCreatedEventSchema\n'
              if source.count(import_marker) != 1:
                  raise SystemExit(f'{mapper_spec_path}: unexpected schema import state')
              source = source.replace(
                  import_marker,
                  '  RealtimeNotificationCreatedEventSchema,\n  RealtimeReadReceiptAdvancedEventSchema\n',
                  1,
              )
              marker = "  it('preserves per-client notification-center suppression', () => {\n"
              addition = '''  it('maps read receipt realtime frames as anonymous invalidations', () => {
              const event = realtimeEventToEventEnvelope(
                create(RealtimeEventEnvelopeSchema, {
                  id: 'evt-read-receipt',
                  event: {
                    case: 'readReceiptAdvanced',
                    value: create(RealtimeReadReceiptAdvancedEventSchema, {
                      roomId: 'room-1',
                      threadRootEventId: 'thread-1'
                    })
                  }
                })
              );

              expect(event).toMatchObject({
                id: 'evt-read-receipt',
                createdAt: '',
                actorId: null,
                event: {
                  kind: RoomEventKind.ReadReceiptAdvanced,
                  roomId: 'room-1',
                  threadRootEventId: 'thread-1'
                }
              });
              expect(event?.event).not.toHaveProperty('userId');
              expect(event?.event).not.toHaveProperty('eventId');
              expect(event?.event).not.toHaveProperty('readAt');
            });

          '''
              if source.count(marker) != 1:
                  raise SystemExit(f'{mapper_spec_path}: unexpected test insertion state')
              source = source.replace(marker, addition + marker, 1)
              write(mapper_spec_path, source)

          core_test_path = 'cli/internal/core/read_receipts_test.go'
          source = read(core_test_path)
          if '"google.golang.org/protobuf/encoding/protowire"' not in source:
              source = source.replace(
                  '"google.golang.org/protobuf/proto"\n',
                  '"google.golang.org/protobuf/encoding/protowire"\n\t"google.golang.org/protobuf/proto"\n',
                  1,
              )
          source = source.replace(
              'func TestReadReceiptModel_AdvancesMonotonicallyAndPublishesCompactDelta(t *testing.T) {',
              'func TestReadReceiptModel_AdvancesMonotonicallyAndPublishesAnonymousInvalidation(t *testing.T) {',
              1,
          )
          old_assert_pattern = r'(?ms)^\tdelta := live\.GetPublicReadReceiptAdvanced\(\)\n.*?^\t}\n\n\tstale, err :='
          replacement_assert = '''	invalidation := live.GetPublicReadReceiptAdvanced()
          	if invalidation == nil || invalidation.GetRoomId() != f.room.Id || invalidation.GetThreadRootEventId() != "" {
          		t.Fatalf("invalidation = %+v", invalidation)
          	}
          	if live.GetActorId() != "" || live.GetCreatedAt() != nil {
          		t.Fatalf("live envelope leaked metadata: actor=%q created_at=%v", live.GetActorId(), live.GetCreatedAt())
          	}
          	descriptor := invalidation.ProtoReflect().Descriptor()
          	if descriptor.Fields().Len() != 2 ||
          		descriptor.Fields().ByName("user_id") != nil ||
          		descriptor.Fields().ByName("event_id") != nil ||
          		descriptor.Fields().ByName("event_sequence") != nil ||
          		descriptor.Fields().ByName("read_at") != nil ||
          		!descriptor.ReservedRanges().Has(3) ||
          		!descriptor.ReservedRanges().Has(4) ||
          		!descriptor.ReservedRanges().Has(5) ||
          		!descriptor.ReservedRanges().Has(6) ||
          		!descriptor.ReservedNames().Has("user_id") ||
          		!descriptor.ReservedNames().Has("event_id") ||
          		!descriptor.ReservedNames().Has("event_sequence") ||
          		!descriptor.ReservedNames().Has("read_at") {
          		t.Fatalf("unsafe public read receipt descriptor: %v", descriptor)
          	}

          	stale, err :=
          '''
          updated, count = re.subn(old_assert_pattern, lambda _: replacement_assert, source, count=1)
          if count != 1:
              raise SystemExit(f'{core_test_path}: expected one compact delta assertion, got {count}')
          source = updated
          if 'TestReadReceiptModel_FilterLiveSyncEventStripsLegacyEnvelopeMetadata' not in source:
              marker = 'func TestReadReceiptModel_DoesNotPublishReceiptForOwnMessage(t *testing.T) {\n'
              addition = '''func TestReadReceiptModel_FilterLiveSyncEventStripsLegacyEnvelopeMetadata(t *testing.T) {
          	f := newReadReceiptFixture(t)
          	threadRoot := "ROOT1"
          	payload := &corev1.PublicReadReceiptAdvancedEvent{
          		RoomId:            f.room.Id,
          		ThreadRootEventId: &threadRoot,
          	}
          	legacyUnknown := protowire.AppendTag(nil, 3, protowire.BytesType)
          	legacyUnknown = protowire.AppendString(legacyUnknown, f.reader.Id)
          	legacyUnknown = protowire.AppendTag(legacyUnknown, 4, protowire.BytesType)
          	legacyUnknown = protowire.AppendString(legacyUnknown, "M4")
          	legacyUnknown = protowire.AppendTag(legacyUnknown, 5, protowire.VarintType)
          	legacyUnknown = protowire.AppendVarint(legacyUnknown, 42)
          	legacyUnknown = protowire.AppendTag(legacyUnknown, 6, protowire.BytesType)
          	legacyUnknown = protowire.AppendBytes(legacyUnknown, []byte{0x08, 0x01})
          	payload.ProtoReflect().SetUnknown(legacyUnknown)
          	live := &corev1.LiveEvent{
          		Id:        "legacy-receipt-invalidation",
          		ActorId:   f.reader.Id,
          		CreatedAt: timestamppb.Now(),
          		Event: &corev1.LiveEvent_PublicReadReceiptAdvanced{
          			PublicReadReceiptAdvanced: payload,
          		},
          	}
          	envelope, ok := f.core.myEvents().filterLiveSyncEvent(
          		testContext(t),
          		f.viewer.Id,
          		map[string]struct{}{f.room.Id: {}},
          		&nats.Msg{Subject: subjects.LiveSyncRoomEvent(string(KindChannel), f.room.Id, "read_receipt")},
          		live,
          	)
          	if !ok || envelope == nil || envelope.LiveEvent() == nil {
          		t.Fatalf("filterLiveSyncEvent = (%v, %v), want deliverable event", envelope, ok)
          	}
          	sanitized := envelope.LiveEvent()
          	if sanitized.GetActorId() != "" || sanitized.GetCreatedAt() != nil {
          		t.Fatalf("sanitized envelope leaked metadata: actor=%q created_at=%v", sanitized.GetActorId(), sanitized.GetCreatedAt())
          	}
          	invalidation := sanitized.GetPublicReadReceiptAdvanced()
          	if invalidation == nil || invalidation.GetRoomId() != f.room.Id || invalidation.GetThreadRootEventId() != threadRoot {
          		t.Fatalf("sanitized invalidation = %+v", invalidation)
          	}
          	if unknown := invalidation.ProtoReflect().GetUnknown(); len(unknown) != 0 {
          		t.Fatalf("sanitized invalidation retained %d unknown bytes", len(unknown))
          	}
          }

          '''
              if source.count(marker) != 1:
                  raise SystemExit(f'{core_test_path}: unexpected mixed-version test insertion state')
              source = source.replace(marker, addition + marker, 1)
          write(core_test_path, source)

          http_test_path = 'cli/internal/http_server/realtime_test.go'
          source = read(http_test_path)
          start_marker = 'func TestRealtimeMapperMapsReadReceiptAdvance(t *testing.T) {'
          end_marker = '\nfunc TestRealtimeMapperIncludesReadReceiptPreference'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'{http_test_path}: unable to locate old read receipt mapper test')
          replacement = '''func TestRealtimeMapperMapsAnonymousReadReceiptInvalidation(t *testing.T) {
          	threadRoot := "ROOT1"
          	payload := &corev1.PublicReadReceiptAdvancedEvent{
          		RoomId:            "R1",
          		ThreadRootEventId: &threadRoot,
          	}
          	payload.ProtoReflect().SetUnknown([]byte{0x1a, 0x02, 'U', '1'})
          	frame, err := (&HTTPServer{}).realtimeEventEnvelope(context.Background(), "", core.NewLiveEventEnvelope(&corev1.LiveEvent{
          		Id:        "receipt-live-1",
          		ActorId:   "U1",
          		CreatedAt: timestamppb.New(time.Unix(1_700_000_000, 123).UTC()),
          		Event: &corev1.LiveEvent_PublicReadReceiptAdvanced{
          			PublicReadReceiptAdvanced: payload,
          		},
          	}))
          	if err != nil {
          		t.Fatalf("realtimeEventEnvelope: %v", err)
          	}
          	receipt := frame.GetReadReceiptAdvanced()
          	if receipt == nil {
          		t.Fatalf("event = %T, want read_receipt_advanced", frame.GetEvent())
          	}
          	if receipt.GetRoomId() != "R1" || receipt.GetThreadRootEventId() != threadRoot {
          		t.Fatalf("read_receipt_advanced = %+v", receipt)
          	}
          	if frame.ActorId != nil || frame.GetCreatedAt() != nil {
          		t.Fatalf("realtime envelope leaked metadata: actor=%v created_at=%v", frame.ActorId, frame.GetCreatedAt())
          	}
          	descriptor := receipt.ProtoReflect().Descriptor()
          	if descriptor.Fields().Len() != 2 ||
          		descriptor.Fields().ByName("user_id") != nil ||
          		descriptor.Fields().ByName("event_id") != nil ||
          		descriptor.Fields().ByName("event_sequence") != nil ||
          		descriptor.Fields().ByName("read_at") != nil ||
          		!descriptor.ReservedRanges().Has(3) ||
          		!descriptor.ReservedRanges().Has(4) ||
          		!descriptor.ReservedRanges().Has(5) ||
          		!descriptor.ReservedRanges().Has(6) ||
          		!descriptor.ReservedNames().Has("user_id") ||
          		!descriptor.ReservedNames().Has("event_id") ||
          		!descriptor.ReservedNames().Has("event_sequence") ||
          		!descriptor.ReservedNames().Has("read_at") {
          		t.Fatalf("unsafe realtime read receipt descriptor: %v", descriptor)
          	}
          }
          '''
          write(http_test_path, source[:start] + replacement + source[end:])

          adr_path = 'docs/adr/ADR-054-read-receipt-publication-boundary.md'
          source = read(adr_path)
          old = 'Realtime delivery uses a compact room-scoped event that carries the room, optional thread root, reader, message event ID, event sequence, and read timestamp. Clients use it to refresh local summaries, not as an authorization source.'
          new = 'Realtime delivery uses an anonymous room-scoped invalidation containing only the room and optional thread root. It omits the reader, read timestamp, target message, sequence, envelope actor, and envelope creation time. Clients refetch authorized count-only summaries; reader identities and read timestamps remain behind the explicit paginated detail request.'
          if old not in source:
              raise SystemExit(f'{adr_path}: unexpected realtime decision text')
          source = source.replace(old, new, 1)
          source = source.replace(
              '- Counts can be rendered without exposing reader identities in every message response.',
              '- Counts can be rendered without exposing reader identities in every message response or realtime frame.',
              1,
          )
          write(adr_path, source)

          fdr_path = 'docs/fdr/FDR-031-read-receipts.md'
          source = read(fdr_path)
          old_behavior = '- The compact message footer shows only the number of readers.\n'
          desired_behavior = '- The compact message footer shows only a subdued receipt icon and reader count. Within an uninterrupted run from one author, only the final message renders the indicator.\n'
          if desired_behavior not in source:
              if old_behavior not in source:
                  raise SystemExit(f'{fdr_path}: unexpected compact footer text')
              source = source.replace(old_behavior, desired_behavior, 1)
          old_detail = '- Opening the footer detail requests a paginated reader list for the selected message. Reader identities and timestamps are not part of the compact summary.\n'
          desired_detail = '- Opening the footer detail requests a paginated reader list for the selected message. Reader identities and timestamps are not part of the compact summary or realtime invalidation.\n- Realtime invalidation contains only the room and optional thread root. It carries no reader identity, read timestamp, target message ID, sequence, envelope actor, or envelope creation time.\n'
          if desired_detail not in source:
              if old_detail not in source:
                  raise SystemExit(f'{fdr_path}: unexpected detail text')
              source = source.replace(old_detail, desired_detail, 1)
          old_decision = '**Decision:** Message footers use batch summaries that expose enabled state and reader counts. Reader identities and read timestamps are fetched only from the explicit detail action for one message.\n'
          desired_decision = '**Decision:** Message footers use bounded batch summaries that expose enabled state and reader counts. Realtime signals are anonymous room/thread invalidations. Reader identities and read timestamps are fetched only from the explicit detail action for one message.\n'
          if desired_decision not in source:
              if old_decision not in source:
                  raise SystemExit(f'{fdr_path}: unexpected summary decision text')
              source = source.replace(old_decision, desired_decision, 1)
          write(fdr_path, source)
          PY

          patch_status=$?
          if test "${patch_status}" -ne 0; then
            exit "${patch_status}"
          fi

          set -euo pipefail
          gofmt -w \
            cli/internal/core/read_receipts.go \
            cli/internal/core/read_receipts_test.go \
            cli/internal/core/my_events_model.go \
            cli/internal/http_server/realtime.go \
            cli/internal/http_server/realtime_test.go
          (cd proto && mise x -- buf format -w chatto/core/v1/live_events.proto chatto/realtime/v1/realtime.proto)
          pnpm --dir apps/frontend exec prettier --write \
            src/lib/api-client/renderTypes.ts \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.ts \
            src/lib/realtimeEventMapper.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts'
          pnpm exec prettier --write \
            docs/fdr/FDR-031-read-receipts.md \
            docs/adr/ADR-054-read-receipt-publication-boundary.md
          git diff --check

      - name: Regenerate protobuf bindings and API documentation
        id: codegen
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mise run codegen-proto
          pnpm --filter @towk/api-types build
          git diff --check

      - name: Verify anonymous source contract
        id: contract
        if: steps.codegen.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def message_block(path: str, name: str) -> str:
              text = Path(path).read_text(encoding='utf-8')
              start = text.index(f'message {name} {{')
              end = text.index('\n}', start) + 2
              return text[start:end]

          for path, name in (
              ('proto/chatto/core/v1/live_events.proto', 'PublicReadReceiptAdvancedEvent'),
              ('proto/chatto/realtime/v1/realtime.proto', 'RealtimeReadReceiptAdvancedEvent'),
          ):
              block = message_block(path, name)
              assert 'string room_id = 1;' in block
              assert 'optional string thread_root_event_id = 2;' in block
              assert 'reserved 3, 4, 5, 6;' in block
              assert 'reserved "user_id", "event_id", "event_sequence", "read_at";' in block
              for forbidden in ('string user_id =', 'string event_id =', 'uint64 event_sequence =', 'Timestamp read_at ='):
                  assert forbidden not in block

          event_list = Path('apps/frontend/src/routes/chat/[serverId]/[roomId]/EventList.svelte').read_text(encoding='utf-8')
          assert 'withReadReceiptPresentation(filteredEvents)' in event_list
          assert 'readReceiptSummaryEventIds(presentedEvents)' in event_list
          assert '.slice(-120)' not in event_list

          mapper = Path('apps/frontend/src/lib/realtimeEventMapper.ts').read_text(encoding='utf-8')
          start = mapper.index("case 'readReceiptAdvanced':")
          end = mapper.index("case 'roomGroupsUpdated':", start)
          block = mapper[start:end]
          for forbidden in ('value.userId', 'value.eventId', 'value.eventSequence', 'value.readAt'):
              assert forbidden not in block
          PY
          (cd proto && mise x -- buf build && mise x -- buf lint --path chatto/core/v1/live_events.proto --path chatto/realtime/v1/realtime.proto)

      - name: Test affected backend under race
        id: backend
        if: steps.contract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -race -trimpath -tags test_endpoints \
            ./internal/core ./internal/connectapi ./internal/http_server ./internal/events \
            -run 'ReadReceipt|ReadReceipts|RealtimeMapper|UserSettings|ServerUserPreferences|Subject' \
            -count=1
          go vet ./internal/core ./internal/connectapi ./internal/http_server ./internal/events

      - name: Check and test affected frontend
        id: frontend
        if: steps.contract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec vitest --run \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client-tests/viewer.spec.ts \
            src/lib/api-client-tests/serverState.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts'
          pnpm --dir apps/frontend exec eslint \
            src/lib/api-client/renderTypes.ts \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.ts \
            src/lib/realtimeEventMapper.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts'

      - name: Build distributable surfaces
        id: build
        if: steps.backend.outcome == 'success' && steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mise run build-frontend
          pnpm run build:docs
          mise run public-surface-check
          mise run license-check
          git diff --check

      - name: Publish validated privacy remediation
        if: >-
          steps.setup.outcome == 'success' &&
          steps.patch.outcome == 'success' &&
          steps.codegen.outcome == 'success' &&
          steps.contract.outcome == 'success' &&
          steps.backend.outcome == 'success' &&
          steps.frontend.outcome == 'success' &&
          steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          rm -f \
            .github/workflows/read-receipts-main-sync-diagnostic.yml \
            .github/workflows/read-receipts-realtime-privacy-finalizer-v2.yml \
            .github/read-receipts-privacy-finalizer-status.txt
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' add -A
          git diff --cached --check
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'fix(realtime): anonymize read receipt invalidation'
          git push origin HEAD:feat/read-receipts

      - name: Record bounded failure status
        if: >-
          always() && !(
          steps.setup.outcome == 'success' &&
          steps.patch.outcome == 'success' &&
          steps.codegen.outcome == 'success' &&
          steps.contract.outcome == 'success' &&
          steps.backend.outcome == 'success' &&
          steps.frontend.outcome == 'success' &&
          steps.build.outcome == 'success')
        shell: bash
        env:
          SETUP: ${{ steps.setup.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          CODEGEN: ${{ steps.codegen.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          patch_error="$(tail -n 2 "${RUNNER_TEMP}/read-receipts-privacy-patch.err" 2>/dev/null | tr '\n' ' ' | sed 's/[[:cntrl:]]/ /g' | cut -c1-500)"
          cat > .github/read-receipts-privacy-finalizer-status.txt <<EOF
          source_head=${{ github.sha }}
          setup=${SETUP}
          patch=${PATCH}
          codegen=${CODEGEN}
          contract=${CONTRACT}
          backend=${BACKEND}
          frontend=${FRONTEND}
          build=${BUILD}
          patch_error=${patch_error}
          EOF
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' add .github/read-receipts-privacy-finalizer-status.txt
          git diff --cached --quiet && exit 1
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'chore(ci): record read receipt privacy v2 gate failure [skip read-receipts-privacy-v2]'
          git push origin HEAD:feat/read-receipts
          exit 1
