name: PR 290 additive integration

on:
  push:
    branches:
      - fix/cross-browser-noise-suppression

concurrency:
  group: pr290-additive-integration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.sha != '0c97950e8802d21f4e4b7985c422734ec446db80' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup frontend toolchain
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"

      - name: Reconcile the validated WebKit patch with current main
        shell: bash
        env:
          FEATURE_COMMIT: 0c97950e8802d21f4e4b7985c422734ec446db80
          TARGET_BRANCH: fix/cross-browser-noise-suppression
          GIT_AUTHOR_NAME: Yo-DDV
          GIT_AUTHOR_EMAIL: 116607353+Yo-DDV@users.noreply.github.com
          GIT_COMMITTER_NAME: Yo-DDV
          GIT_COMMITTER_EMAIL: 116607353+Yo-DDV@users.noreply.github.com
        run: |
          set -euo pipefail
          branch_head="$GITHUB_SHA"
          cp tools/pr290-integrate.py /tmp/pr290-integrate.py
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          git checkout --detach "$main_sha"
          git cherry-pick --no-commit -Xours "$FEATURE_COMMIT"
          cp /tmp/pr290-integrate.py tools/pr290-integrate.py
          python3 tools/pr290-integrate.py
          rm -f tools/pr290-integrate.py .github/workflows/pr290-integrate.yml
          git add -A
          git diff --cached --check

          cd apps/frontend
          pnpm exec prettier --check \
            src/lib/state/server/voiceCall.svelte.ts \
            src/lib/state/server/voiceCall.svelte.spec.ts \
            src/lib/voice/audioDevices.ts \
            src/lib/voice/audioDevices.spec.ts \
            ../../../docs/fdr/FDR-016-voice-calls.md
          pnpm exec eslint \
            src/lib/state/server/voiceCall.svelte.ts \
            src/lib/state/server/voiceCall.svelte.spec.ts \
            src/lib/voice/audioDevices.ts \
            src/lib/voice/audioDevices.spec.ts
          pnpm exec vitest run \
            src/lib/voice/audioDevices.spec.ts \
            src/lib/state/server/voiceCall.svelte.spec.ts
          pnpm run check
          pnpm run build
          cd ../..

          tree_sha="$(git write-tree)"
          commit_sha="$(printf '%s\n' 'fix(calls): reconcile WebKit audio routing with current main' | git commit-tree "$tree_sha" -p "$branch_head" -p "$main_sha")"
          git push origin "$commit_sha:refs/heads/$TARGET_BRANCH"

# retriggered after owner merge authorization
