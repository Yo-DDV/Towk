name: TURN TLS profile

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - 'release-[0-9]*'
    paths:
      - '.github/workflows/turn-tls-profile.yml'
      - 'examples/dockercompose/compose.yml'
      - 'examples/dockercompose/compose.turn-tls.yml'
      - 'examples/dockercompose/livekit.yaml'
      - 'examples/dockercompose/turn-tls.sh'
      - 'examples/dockercompose/turn-tls.env.example'
      - 'examples/dockercompose/turn_tls.py'
      - 'examples/dockercompose/turn_tls_lib/**'
      - 'examples/dockercompose/README.turn-tls.md'
      - 'tools/test-turn-tls-profile.py'
      - 'tools/turn_tls_tests/**'
      - 'tools/verify-turn-tls-profile.sh'
      - 'tools/smoke-livekit-turn-tls.sh'
      - 'apps/docs-website/src/content/docs/guides/infrastructure/turn-tls.mdx'
      - 'docs/adr/ADR-053-optional-self-hosted-turn-tls-profile.md'
      - '.gitignore'

concurrency:
  group: turn-tls-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: TURN/TLS contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate helper and tests
        run: |
          set -euo pipefail
          python3 -m py_compile examples/dockercompose/turn_tls.py examples/dockercompose/turn_tls_lib/*.py tools/test-turn-tls-profile.py tools/turn_tls_tests/*.py
          python3 tools/test-turn-tls-profile.py
          bash -n examples/dockercompose/turn-tls.sh tools/verify-turn-tls-profile.sh tools/smoke-livekit-turn-tls.sh

      - name: Verify default and opt-in Compose renders
        run: bash tools/verify-turn-tls-profile.sh

      - name: Check public documentation
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD
          node --check tools/check-public-surface.mjs
          node tools/check-public-surface.mjs

  livekit-smoke:
    name: Pinned LiveKit TURN/TLS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Start hardened LiveKit and verify TLS
        run: bash tools/smoke-livekit-turn-tls.sh
