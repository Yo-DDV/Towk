name: finalize profile banner hardening v2

on:
  pull_request:
    types: [synchronize]
    branches: [main]

concurrency:
  group: profile-banner-direct-finalize-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: ${{ github.repository == 'Yo-DDV/Towk' && github.event.pull_request.number == 295 && github.event.pull_request.head.ref == 'feat/profile-surface-redesign' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: "true"
      TOWK_LOCAL_WORKERS: "4"
      GIT_AUTHOR_NAME: Yo-DDV
      GIT_AUTHOR_EMAIL: 116607353+Yo-DDV@users.noreply.github.com
      GIT_COMMITTER_NAME: Yo-DDV
      GIT_COMMITTER_EMAIL: 116607353+Yo-DDV@users.noreply.github.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/profile-surface-redesign
          fetch-depth: 0

      - name: Integrate current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge --no-edit origin/main

      - uses: ./.github/actions/setup

      - name: Generate API types
        run: |
          set -euo pipefail
          mise codegen-proto
          mise build-api-types

      - name: Apply readable hardening patch
        run: |
          set -euo pipefail
          python3 -m py_compile .github/pr295-direct-hardening.py
          python3 .github/pr295-direct-hardening.py

      - name: Format source
        run: |
          set -euo pipefail
          gofmt -w cli/internal/assets/profile_banner*.go cli/internal/core/user_profile_banner*.go cli/internal/core/users.go cli/internal/http_server/assets.go cli/internal/http_server/cors*.go cli/internal/http_server/profile_banner*.go
          pnpm --dir apps/frontend exec prettier --write \
            messages/{de,en,es,fr,pt}/profile-banner.json \
            src/lib/profileBanner.ts src/lib/profileBanner.spec.ts \
            src/lib/i18n/profileBanner.ts src/lib/i18n/profileBanner.spec.ts \
            src/lib/components/menus/UserContextMenu.svelte src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.svelte src/lib/components/users/ProfileBannerEditor.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.stories.svelte \
            src/lib/components/users/UserProfileSurface.svelte src/lib/components/users/UserProfileSurface.stories.svelte \
            src/lib/components/users/UserProfileSurface.polish.css src/lib/components/users/UserProfileSurface.polish.spec.ts
          git diff --check

      - name: Install Chromium
        run: pnpm --dir apps/frontend exec playwright install --with-deps chromium

      - name: Check and targeted lint
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec eslint \
            src/lib/profileBanner.ts src/lib/profileBanner.spec.ts \
            src/lib/i18n/profileBanner.ts src/lib/i18n/profileBanner.spec.ts \
            src/lib/components/menus/UserContextMenu.svelte src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.svelte src/lib/components/users/ProfileBannerEditor.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.stories.svelte \
            src/lib/components/users/UserProfileSurface.svelte src/lib/components/users/UserProfileSurface.stories.svelte \
            src/lib/components/users/UserProfileSurface.polish.spec.ts

      - name: Focused frontend tests
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec vitest --run --project server \
            src/lib/profileBanner.spec.ts src/lib/i18n/profileBanner.spec.ts src/lib/components/users/UserProfileSurface.polish.spec.ts
          pnpm --dir apps/frontend exec vitest --run --project client \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts src/lib/components/users/ProfileBannerEditor.svelte.spec.ts

      - name: Complete frontend tests
        run: pnpm --dir apps/frontend exec vitest --run --maxWorkers=4

      - name: Build frontend and Storybook
        run: |
          set -euo pipefail
          mise build-frontend
          pnpm --dir apps/frontend run build-storybook
          pnpm --dir apps/frontend run test-storybook

      - name: Focused Go tests and race detector
        run: |
          set -euo pipefail
          cd cli
          go test -trimpath ./internal/assets ./internal/core ./internal/http_server -run 'ProfileBanner|CORS' -count=1
          go test -race -trimpath ./internal/assets ./internal/core ./internal/http_server -run 'ProfileBanner' -count=1

      - name: Complete affected Go checks
        run: |
          set -euo pipefail
          cd cli
          go test -trimpath ./internal/assets ./internal/core ./internal/http_server -count=1
          go vet ./internal/assets ./internal/core ./internal/http_server
          go build -trimpath -tags bootstrap -o /tmp/towk-profile-banner .

      - name: Clean temporary files and publish
        run: |
          set -euo pipefail
          rm -rf .github/profile-banner-hardening-parts .github/profile-banner-source-parts
          rm -f .github/workflows/profile-banner-hardening.yml .github/workflows/profile-banner-hardening-run.yml
          rm -f .github/workflows/profile-banner-hardening-debug.yml .github/workflows/profile-banner-direct-run.yml
          rm -f .github/workflows/profile-banner-direct-run2.yml .github/pr295-direct-hardening.py
          rm -f .github/pr295-finalize.py .github/workflows/pr295-finalize.yml
          rm -f .github/profile-banner-source.b64 .github/profile-banner-materialize.py

          ! git diff --name-only | grep -E '^\.github/(profile-banner|workflows/profile-banner|pr295)'
          git diff --check
          git add -A
          git diff --cached --check
          git commit -m "fix(profiles): harden profile banner delivery"
          test "$(git show -s --format='%an' HEAD)" = "Yo-DDV"
          test "$(git show -s --format='%cn' HEAD)" = "Yo-DDV"
          ! git show -s --format='%B' HEAD | grep -Eiq 'co-authored-by|generated-by|assisted-by|pair-programmed-by|chatgpt|codex'
          ! git diff --name-only origin/main...HEAD | grep -E '^\.github/(profile-banner|workflows/profile-banner|pr295)'
          git diff --check origin/main...HEAD
          git push origin HEAD:feat/profile-surface-redesign
