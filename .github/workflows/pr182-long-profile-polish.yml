name: apply long profile polish

on:
  push:
    branches:
      - feat/user-profiles
    paths:
      - .github/workflows/pr182-long-profile-polish.yml

permissions:
  contents: write

concurrency:
  group: pr182-long-profile-polish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out profile branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/user-profiles
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6e9b24282ff452433ebe46b150ec4f81ffbcbe7f"
          git fetch --no-tags origin main feat/user-profiles

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Apply bounded biography and responsive profile remediation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr182-remediation.py.xz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 --decode /tmp/pr182-remediation.py.xz.b64 | xz --decompress > /tmp/pr182-remediation.py
          python3 /tmp/pr182-remediation.py

      - name: Generate localization facade
        run: pnpm --filter towk-frontend paraglide

      - name: Format changed files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cli/internal/core/user_profile.go cli/internal/core/user_profile_test.go cli/internal/connectapi/user_profile_test.go
          pnpm --dir apps/frontend exec prettier --write \
            src/lib/profileBiography.ts \
            src/lib/profileBiography.spec.ts \
            src/lib/components/settings/ProfileDetailsSettings.svelte \
            src/lib/components/settings/ProfileDetailsSettings.svelte.spec.ts \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            messages/en/chat.json \
            messages/fr/chat.json \
            messages/de/chat.json \
            messages/es/chat.json \
            messages/pt/chat.json
          pnpm exec prettier --write docs/fdr/FDR-022-user-profile.md

      - name: Build generated API package
        run: mise run build-api-types

      - name: Run targeted lint and type checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec eslint \
            src/lib/profileBiography.ts \
            src/lib/profileBiography.spec.ts \
            src/lib/components/settings/ProfileDetailsSettings.svelte \
            src/lib/components/settings/ProfileDetailsSettings.svelte.spec.ts \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts
          pnpm --dir apps/frontend run check

      - name: Run targeted backend tests
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -trimpath ./internal/core ./internal/connectapi \
            -run 'Biography|UpdateProfilePrevalidatesBiography' -count=1

      - name: Install Chromium
        run: pnpm --dir apps/frontend exec playwright install --with-deps chromium

      - name: Run targeted frontend tests
        shell: bash
        env:
          VITEST_BROWSER: chromium
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec vitest run --project server src/lib/profileBiography.spec.ts
          pnpm --dir apps/frontend exec vitest run --project client \
            src/lib/components/settings/ProfileDetailsSettings.svelte.spec.ts \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts

      - name: Build frontend and run policy checks
        shell: bash
        run: |
          set -euo pipefail
          mise run build-frontend
          mise run license-check
          mise run public-surface-check
          git diff --check

      - name: Publish final product tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr182-long-profile-polish.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached | grep -Ei '(^|[[:space:]])(Co-authored-by|Generated-by|Assisted-by|Pair-programmed-by):'
          author_name=$(git show -s --format=%an HEAD)
          author_email=$(git show -s --format=%ae HEAD)
          GIT_AUTHOR_NAME="$author_name" GIT_AUTHOR_EMAIL="$author_email" \
          GIT_COMMITTER_NAME="$author_name" GIT_COMMITTER_EMAIL="$author_email" \
            git commit -m 'fix(profiles): balance long biographies'
          git push origin HEAD:feat/user-profiles
