name: pr312 final clean transaction

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-final-clean
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Fetch and apply verified remediation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          blob='1e35f3e90ca24587fd326d4dd22691a7b7b1f3c1'
          expected='e728dbb49039fe94ca0f4c6d52786fed421c7a29de61eeaebc16b27dafeedb4f'
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" \
            | jq -r '.content' | tr -d '\n' | base64 --decode \
            > /tmp/pr312-remediation.patch.gz
          printf '%s  %s\n' "${expected}" /tmp/pr312-remediation.patch.gz | sha256sum -c -
          gzip --test /tmp/pr312-remediation.patch.gz
          gzip --decompress --stdout /tmp/pr312-remediation.patch.gz > /tmp/pr312-remediation.patch
          if patch -p1 --forward --batch --dry-run < /tmp/pr312-remediation.patch; then
            patch -p1 --forward --batch < /tmp/pr312-remediation.patch
          elif patch -p1 --reverse --batch --dry-run < /tmp/pr312-remediation.patch; then
            echo 'Verified remediation is already applied.'
          else
            echo 'Remediation is neither applicable nor already present.' >&2
            exit 1
          fi

      - name: Remove every temporary transfer and validation asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/pr312-patch
          rm -f \
            .github/workflows/pr312-validation.yml \
            .github/workflows/pr312-status.yml \
            .github/workflows/pr312-finalize.yml \
            .github/workflows/pr312-finalize-transaction.yml \
            .github/workflows/pr312-finalize-clean.yml
          git show origin/main:.github/workflows/quick-gate.yml > .github/workflows/quick-gate.yml
          changed_go="$(git diff --name-only -- '*.go')"
          if test -n "${changed_go}"; then
            gofmt -w ${changed_go}
          fi
          git diff --check
          ! find . -name '*.rej' -o -name '*.orig' | grep .
          ! git status --short | grep -E 'pr312-patch|pr312-(validation|status|finalize)'

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm run check:frontend
          pnpm run lint:frontend
          pnpm --filter towk-frontend exec vitest run \
            src/lib/components/rbac/gradeTemplates.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/memberRoleSections.spec.ts'
          pnpm run build:frontend

      - name: Validate backend
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -trimpath -p 1 -tags test_endpoints ./internal/core ./internal/connectapi
          go vet ./internal/core ./internal/connectapi

      - name: Validate final diff and provenance
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          ! git diff --cached --name-only | grep -E '(^|/)pr312-|\.github/pr312-patch|pr312-(validation|status|finalize).*\.yml'
          ! git diff --cached | grep -Ei 'ChatGPT|Codex|Co-authored-by:|Generated-by:|Assisted-by:'
          git diff --cached --name-status

      - name: Commit and push finalized implementation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' \
            commit -m 'feat(rbac): finalize localized default grade templates'
          git push origin HEAD:feat/localized-default-grades
          head="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/312/comments" \
            -f body="Bench candidate head: ${head}\n\nAccessible checks passed on the finalized clean implementation: frontend typecheck, frontend lint, targeted grade tests, frontend build, Go core and ConnectRPC tests, Go vet, diff hygiene and provenance guards. Temporary transfer payloads and validation workflows are absent. Docker/runtime and physical-device qualification remain pending."
