name: read-receipts preference finalizer
# Registered on the branch before this trigger commit.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: read-receipts-preference-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/read-receipts'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Apply read receipt preference fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('apps/frontend/src/routes/chat/[serverId]/settings/preferences/+page.svelte')
          source = page.read_text(encoding='utf-8')

          old_import = "  import { Button, FormError } from '$lib/ui/form';"
          new_import = "  import { Button, Checkbox, FormError } from '$lib/ui/form';"
          if source.count(old_import) != 1:
              raise SystemExit('unexpected preferences form import state')
          source = source.replace(old_import, new_import, 1)

          old_save = (
              "      const settings = await accountAPI().updateSettings({\n"
              "        timezone: selectedTimezone,\n"
              "        timeFormat: selectedTimeFormat\n"
              "      });\n"
              "      userSettings.updateFromData(settings);\n"
          )
          new_save = (
              "      const settings = await accountAPI().updateSettings({\n"
              "        timezone: selectedTimezone,\n"
              "        timeFormat: selectedTimeFormat,\n"
              "        readReceiptsEnabled\n"
              "      });\n"
              "      userSettings.updateFromData(settings);\n"
              "      readReceiptsEnabled = settings.readReceiptsEnabled;\n"
          )
          if source.count(old_save) != 1:
              raise SystemExit('unexpected preferences save state')
          source = source.replace(old_save, new_save, 1)

          save_marker = "\n  <!-- Save -->\n"
          section = (
              "\n  <!-- Read receipts -->\n"
              "  <FormSection\n"
              "    title={m['settings.preferences.read_receipts.title']()}\n"
              "    maxWidth=\"max-w-md\"\n"
              "    bordered\n"
              "  >\n"
              "    <Checkbox\n"
              "      id=\"read-receipts-enabled\"\n"
              "      bind:checked={readReceiptsEnabled}\n"
              "      label={readReceiptsEnabled\n"
              "        ? m['settings.preferences.read_receipts.enabled_label']()\n"
              "        : m['settings.preferences.read_receipts.disabled_label']()}\n"
              "      description={m['settings.preferences.read_receipts.description']()}\n"
              "      disabled={isSaving}\n"
              "    />\n"
              "  </FormSection>\n"
          )
          if source.count(save_marker) != 1:
              raise SystemExit('unexpected preferences save marker state')
          source = source.replace(save_marker, section + save_marker, 1)
          page.write_text(source, encoding='utf-8')

          test = Path(
              'apps/frontend/src/routes/chat/[serverId]/settings/preferences/'
              'readReceiptPreference.server.spec.ts'
          )
          test_lines = [
              "import { readFileSync } from 'node:fs';",
              "import { fileURLToPath } from 'node:url';",
              "import { describe, expect, it } from 'vitest';",
              '',
              "describe('read receipt preference page', () => {",
              "  it('renders and persists the reciprocal read receipt switch', () => {",
              '    const source = readFileSync(',
              "      fileURLToPath(new URL('./+page.svelte', import.meta.url)),",
              "      'utf8'",
              '    );',
              "    const updateStart = source.indexOf('accountAPI().updateSettings({');",
              "    const updateEnd = source.indexOf('});', updateStart);",
              '',
              '    expect(updateStart).toBeGreaterThanOrEqual(0);',
              '    expect(updateEnd).toBeGreaterThan(updateStart);',
              "    expect(source.slice(updateStart, updateEnd)).toContain('readReceiptsEnabled');",
              "    expect(source).toContain('bind:checked={readReceiptsEnabled}');",
              "    expect(source).toContain('readReceiptsEnabled = settings.readReceiptsEnabled;');",
              '  });',
              '});',
              '',
          ]
          test.write_text('\n'.join(test_lines), encoding='utf-8')
          PY

          rm -f .github/workflows/read-receipts-preference-finalizer-20260726.yml
          git diff --check

      - name: Format preference sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec prettier --write \
            'src/routes/chat/[serverId]/settings/preferences/+page.svelte' \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts'
          git diff --check

      - name: Check Svelte and TypeScript
        id: svelte
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/frontend run check 2>&1 | tee "${RUNNER_TEMP}/read-receipts-preference-svelte.log"

      - name: Run focused preference tests
        id: vitest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/frontend exec vitest --run \
            src/lib/api-client-tests/account.spec.ts \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts' \
            2>&1 | tee "${RUNNER_TEMP}/read-receipts-preference-vitest.log"

      - name: Lint preference sources
        id: eslint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/frontend exec eslint \
            'src/routes/chat/[serverId]/settings/preferences/+page.svelte' \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts' \
            2>&1 | tee "${RUNNER_TEMP}/read-receipts-preference-eslint.log"

      - name: Build frontend
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mise run build-frontend 2>&1 | tee "${RUNNER_TEMP}/read-receipts-preference-build.log"
          git diff --check

      - name: Upload preference diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: towk-read-receipts-preference-diagnostic
          path: |
            ${{ runner.temp }}/read-receipts-preference-svelte.log
            ${{ runner.temp }}/read-receipts-preference-vitest.log
            ${{ runner.temp }}/read-receipts-preference-eslint.log
            ${{ runner.temp }}/read-receipts-preference-build.log
          retention-days: 1
          if-no-files-found: warn

      - name: Require preference checks
        shell: bash
        env:
          SVELTE_OUTCOME: ${{ steps.svelte.outcome }}
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          printf 'svelte=%s\nvitest=%s\neslint=%s\nbuild=%s\n' \
            "${SVELTE_OUTCOME}" "${VITEST_OUTCOME}" "${ESLINT_OUTCOME}" "${BUILD_OUTCOME}"
          test "${SVELTE_OUTCOME}" = success
          test "${VITEST_OUTCOME}" = success
          test "${ESLINT_OUTCOME}" = success
          test "${BUILD_OUTCOME}" = success

      - name: Commit and push validated fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(frontend): persist read receipt preference'
          git push origin HEAD:feat/read-receipts
