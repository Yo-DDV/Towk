name: pr312 validation

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr312-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"
      - name: Typecheck frontend
        run: pnpm run check:frontend
      - name: Lint frontend
        run: pnpm run lint:frontend
      - name: Run targeted grade tests
        run: pnpm --filter towk-frontend exec vitest run src/lib/components/rbac/gradeTemplates.spec.ts src/routes/chat/[serverId]/[roomId]/memberRoleSections.spec.ts

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Build frontend assets
        run: mise build-frontend
      - name: Run RBAC and ConnectRPC tests
        run: cd cli && go test -trimpath -p 1 -tags test_endpoints ./internal/core ./internal/connectapi
