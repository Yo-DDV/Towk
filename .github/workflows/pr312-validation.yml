name: pr312 remediation apply

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-remediation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.event.head_commit.message == 'chore(ci): apply binary PR 312 remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Apply binary remediation once
        shell: bash
        run: |
          set -euo pipefail
          if test -f cli/internal/core/role_template_apply.go; then
            echo 'Remediation already present; nothing to apply.'
            exit 0
          fi
          printf '%s  %s\n' 'e728dbb49039fe94ca0f4c6d52786fed421c7a29de61eeaebc16b27dafeedb4f' '.github/pr312-patch/remediation.patch.gz' | sha256sum -c -
          gzip --test .github/pr312-patch/remediation.patch.gz
          gzip --decompress --stdout .github/pr312-patch/remediation.patch.gz > /tmp/pr312-remediation.patch
          git apply --check /tmp/pr312-remediation.patch
          git apply --index /tmp/pr312-remediation.patch
          git diff --cached --check
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git commit -m 'feat(rbac): complete safe grade template application'
          git push origin HEAD:feat/localized-default-grades
