name: pr312 remediation apply

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-remediation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.event.head_commit.message == 'chore(ci): stage PR 312 remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Verify and apply remediation
        shell: bash
        run: |
          set -euo pipefail
          # All eight transfer fragments must be present before decoding.
          test "$(find .github/pr312-patch -maxdepth 1 -name 'part-*' | wc -l)" -eq 8
          cat .github/pr312-patch/part-* > /tmp/pr312-remediation.patch.gz.b64
          printf '%s  %s\n' 'e728dbb49039fe94ca0f4c6d52786fed421c7a29de61eeaebc16b27dafeedb4f' '/tmp/pr312-remediation.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/pr312-remediation.patch.gz.b64 | gzip --decompress > /tmp/pr312-remediation.patch
          git apply --check /tmp/pr312-remediation.patch
          git apply --index /tmp/pr312-remediation.patch
          git diff --cached --check

      - name: Commit and push remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git commit -m 'feat(rbac): complete safe grade template application'
          git push origin HEAD:feat/localized-default-grades
