name: diagnose long-profile polish

on:
  pull_request:
    types: [synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 182 && github.head_ref == 'feat/user-profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply remediation in diagnostic mode
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch feat/user-profiles https://github.com/Yo-DDV/Towk.git repo
          cd repo
          python3 .github/profile-polish/apply.py
