name: diagnose long-profile polish

on:
  pull_request:
    types: [synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 182 && github.head_ref == 'feat/user-profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/user-profiles
          fetch-depth: 1
          persist-credentials: false

      - name: Apply remediation in diagnostic mode
        run: python3 .github/profile-polish/apply.py
