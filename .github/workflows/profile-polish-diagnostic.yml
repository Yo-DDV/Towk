name: publish long-profile polish

on:
  pull_request:
    types: [synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-long-profile-polish-pr182
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.number == 182 && github.head_ref == 'feat/user-profiles'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out profile branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/user-profiles
          fetch-depth: 0
          persist-credentials: true

      - name: Verify publication inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/profile-polish/apply.py
          test -f .github/profile-polish/run.py
          test -f .github/profile-polish-trigger
          git fetch --no-tags origin main feat/user-profiles

      - name: Apply bounded biography and responsive layout
        run: python3 .github/profile-polish/run.py

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Regenerate protobuf and localization outputs
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter towk-frontend paraglide
          mise run codegen-proto

      - name: Format changed files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cli/internal/core/user_profile.go cli/internal/core/user_profile_test.go
          pnpm --dir apps/frontend exec prettier --write \
            messages/de/chat.json messages/de/settings.json \
            messages/en/chat.json messages/en/settings.json \
            messages/es/chat.json messages/es/settings.json \
            messages/fr/chat.json messages/fr/settings.json \
            messages/pt/chat.json messages/pt/settings.json \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/settings/ProfileDetailsSettings.svelte \
            src/lib/components/settings/ProfileDetailsSettings.svelte.spec.ts \
            src/lib/profileBiography.ts src/lib/profileBiography.spec.ts

      - name: Build generated API package
        run: mise run build-api-types

      - name: Run targeted lint and type checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec eslint \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/settings/ProfileDetailsSettings.svelte \
            src/lib/components/settings/ProfileDetailsSettings.svelte.spec.ts \
            src/lib/profileBiography.ts src/lib/profileBiography.spec.ts
          pnpm --dir apps/frontend run check

      - name: Run targeted backend tests
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -trimpath -tags test_endpoints ./internal/core -run 'TestNormalizeAndValidateUserBiography|TestChattoCoreUpdateUserBiographyEncryptsAndClears' -count=1
          go test -trimpath -tags test_endpoints ./internal/connectapi -run 'TestUpdateProfilePrevalidatesBiographyBeforeIdentityMutations|TestGetUserProfileReturnsDetailedPrivacyAwareProfile' -count=1

      - name: Install Chromium
        run: pnpm --dir apps/frontend exec playwright install --with-deps chromium

      - name: Run targeted frontend tests
        shell: bash
        env:
          VITEST_BROWSER: chromium
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec vitest run --project server src/lib/profileBiography.spec.ts
          pnpm --dir apps/frontend exec vitest run --project client \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/settings/ProfileDetailsSettings.svelte.spec.ts

      - name: Build frontend and run policy checks
        shell: bash
        run: |
          set -euo pipefail
          mise run build-frontend
          mise run license-check
          mise run public-surface-check
          git diff --check

      - name: Publish final product tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/profile-polish
          rm -f .github/profile-polish-trigger
          rm -f .github/workflows/profile-polish-diagnostic.yml
          rm -f .github/workflows/profile-polish-publisher.yml
          git checkout origin/main -- .github/workflows/quick-gate.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          ! git ls-files | grep -E '^\.github/(profile-polish/|profile-polish-trigger$|workflows/profile-polish-(diagnostic|publisher)\.yml$)'
          ! git diff --cached | grep -Ei '(^|[[:space:]])(Co-authored-by|Generated-by|Assisted-by|Pair-programmed-by):'
          author_name=$(git show -s --format=%an HEAD)
          author_email=$(git show -s --format=%ae HEAD)
          GIT_AUTHOR_NAME="$author_name" GIT_AUTHOR_EMAIL="$author_email" \
          GIT_COMMITTER_NAME="$author_name" GIT_COMMITTER_EMAIL="$author_email" \
            git commit -m 'fix(profiles): bound long biographies and rebalance layout'
          git push origin HEAD:feat/user-profiles
