name: pr173 current-main finalization

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: pr173-current-main-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[run pr173-current-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Reconstruct, validate, and publish clean product head
        id: finalize
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          bash -x .github/pr173-current-finalize.sh 2>&1 | tee "${RUNNER_TEMP}/pr173-current-finalize.log"
          status=${PIPESTATUS[0]}
          printf 'exit_code=%s\n' "${status}" > "${RUNNER_TEMP}/pr173-current-finalize-status.txt"
          exit "${status}"

      - name: Collect bounded diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/pr173-current-finalize-diagnostics"
          mkdir -p "${output}"
          cp "${RUNNER_TEMP}/pr173-current-finalize-status.txt" "${output}/status.txt" 2>/dev/null || true
          if test -f "${RUNNER_TEMP}/pr173-current-finalize.log"; then
            tail -n 500 "${RUNNER_TEMP}/pr173-current-finalize.log" > "${output}/terminal-tail.log"
          else
            printf '%s\n' 'finalizer log was not created' > "${output}/terminal-tail.log"
          fi
          printf 'head=%s\noutcome=%s\nconclusion=%s\n' \
            "${{ github.sha }}" \
            "${{ steps.finalize.outcome }}" \
            "${{ steps.finalize.conclusion }}" \
            > "${output}/workflow.txt"

      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr173-current-finalize-${{ github.sha }}
          path: ${{ runner.temp }}/pr173-current-finalize-diagnostics
          retention-days: 1
          if-no-files-found: error

      - name: Preserve finalizer failure
        if: steps.finalize.outcome == 'failure'
        shell: bash
        run: exit 1
