name: read-receipts main sync diagnostic
# Registered before this trigger commit.

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: read

concurrency:
  group: read-receipts-main-sync-diagnostic
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Inspect additive merge with current main
        id: merge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/read-receipts-main-sync"
          git fetch --no-tags origin main
          {
            printf 'branch_head=%s\n' "$(git rev-parse HEAD)"
            printf 'main_head=%s\n' "$(git rev-parse origin/main)"
            printf 'merge_base=%s\n' "$(git merge-base HEAD origin/main)"
          } > "${RUNNER_TEMP}/read-receipts-main-sync/refs.txt"

          set +e
          git merge --no-commit --no-ff origin/main > "${RUNNER_TEMP}/read-receipts-main-sync/merge.stdout" 2> "${RUNNER_TEMP}/read-receipts-main-sync/merge.stderr"
          merge_status=$?
          set -e
          printf '%s\n' "${merge_status}" > "${RUNNER_TEMP}/read-receipts-main-sync/merge-status.txt"
          git status --short > "${RUNNER_TEMP}/read-receipts-main-sync/status.txt"
          git diff --name-only --diff-filter=U > "${RUNNER_TEMP}/read-receipts-main-sync/conflicts.txt"
          git diff --cc > "${RUNNER_TEMP}/read-receipts-main-sync/conflicts.diff" || true

          while IFS= read -r path; do
            test -n "${path}" || continue
            safe="$(printf '%s' "${path}" | tr '/ ' '__')"
            git show ":1:${path}" > "${RUNNER_TEMP}/read-receipts-main-sync/${safe}.base" 2>/dev/null || true
            git show ":2:${path}" > "${RUNNER_TEMP}/read-receipts-main-sync/${safe}.branch" 2>/dev/null || true
            git show ":3:${path}" > "${RUNNER_TEMP}/read-receipts-main-sync/${safe}.main" 2>/dev/null || true
            cp -- "${path}" "${RUNNER_TEMP}/read-receipts-main-sync/${safe}.markers" 2>/dev/null || true
          done < "${RUNNER_TEMP}/read-receipts-main-sync/conflicts.txt"

          git merge --abort 2>/dev/null || true
          exit "${merge_status}"

      - name: Upload merge diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: towk-read-receipts-main-sync-diagnostic
          path: ${{ runner.temp }}/read-receipts-main-sync
          retention-days: 1
          if-no-files-found: error
