name: sync profile branch with main before merge

on:
  push:
    branches:
      - feat/user-profiles
    paths:
      - .github/workflows/pr182-sync-main-before-merge.yml

permissions:
  contents: write

concurrency:
  group: pr182-sync-main-before-merge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/user-profiles
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main feat/user-profiles
          test "$(git rev-parse HEAD^)" = "628e77d4db610b78e9c39d1f491bdfd8ae53eb6d"
          author_name=$(git show -s --format=%an HEAD)
          author_email=$(git show -s --format=%ae HEAD)
          GIT_AUTHOR_NAME="$author_name" GIT_AUTHOR_EMAIL="$author_email" \
          GIT_COMMITTER_NAME="$author_name" GIT_COMMITTER_EMAIL="$author_email" \
            git merge --no-commit --no-ff origin/main
          rm .github/workflows/pr182-sync-main-before-merge.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          test -z "$(git diff --cached | grep -Ei '(^|[[:space:]])(Co-authored-by|Generated-by|Assisted-by|Pair-programmed-by):' || true)"
          GIT_AUTHOR_NAME="$author_name" GIT_AUTHOR_EMAIL="$author_email" \
          GIT_COMMITTER_NAME="$author_name" GIT_COMMITTER_EMAIL="$author_email" \
            git commit -m 'chore(profiles): sync current main before merge'
          git push origin HEAD:feat/user-profiles
