name: presence hash diagnostic

on:
  push:
    branches:
      - feat/pwa-presence-leases

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish run coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg state pending \
            --arg context 'presence-hash-diagnostic' \
            --arg description "diagnostic run ${GITHUB_RUN_ID}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
      - name: Calculate overlay hashes
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/presence-source/hardened-[0-9][0-9].txt
          wc -c .github/presence-source/hardening2-[0-9][0-9].txt
          sha256sum .github/presence-source/hardened-[0-9][0-9].txt
          sha256sum .github/presence-source/hardening2-[0-9][0-9].txt
          cat .github/presence-source/hardened-[0-9][0-9].txt | base64 -d > /tmp/first.tar.gz
          cat .github/presence-source/hardening2-[0-9][0-9].txt | base64 -d > /tmp/second.tar.gz
          sha256sum /tmp/first.tar.gz /tmp/second.tar.gz
          tar -tzf /tmp/first.tar.gz
          tar -tzf /tmp/second.tar.gz
