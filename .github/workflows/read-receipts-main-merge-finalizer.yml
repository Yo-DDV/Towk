name: read-receipts main reconciliation

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-main-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr173-main-finalizer]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Rebuild, validate, and publish the additive candidate
        shell: bash
        run: bash .github/scripts/pr173-reconcile.sh
