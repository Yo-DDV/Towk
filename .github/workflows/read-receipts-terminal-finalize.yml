name: read-receipts terminal finalization

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-terminal-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[run pr173-terminal]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact temporary head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Reconstruct, validate, and publish the clean product tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR173_DESIGN_BASE: b9f61f1b28608784c1e1ed1e2232131e681a12b3
          PR173_FEATURE_SOURCE: f07456ce30c48fd35d63fcc9d3480b5792f40cfa
          PR173_EXPECTED_MAIN: d277c59d2ebb16d076de6ae793e4679251be38b4
          TARGET_BRANCH: feat/read-receipts
        run: |
          set -Eeuo pipefail
          source_head="$(git rev-parse HEAD)"
          cat .github/pr173-reconstruct.part00 \
              .github/pr173-reconstruct.part01 \
              .github/pr173-reconstruct.part02.00 \
              .github/pr173-reconstruct.part02.01 \
              .github/pr173-reconstruct.part02.02 \
              .github/pr173-reconstruct.part02.03 \
              .github/pr173-reconstruct.part02.04 \
              .github/pr173-reconstruct.part02.05 \
              .github/pr173-reconstruct.part03 \
              .github/pr173-reconstruct.part04 \
              > "${RUNNER_TEMP}/pr173-reconstruct.py.gz.b64"
          base64 -d .github/pr173-terminal.sh.gz.b64 | gzip -d > "${RUNNER_TEMP}/pr173-terminal.sh"
          sed -i 's#base64 -d \.github/pr173-reconstruct\.py\.gz\.b64#base64 -d "${RUNNER_TEMP}/pr173-reconstruct.py.gz.b64"#' "${RUNNER_TEMP}/pr173-terminal.sh"
          python3 - "${RUNNER_TEMP}/pr173-terminal.sh" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding='utf-8')
          needle = 'python3 "${RUNNER_TEMP}/pr173-reconstruct.py"\n'
          inserted = '''python3 "${RUNNER_TEMP}/pr173-reconstruct.py"
          python3 - <<'PYFIX'
          from pathlib import Path
          import re

          expected_counts = {
              'apps/frontend/src/lib/api-client/account.ts': 2,
              'apps/frontend/src/lib/api-client/viewer.ts': 1,
              'apps/frontend/src/lib/eventBus.svelte.ts': 2,
          }
          declaration_pattern = re.compile(r'(readReceiptsEnabled\??:\s*boolean;),')
          for name, expected_count in expected_counts.items():
              file_path = Path(name)
              text = file_path.read_text(encoding='utf-8')
              corrected, count = declaration_pattern.subn(lambda match: match.group(1), text)
              if count != expected_count:
                  raise SystemExit(
                      f'{name}: expected {expected_count} malformed merged declarations, got {count}'
                  )
              file_path.write_text(corrected, encoding='utf-8')

          def replace_message(path_name: str, message_name: str, replacement: str) -> None:
              file_path = Path(path_name)
              text = file_path.read_text(encoding='utf-8')
              start = text.index(f'message {message_name} {{')
              end = text.index(chr(10) + '}', start) + 2
              corrected = text[:start] + replacement + text[end:]
              file_path.write_text(corrected, encoding='utf-8')

          replace_message(
              'proto/chatto/core/v1/live_events.proto',
              'PublicReadReceiptAdvancedEvent',
              """message PublicReadReceiptAdvancedEvent {
            reserved 3, 4, 5, 6;
            reserved \"user_id\", \"event_id\", \"event_sequence\", \"read_at\";

            string room_id = 1;
            optional string thread_root_event_id = 2;
          }""",
          )
          replace_message(
              'proto/chatto/realtime/v1/realtime.proto',
              'RealtimeReadReceiptAdvancedEvent',
              """message RealtimeReadReceiptAdvancedEvent {
            reserved 3, 4, 5, 6;
            reserved \"user_id\", \"event_id\", \"event_sequence\", \"read_at\";

            // Room containing the affected timeline.
            string room_id = 1;
            // Thread root when the invalidation belongs to a thread timeline.
            optional string thread_root_event_id = 2;
          }""",
          )
          PYFIX
          '''
          if source.count(needle) != 1:
              raise SystemExit(f'expected one reconstruction command, got {source.count(needle)}')
          source = source.replace(needle, inserted, 1)

          old_contract = """              for forbidden in ('user_id =', 'event_id =', 'event_sequence =', 'read_at ='):
                  assert forbidden not in event
"""
          new_contract = """              for forbidden in ('user_id', 'event_id', 'event_sequence', 'read_at'):
                  assert f' {forbidden} =' not in event
"""
          if source.count(old_contract) != 1:
              raise SystemExit(
                  f'expected one realtime privacy assertion block, got {source.count(old_contract)}'
              )
          source = source.replace(old_contract, new_contract, 1)
          path.write_text(source, encoding='utf-8')
          PY
          chmod +x "${RUNNER_TEMP}/pr173-terminal.sh"

          set +e
          set -o pipefail
          bash -x "${RUNNER_TEMP}/pr173-terminal.sh" 2>&1 | tee "${RUNNER_TEMP}/pr173-terminal.log"
          status=${PIPESTATUS[0]}
          set -e

          if test "${status}" -ne 0; then
            python3 - "${status}" "${RUNNER_TEMP}/pr173-terminal.log" "${RUNNER_TEMP}/pr173-terminal-status.txt" <<'PY'
          from pathlib import Path
          import re
          import sys

          status, log_path, output_path = sys.argv[1:]
          text = Path(log_path).read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          text = re.sub(r'/home/runner/work/Towk/Towk', '<workspace>', text)
          text = re.sub(r'/home/runner/work/_temp/[^ /\n]+', '<runner-temp>', text)
          tail = '\n'.join(text.splitlines()[-100:])
          Path(output_path).write_text(
              f'source_head={sys.argv[0] if False else ""}\nexit_code={status}\n--- sanitized tail ---\n{tail}\n',
              encoding='utf-8',
          )
          PY
            printf 'source_head=%s\n' "${source_head}" | cat - "${RUNNER_TEMP}/pr173-terminal-status.txt" > "${RUNNER_TEMP}/pr173-terminal-status.with-head.txt"
            mv "${RUNNER_TEMP}/pr173-terminal-status.with-head.txt" "${RUNNER_TEMP}/pr173-terminal-status.txt"
            encoded="$(base64 -w0 "${RUNNER_TEMP}/pr173-terminal-status.txt")"
            api_path="repos/${GITHUB_REPOSITORY}/contents/.github/pr173-push-finalizer-status.txt"
            existing_sha="$(gh api "${api_path}?ref=${TARGET_BRANCH}" --jq .sha 2>/dev/null || true)"
            args=(--method PUT "${api_path}" -f message='chore(ci): record terminal read receipt failure [skip pr173-main-finalizer] [skip pr173-merge-diagnostic]' -f branch="${TARGET_BRANCH}" -f content="${encoded}")
            if test -n "${existing_sha}"; then
              args+=(-f sha="${existing_sha}")
            fi
            gh api "${args[@]}" >/dev/null
            exit 0
          fi
