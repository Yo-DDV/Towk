name: read-receipts terminal finalization

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-terminal-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[run pr173-terminal]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact temporary head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Reconstruct, validate, and publish the clean product tree
        shell: bash
        env:
          PR173_DESIGN_BASE: b9f61f1b28608784c1e1ed1e2232131e681a12b3
          PR173_FEATURE_SOURCE: f07456ce30c48fd35d63fcc9d3480b5792f40cfa
          PR173_EXPECTED_MAIN: d277c59d2ebb16d076de6ae793e4679251be38b4
          TARGET_BRANCH: feat/read-receipts
        run: |
          set -Eeuo pipefail

          source_head="$(git rev-parse HEAD)"
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'

          base64 -d .github/pr173-reconstruct.py.gz.b64 | gzip -d > "${RUNNER_TEMP}/pr173-reconstruct.py"
          chmod +x "${RUNNER_TEMP}/pr173-reconstruct.py"

          git fetch --no-tags origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${PR173_EXPECTED_MAIN}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${source_head}"
          git cat-file -e "${PR173_DESIGN_BASE}^{commit}"
          git cat-file -e "${PR173_FEATURE_SOURCE}^{commit}"
          git merge-base --is-ancestor "${PR173_FEATURE_SOURCE}" "${source_head}"

          if git log --format='%B' "${PR173_DESIGN_BASE}..${PR173_FEATURE_SOURCE}" |
            grep -Eiq '^(Co-authored-by|Generated-by|Assisted-by|Pair-programmed-by):'; then
            echo 'forbidden authorship trailer in product source' >&2
            exit 1
          fi

          git diff --binary "${PR173_DESIGN_BASE}" "${PR173_FEATURE_SOURCE}" > "${RUNNER_TEMP}/pr173-feature.patch"
          git checkout --detach "${PR173_EXPECTED_MAIN}"

          set +e
          git apply --reject --whitespace=nowarn "${RUNNER_TEMP}/pr173-feature.patch"
          apply_status=$?
          set -e
          test "${apply_status}" -eq 0 -o "${apply_status}" -eq 1

          python3 "${RUNNER_TEMP}/pr173-reconstruct.py"

          gofmt -w \
            cli/internal/connectapi/account.go \
            cli/internal/connectapi/read_state.go \
            cli/internal/connectapi/read_state_privacy_test.go \
            cli/internal/connectapi/server.go \
            cli/internal/connectapi/viewer.go \
            cli/internal/core/config_projection.go \
            cli/internal/core/read_receipts.go \
            cli/internal/core/read_receipts_test.go \
            cli/internal/core/user_preferences.go \
            cli/internal/http_server/realtime.go \
            cli/internal/http_server/realtime_test.go

          (
            cd proto
            mise x -- buf format -w .
          )

          pnpm --dir apps/frontend exec prettier --write \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client/account.ts \
            src/lib/api-client/readState.ts \
            src/lib/api-client/viewer.ts \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/realtimeEventMapper.ts \
            src/routes/chat/AuthenticatedChatProvider.svelte \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/+page.svelte' \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts' \
            ../../docs/adr/ADR-055-read-receipt-publication-boundary.md \
            ../../docs/adr/INDEX.md \
            ../../docs/fdr/FDR-031-read-receipts.md \
            ../../docs/fdr/INDEX.md

          mise run codegen-proto
          pnpm --filter @towk/api-types build
          git diff --check "${PR173_EXPECTED_MAIN}"

          python3 - <<'PY'
          from pathlib import Path

          def block(path: str, message: str) -> str:
              text = Path(path).read_text(encoding='utf-8')
              start = text.index(f'message {message} {{')
              end = text.index('\n}', start) + 2
              return text[start:end]

          summary = block('proto/chatto/api/v1/read_state.proto', 'ReadReceiptSummary')
          assert 'string message_event_id = 1;' in summary
          assert 'int32 reader_count = 2;' in summary
          assert 'reserved 3, 4;' in summary
          assert 'preview_user_ids =' not in summary
          assert 'latest_read_at =' not in summary

          for path, name in (
              ('proto/chatto/core/v1/live_events.proto', 'PublicReadReceiptAdvancedEvent'),
              ('proto/chatto/realtime/v1/realtime.proto', 'RealtimeReadReceiptAdvancedEvent'),
          ):
              event = block(path, name)
              assert 'string room_id = 1;' in event
              assert 'optional string thread_root_event_id = 2;' in event
              assert 'reserved 3, 4, 5, 6;' in event
              for forbidden in ('user_id =', 'event_id =', 'event_sequence =', 'read_at ='):
                  assert forbidden not in event

          account = Path('proto/chatto/api/v1/account.proto').read_text(encoding='utf-8')
          viewer = Path('proto/chatto/api/v1/viewer.proto').read_text(encoding='utf-8')
          prefs = Path('proto/chatto/core/v1/user_preferences.proto').read_text(encoding='utf-8')
          event = Path('proto/chatto/core/v1/event.proto').read_text(encoding='utf-8')
          assert 'optional bool show_last_activity = 3;' in account
          assert 'optional bool read_receipts_enabled = 4;' in account
          assert 'bool show_last_activity = 3;' in viewer
          assert 'bool read_receipts_enabled = 4;' in viewer
          assert 'optional bool show_last_activity = 3;' in prefs
          assert 'optional bool read_receipts_enabled = 4;' in prefs
          assert 'user_last_activity_visibility_changed = 519;' in event
          assert 'server_read_receipts_enabled_changed = 520;' in event
          assert 'user_read_receipts_enabled_changed = 521;' in event
          assert 'user_read_receipts_enabled_cleared = 522;' in event

          assert Path('docs/adr/ADR-055-read-receipt-publication-boundary.md').exists()
          assert not Path('docs/adr/ADR-054-read-receipt-publication-boundary.md').exists()
          assert 'FDR-031-read-receipts.md' in Path('docs/fdr/INDEX.md').read_text(encoding='utf-8')
          assert Path('apps/frontend/src/lib/components/ExternalGifEmbed.svelte').exists()
          assert Path('apps/frontend/src/lib/styles/liquid-glass-surfaces.css').exists()
          assert Path('apps/frontend/src/lib/components/settings/ProfileDetailsSettings.svelte').exists()
          assert Path('examples/dockercompose/compose.turn-tls.yml').exists()
          PY

          (
            cd proto
            mise x -- buf build
            mise x -- buf lint \
              --path chatto/api/v1/read_state.proto \
              --path chatto/core/v1/live_events.proto \
              --path chatto/realtime/v1/realtime.proto
          )

          (
            cd cli
            mise x -- go test -race -trimpath -tags test_endpoints \
              ./internal/core ./internal/connectapi ./internal/http_server ./internal/events \
              -run 'ReadReceipt|ReadReceipts|RealtimeMapper|UserSettings|ServerUserPreferences|Subject|ServerCapabilities' \
              -count=1
            mise x -- go vet ./internal/core ./internal/connectapi ./internal/http_server ./internal/events
          )

          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec vitest --run \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client-tests/viewer.spec.ts \
            src/lib/api-client-tests/serverState.spec.ts \
            src/lib/state/server/store.svelte.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts'

          pnpm --dir apps/frontend exec eslint \
            src/lib/ServerSettings.svelte \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client/account.ts \
            src/lib/api-client/readState.ts \
            src/lib/api-client/serverState.ts \
            src/lib/api-client/viewer.ts \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/realtimeEventMapper.ts \
            src/lib/state/userSettings.svelte.ts \
            src/routes/chat/AuthenticatedChatProvider.svelte \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/MessageEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/MessageMetaBar.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ThreadPane.svelte' \
            'src/routes/chat/[serverId]/[roomId]/TimelineEventsPane.svelte' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/+page.svelte' \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts'

          pnpm --dir apps/frontend exec playwright install chromium
          pnpm --dir apps/frontend exec vitest --run --project client \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts'

          mise run build-frontend
          pnpm run build:docs
          mise run license-check
          mise run public-surface-check

          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only "${PR173_EXPECTED_MAIN}")"
          test -z "$(find . -path './.git' -prune -o -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit)"
          test -z "$(git diff --cached --name-only "${PR173_EXPECTED_MAIN}" -- .github)"

          git fetch --no-tags origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${PR173_EXPECTED_MAIN}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${source_head}"

          candidate_tree="$(git write-tree)"
          candidate_commit="$(printf '%s\n' 'fix(integration): reconcile privacy-aware read receipts with main' |
            git commit-tree "${candidate_tree}" -p "${source_head}")"
          git push origin "${candidate_commit}:refs/heads/${TARGET_BRANCH}"
          printf 'candidate_tree=%s\n' "${candidate_tree}"
          printf 'candidate_commit=%s\n' "${candidate_commit}"
