name: read-receipts final tree publisher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: read-receipts-final-tree-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'feat/read-receipts'
    runs-on: ubuntu-latest
    env:
      SOURCE_HEAD_SHA: 71151841c0f9937bfa2d80d026dedf6653f347fc
      PATCH_BLOB_SHA: 785e6582c6ccaaee08b648d78c8b2309fa91bf90
      PATCH_SHA256: d4aefe28a12ef1abb3eb1cb03fab781c7b85f9d7e7ef884dabd048875ff46399
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply reviewed source delta
        id: apply_delta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          debug="${RUNNER_TEMP}/read-receipts-final-debug.txt"
          blob_payload="${RUNNER_TEMP}/read-receipts-final.blob"
          decoded_once="${RUNNER_TEMP}/read-receipts-final.decoded-once"
          decoded_twice="${RUNNER_TEMP}/read-receipts-final.decoded-twice"
          patch_file="${RUNNER_TEMP}/read-receipts-final.patch"
          files="${RUNNER_TEMP}/read-receipts-final-files.txt"
          : > "${debug}"
          exec > >(tee -a "${debug}") 2>&1

          try_patch_from_gzip() {
            local input="$1"
            local label="$2"
            : > "${patch_file}"
            gzip -dc "${input}" > "${patch_file}"
            local status=$?
            local size
            size="$(wc -c < "${patch_file}")"
            echo "candidate=${label} gzip_status=${status} patch_bytes=${size}"
            test "${size}" -gt 0 || return 1
            if git apply --check "${patch_file}"; then
              echo "decode=${label}"
              return 0
            fi
            return 1
          }

          echo "phase=verify_head"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_HEAD_SHA}" || exit 10

          echo "phase=fetch_blob"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" \
            | jq -er '.content' \
            | tr -d '\r\n' \
            | base64 -d > "${blob_payload}" || exit 20
          wc -c "${blob_payload}"
          file "${blob_payload}" || true

          echo "phase=decode_patch"
          if try_patch_from_gzip "${blob_payload}" raw-gzip; then
            true
          elif base64 -di "${blob_payload}" > "${decoded_once}" 2>/dev/null && try_patch_from_gzip "${decoded_once}" base64-gzip; then
            true
          elif base64 -di "${blob_payload}" > "${decoded_once}" 2>/dev/null && base64 -di "${decoded_once}" > "${decoded_twice}" 2>/dev/null && try_patch_from_gzip "${decoded_twice}" double-base64-gzip; then
            true
          else
            echo "decode=failed"
            head -c 80 "${blob_payload}" | od -An -tx1 || true
            exit 30
          fi
          wc -c "${patch_file}"
          actual_patch_sha="$(sha256sum "${patch_file}" | cut -d' ' -f1)"
          echo "patch_sha256=${actual_patch_sha}"
          if test "${actual_patch_sha}" != "${PATCH_SHA256}"; then
            echo "patch_sha256_warning=expected_${PATCH_SHA256}_got_${actual_patch_sha}"
          fi

          echo "phase=git_apply"
          git apply "${patch_file}" || exit 41

          echo "phase=delete_temporary_files"
          rm -f .github/workflows/read-receipts-snapshot.yml
          rm -f .github/workflows/read-receipts-candidate-tree.yml

          echo "phase=diff_check"
          git diff --check || exit 50
          git diff --name-status HEAD > "${files}" || exit 51
          cat "${files}"
          echo "phase=apply_done"

      - name: Create final tree object
        id: final_tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          entries="${RUNNER_TEMP}/read-receipts-final-entries.json"
          files="${RUNNER_TEMP}/read-receipts-final-files.txt"
          response="${RUNNER_TEMP}/read-receipts-final-tree.json"
          base_tree="$(git show -s --format=%T HEAD)"
          printf '[]' > "${entries}"

          while IFS=$'\t' read -r status path; do
            test -n "${status}"
            if [[ "${status}" = D* ]]; then
              jq --arg path "${path}" \
                '. + [{path: $path, mode: "100644", type: "blob", sha: null}]' \
                "${entries}" > "${entries}.next"
              mv "${entries}.next" "${entries}"
              continue
            fi

            test -f "${path}"
            blob_sha="$({
              base64 -w0 "${path}" \
                | jq -Rs '{content: ., encoding: "base64"}' \
                | curl --fail --silent --show-error --location --retry 3 \
                    --request POST \
                    --header "Accept: application/vnd.github+json" \
                    --header "Authorization: Bearer ${GH_TOKEN}" \
                    --header "X-GitHub-Api-Version: 2022-11-28" \
                    --data-binary @- \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
                | jq -er '.sha'
            })"
            test "$(git hash-object "${path}")" = "${blob_sha}"
            jq --arg path "${path}" --arg sha "${blob_sha}" \
              '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' \
              "${entries}" > "${entries}.next"
            mv "${entries}.next" "${entries}"
          done < "${files}"

          jq -n --arg base_tree "${base_tree}" --slurpfile tree "${entries}" \
            '{base_tree: $base_tree, tree: $tree[0]}' \
            | curl --fail --silent --show-error --location --retry 3 \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary @- \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/trees" \
            | tee "${response}"
          tree_sha="$(jq -er '.sha' "${response}")"
          printf 'tree_sha=%s\n' "${tree_sha}" >> "${GITHUB_OUTPUT}"
          {
            printf 'parent_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'tree_sha=%s\n' "${tree_sha}"
            printf 'files_sha256=%s\n' "$(sha256sum "${files}" | cut -d' ' -f1)"
          } > "${RUNNER_TEMP}/read-receipts-final-status.txt"

      - name: Upload final tree proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: towk-read-receipts-final-tree
          path: |
            ${{ runner.temp }}/read-receipts-final-tree.json
            ${{ runner.temp }}/read-receipts-final-status.txt
            ${{ runner.temp }}/read-receipts-final-files.txt
            ${{ runner.temp }}/read-receipts-final-debug.txt
          retention-days: 1
          if-no-files-found: warn
