name: read-receipts privacy executor

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-privacy-executor
  cancel-in-progress: true

jobs:
  execute:
    if: ${{ !contains(github.event.head_commit.message, '[skip read-receipts-privacy-executor]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up repository toolchain
        id: setup
        continue-on-error: true
        uses: ./.github/actions/setup

      - name: Apply and format privacy remediation
        id: patch
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          script="${RUNNER_TEMP}/read-receipts-patch-step.sh"
          python3 - "${script}" <<'PY'
          from pathlib import Path
          import sys

          source = Path('.github/workflows/read-receipts-realtime-privacy-finalizer-v2.yml').read_text(encoding='utf-8')
          step = source.index('      - name: Apply anonymous realtime invalidation contract\n')
          start = source.index('        run: |\n', step) + len('        run: |\n')
          end = source.index('\n      - name: Regenerate protobuf bindings and API documentation\n', start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old_buf = '(cd proto && mise x -- buf format -w chatto/core/v1/live_events.proto chatto/realtime/v1/realtime.proto)'
          new_buf = '''(cd proto && mise x -- buf format -w chatto/core/v1/live_events.proto)
          (cd proto && mise x -- buf format -w chatto/realtime/v1/realtime.proto)'''
          if script.count(old_buf) != 1:
              raise SystemExit(f'expected one obsolete buf format command, got {script.count(old_buf)}')
          script = script.replace(old_buf, new_buf, 1)

          slash = chr(92)
          old_docs = '\n'.join([
              f'pnpm exec prettier --write {slash}',
              f'  docs/fdr/FDR-031-read-receipts.md {slash}',
              '  docs/adr/ADR-054-read-receipt-publication-boundary.md',
          ])
          new_docs = '\n'.join([
              f'pnpm --dir apps/frontend exec prettier --write {slash}',
              f'  ../../docs/fdr/FDR-031-read-receipts.md {slash}',
              '  ../../docs/adr/ADR-054-read-receipt-publication-boundary.md',
          ])
          if script.count(old_docs) != 1:
              raise SystemExit(f'expected one root prettier command, got {script.count(old_docs)}')
          script = script.replace(old_docs, new_docs, 1)

          Path(sys.argv[1]).write_text(script, encoding='utf-8')
          PY
          bash "${script}"

      - name: Regenerate protobuf bindings and API documentation
        id: codegen
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mise run codegen-proto
          pnpm --filter @towk/api-types build
          git diff --check

      - name: Verify anonymous source contract
        id: contract
        if: steps.codegen.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def message_block(path: str, name: str) -> str:
              text = Path(path).read_text(encoding='utf-8')
              start = text.index(f'message {name} {{')
              end = text.index('\n}', start) + 2
              return text[start:end]

          for path, name in (
              ('proto/chatto/core/v1/live_events.proto', 'PublicReadReceiptAdvancedEvent'),
              ('proto/chatto/realtime/v1/realtime.proto', 'RealtimeReadReceiptAdvancedEvent'),
          ):
              block = message_block(path, name)
              assert 'string room_id = 1;' in block
              assert 'optional string thread_root_event_id = 2;' in block
              assert 'reserved 3, 4, 5, 6;' in block
              assert 'reserved "user_id", "event_id", "event_sequence", "read_at";' in block
              for forbidden in ('string user_id =', 'string event_id =', 'uint64 event_sequence =', 'Timestamp read_at ='):
                  assert forbidden not in block

          event_list = Path('apps/frontend/src/routes/chat/[serverId]/[roomId]/EventList.svelte').read_text(encoding='utf-8')
          assert 'withReadReceiptPresentation(filteredEvents)' in event_list
          assert 'readReceiptSummaryEventIds(presentedEvents)' in event_list
          assert '.slice(-120)' not in event_list

          mapper = Path('apps/frontend/src/lib/realtimeEventMapper.ts').read_text(encoding='utf-8')
          start = mapper.index("case 'readReceiptAdvanced':")
          end = mapper.index("case 'roomGroupsUpdated':", start)
          block = mapper[start:end]
          for forbidden in ('value.userId', 'value.eventId', 'value.eventSequence', 'value.readAt'):
              assert forbidden not in block
          PY
          (cd proto && mise x -- buf build)
          (cd proto && mise x -- buf lint --path chatto/core/v1/live_events.proto --path chatto/realtime/v1/realtime.proto)

      - name: Test affected backend under race
        id: backend
        if: steps.contract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -race -trimpath -tags test_endpoints \
            ./internal/core ./internal/connectapi ./internal/http_server ./internal/events \
            -run 'ReadReceipt|ReadReceipts|RealtimeMapper|UserSettings|ServerUserPreferences|Subject' \
            -count=1
          go vet ./internal/core ./internal/connectapi ./internal/http_server ./internal/events

      - name: Check and test affected frontend
        id: frontend
        if: steps.contract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec vitest --run \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client-tests/viewer.spec.ts \
            src/lib/api-client-tests/serverState.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts'
          pnpm --dir apps/frontend exec eslint \
            src/lib/api-client/renderTypes.ts \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.ts \
            src/lib/realtimeEventMapper.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts'

      - name: Build distributable surfaces
        id: build
        if: steps.backend.outcome == 'success' && steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mise run build-frontend
          pnpm run build:docs
          mise run public-surface-check
          mise run license-check
          git diff --check

      - name: Publish validated remediation
        if: >-
          steps.setup.outcome == 'success' &&
          steps.patch.outcome == 'success' &&
          steps.codegen.outcome == 'success' &&
          steps.contract.outcome == 'success' &&
          steps.backend.outcome == 'success' &&
          steps.frontend.outcome == 'success' &&
          steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          rm -f \
            .github/workflows/read-receipts-main-sync-diagnostic.yml \
            .github/workflows/read-receipts-realtime-privacy-finalizer-v2.yml \
            .github/workflows/read-receipts-patch-trace.yml \
            .github/workflows/read-receipts-command-fixer.yml \
            .github/workflows/read-receipts-privacy-executor.yml \
            .github/read-receipts-privacy-finalizer-status.txt \
            .github/read-receipts-privacy-executor-status.txt \
            .github/read-receipts-privacy-v2-trigger.txt \
            .github/read-receipts-patch-trace-trigger.txt \
            .github/read-receipts-patch-trace-v2.txt \
            .github/read-receipts-patch-trace-v3.txt \
            .github/read-receipts-patch-trace-v4.txt
          git add -A
          git diff --cached --check
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'fix(realtime): anonymize read receipt invalidation'
          git push origin HEAD:feat/read-receipts

      - name: Record executor failure status
        if: >-
          always() && !(
          steps.setup.outcome == 'success' &&
          steps.patch.outcome == 'success' &&
          steps.codegen.outcome == 'success' &&
          steps.contract.outcome == 'success' &&
          steps.backend.outcome == 'success' &&
          steps.frontend.outcome == 'success' &&
          steps.build.outcome == 'success')
        shell: bash
        env:
          SETUP: ${{ steps.setup.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          CODEGEN: ${{ steps.codegen.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          cat > .github/read-receipts-privacy-executor-status.txt <<EOF
          source_head=${{ github.sha }}
          setup=${SETUP}
          patch=${PATCH}
          codegen=${CODEGEN}
          contract=${CONTRACT}
          backend=${BACKEND}
          frontend=${FRONTEND}
          build=${BUILD}
          EOF
          git add .github/read-receipts-privacy-executor-status.txt
          git diff --cached --quiet && exit 1
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'chore(ci): record privacy executor failure [skip read-receipts-privacy-executor] [skip read-receipts-privacy-v2] [skip read-receipts-patch-trace] [skip read-receipts-command-fixer]'
          git push origin HEAD:feat/read-receipts
          exit 1
