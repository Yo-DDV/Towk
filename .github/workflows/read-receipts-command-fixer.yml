name: read-receipts command fixer

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-command-fixer
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip read-receipts-command-fixer]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Correct documentation formatter command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/read-receipts-realtime-privacy-finalizer-v2.yml')
          source = path.read_text(encoding='utf-8')
          slash = chr(92)
          old = '\n'.join([
              f'          pnpm exec prettier --write {slash}',
              f'            docs/fdr/FDR-031-read-receipts.md {slash}',
              '            docs/adr/ADR-054-read-receipt-publication-boundary.md',
          ])
          new = '\n'.join([
              f'          pnpm --dir apps/frontend exec prettier --write {slash}',
              f'            ../../docs/fdr/FDR-031-read-receipts.md {slash}',
              '            ../../docs/adr/ADR-054-read-receipt-publication-boundary.md',
          ])
          if source.count(old) != 1:
              raise SystemExit(f'expected one root prettier command, got {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/read-receipts-command-fixer.yml
          git add -A
          git diff --cached --check
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'chore(ci): correct read receipt formatter command [skip read-receipts-command-fixer] [skip read-receipts-privacy-v2] [skip read-receipts-privacy-executor] [skip read-receipts-patch-trace]'
          git push origin HEAD:feat/read-receipts
