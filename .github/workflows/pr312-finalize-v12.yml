name: pr312 repository pnpm diagnosis

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-final-clean
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'chore(ci): record PR 312 diagnostic v12'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Extract pnpm version
        id: version
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json, pathlib, re, tomllib
          version = ''
          for name in ('package.json', 'apps/frontend/package.json'):
              path = pathlib.Path(name)
              if path.exists():
                  value = json.loads(path.read_text()).get('packageManager', '')
                  if isinstance(value, str) and value.startswith('pnpm@'):
                      version = value[len('pnpm@'):].split('+', 1)[0]
                      break
          if not version:
              text = pathlib.Path('mise.toml').read_text()
              for pattern in (
                  r'(?m)^\s*pnpm\s*=\s*["\']([^"\']+)["\']',
                  r'(?m)^\s*["\']npm:pnpm["\']\s*=\s*["\']([^"\']+)["\']',
              ):
                  match = re.search(pattern, text)
                  if match:
                      version = match.group(1)
                      break
          print(version)
          PY
          )"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check runtimes
        id: runtimes
        continue-on-error: true
        run: node --version && npm --version && go version

      - name: Install pnpm
        id: pnpm_install
        if: steps.version.outcome == 'success' && steps.runtimes.outcome == 'success'
        continue-on-error: true
        run: npm install --global "pnpm@${{ steps.version.outputs.version }}"

      - name: Resolve pnpm
        id: pnpm
        if: steps.pnpm_install.outcome == 'success'
        continue-on-error: true
        run: pnpm --version

      - name: Install locked dependencies
        id: dependencies
        if: steps.pnpm.outcome == 'success'
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Record diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage='V12_SETUP_SUCCESS'
          test '${{ steps.version.outcome }}' = success || stage='V12_VERSION_FAILED'
          if test "${stage}" = V12_SETUP_SUCCESS; then test '${{ steps.runtimes.outcome }}' = success || stage='V12_RUNTIMES_FAILED'; fi
          if test "${stage}" = V12_SETUP_SUCCESS; then test '${{ steps.pnpm_install.outcome }}' = success || stage='V12_PNPM_INSTALL_FAILED'; fi
          if test "${stage}" = V12_SETUP_SUCCESS; then test '${{ steps.pnpm.outcome }}' = success || stage='V12_PNPM_RESOLVE_FAILED'; fi
          if test "${stage}" = V12_SETUP_SUCCESS; then test '${{ steps.dependencies.outcome }}' = success || stage='V12_DEPENDENCIES_FAILED'; fi
          rm -rf .github/pr312-diag
          mkdir -p .github/pr312-diag
          : > ".github/pr312-diag/${stage}"
          git add .github/pr312-diag
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'chore(ci): record PR 312 diagnostic v12'
          git push origin HEAD:feat/localized-default-grades
