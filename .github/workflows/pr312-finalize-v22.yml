name: pr312 npm exec pnpm diagnosis

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-final-clean
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'chore(ci): record PR 312 diagnostic v22'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Verify canonical pnpm policy
        id: policy
        continue-on-error: true
        run: grep -i 'pnpm' mise.toml | grep -qi 'latest'

      - name: Resolve pnpm through npm exec
        id: pnpm
        if: steps.policy.outcome == 'success'
        continue-on-error: true
        run: npm exec --yes --package=pnpm@latest -- pnpm --version

      - name: Install locked dependencies
        id: dependencies
        if: steps.pnpm.outcome == 'success'
        continue-on-error: true
        run: npm exec --yes --package=pnpm@latest -- pnpm install --frozen-lockfile

      - name: Record diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage='V22_SETUP_SUCCESS'
          test '${{ steps.policy.outcome }}' = success || stage='V22_POLICY_FAILED'
          if test "${stage}" = V22_SETUP_SUCCESS; then test '${{ steps.pnpm.outcome }}' = success || stage='V22_PNPM_FAILED'; fi
          if test "${stage}" = V22_SETUP_SUCCESS; then test '${{ steps.dependencies.outcome }}' = success || stage='V22_DEPENDENCIES_FAILED'; fi
          rm -rf .github/pr312-diag
          mkdir -p .github/pr312-diag
          : > ".github/pr312-diag/${stage}"
          git add .github/pr312-diag
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'chore(ci): record PR 312 diagnostic v22'
          git push origin HEAD:feat/localized-default-grades
