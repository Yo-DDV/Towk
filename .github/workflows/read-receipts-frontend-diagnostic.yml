name: read-receipts merge diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: read-receipts-merge-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feat/read-receipts'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull request merge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Verify merge parents
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          parents="$(git show -s --format=%P HEAD)"
          test "$(wc -w <<< "${parents}")" -eq 2
          case " ${parents} " in
            *" ${current_main} "*) ;;
            *) echo "merge parent missing current main ${current_main}: ${parents}" >&2; exit 11 ;;
          esac
          case " ${parents} " in
            *" ${EXPECTED_HEAD_SHA} "*) ;;
            *) echo "merge parent missing PR head ${EXPECTED_HEAD_SHA}: ${parents}" >&2; exit 12 ;;
          esac
          {
            printf 'merge_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'main_sha=%s\n' "${current_main}"
            printf 'head_sha=%s\n' "${EXPECTED_HEAD_SHA}"
            printf 'parents=%s\n' "${parents}"
          } > "${RUNNER_TEMP}/read-receipts-merge-identity.txt"

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Apply reviewed remediation patch
        id: apply
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_GZIP_SHA256: b417f306713672f4cdce90e3098999fa2b2a20b515896c479cb1856762ba2f27
          PATCH_SHA256: ed06045e6a501fd4a4b47442daf16b3abfbba3138352a9af1b0c2003e764ff9c
          PATCH_PART_SHAS: >-
            e48d04421ffc32f2985bf7bdd46956419db2f4e2
            4e651e6b972f1f12031b7ddad6c638b093dcb250
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/read-receipts-merge-apply.log"
          encoded="${RUNNER_TEMP}/read-receipts-remediation.patch.gz.b64"
          archive="${RUNNER_TEMP}/read-receipts-remediation.patch.gz"
          patch="${RUNNER_TEMP}/read-receipts-remediation.patch"
          exec > >(tee "${log}") 2>&1
          : > "${encoded}"
          for sha in ${PATCH_PART_SHAS}; do
            chunk="${RUNNER_TEMP}/read-receipts-remediation-${sha}.part"
            curl --fail --silent --show-error --location --retry 3 \
              --header "Accept: application/vnd.github.raw+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              > "${chunk}"
            test "$(git hash-object "${chunk}")" = "${sha}"
            cat "${chunk}" >> "${encoded}"
          done
          base64 -d "${encoded}" > "${archive}"
          printf '%s  %s\n' "${PATCH_GZIP_SHA256}" "${archive}" | sha256sum --check --strict
          gzip -dc "${archive}" > "${patch}"
          printf '%s  %s\n' "${PATCH_SHA256}" "${patch}" | sha256sum --check --strict
          git apply --check --verbose "${patch}"
          git apply "${patch}"
          git diff --check
          mise run codegen-proto
          git diff --name-status HEAD > "${RUNNER_TEMP}/read-receipts-merge-files.txt"
          tar -czf "${RUNNER_TEMP}/read-receipts-merge-candidate.tar.gz" -- \
            apps/frontend/messages/de/room.json \
            apps/frontend/messages/en/room.json \
            apps/frontend/messages/es/room.json \
            apps/frontend/messages/fr/room.json \
            apps/frontend/messages/pt/room.json \
            apps/frontend/src/lib/ServerSettings.svelte \
            apps/frontend/src/lib/api-client/readState.ts \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/MessageEvent.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/MessageMetaBar.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/ThreadPane.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/TimelineEventsPane.svelte' \
            'apps/frontend/src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.ts' \
            proto/chatto/api/v1/read_state.proto \
            packages/api-types/src/chatto/api/v1/read_state_pb.ts

      - name: Run Svelte and TypeScript check
        id: svelte
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/frontend run check 2>&1 | tee "${RUNNER_TEMP}/read-receipts-svelte-check.log"

      - name: Run targeted frontend tests
        id: vitest
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/frontend exec vitest --run \
            src/lib/realtimeEventMapper.spec.ts \
            src/lib/api-client-tests/account.spec.ts \
            src/lib/api-client-tests/viewer.spec.ts \
            src/lib/api-client-tests/serverState.spec.ts \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            2>&1 | tee "${RUNNER_TEMP}/read-receipts-vitest.log"

      - name: Run targeted ESLint
        id: eslint
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/frontend exec eslint \
            src/lib/ServerSettings.svelte \
            src/lib/api-client/readState.ts \
            src/lib/api-client/serverState.ts \
            src/lib/api-client/viewer.ts \
            src/lib/eventBus.svelte.ts \
            src/lib/realtimeEventMapper.ts \
            src/lib/state/userSettings.svelte.ts \
            'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
            'src/routes/chat/[serverId]/[roomId]/MessageEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/MessageMetaBar.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
            'src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
            'src/routes/chat/[serverId]/[roomId]/ThreadPane.svelte' \
            'src/routes/chat/[serverId]/[roomId]/TimelineEventsPane.svelte' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.ts' \
            'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
            'src/routes/chat/[serverId]/settings/preferences/+page.svelte' \
            2>&1 | tee "${RUNNER_TEMP}/read-receipts-eslint.log"

      - name: Upload merge diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: towk-read-receipts-merge-diagnostic
          path: |
            ${{ runner.temp }}/read-receipts-merge-identity.txt
            ${{ runner.temp }}/read-receipts-merge-apply.log
            ${{ runner.temp }}/read-receipts-merge-files.txt
            ${{ runner.temp }}/read-receipts-merge-candidate.tar.gz
            ${{ runner.temp }}/read-receipts-svelte-check.log
            ${{ runner.temp }}/read-receipts-vitest.log
            ${{ runner.temp }}/read-receipts-eslint.log
          retention-days: 1
          if-no-files-found: warn

      - name: Require diagnostic completion
        if: always()
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          SVELTE_OUTCOME: ${{ steps.svelte.outcome }}
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
        run: |
          set -euo pipefail
          printf 'apply=%s\nsvelte=%s\nvitest=%s\neslint=%s\n' \
            "${APPLY_OUTCOME}" "${SVELTE_OUTCOME}" "${VITEST_OUTCOME}" "${ESLINT_OUTCOME}"
          test "${APPLY_OUTCOME}" = success
          test "${SVELTE_OUTCOME}" = success
          test "${VITEST_OUTCOME}" = success
          test "${ESLINT_OUTCOME}" = success
