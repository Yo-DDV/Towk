name: materialize profile banner feature

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

concurrency:
  group: profile-banner-materialization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event.pull_request.number == 295 && github.event.pull_request.head.ref == 'feat/profile-surface-redesign' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/profile-surface-redesign
          fetch-depth: 0

      - name: Integrate current main additively
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yo-DDV"
          git config user.email "116607353+Yo-DDV@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit origin/main

      - name: Setup pinned Towk toolchain
        uses: ./.github/actions/setup

      - name: Verify and materialize source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          parts = sorted(Path('.github/profile-banner-source-parts').glob('part-*'))
          expected = [f'part-{index:02d}' for index in range(6)]
          if [part.name for part in parts] != expected:
              raise SystemExit(f'unexpected profile banner source parts: {[part.name for part in parts]}')
          clean = ''.join(part.read_text(encoding='ascii') for part in parts)
          print(f'profile banner source base64={len(clean)} remainder={len(clean) % 4}')
          if len(clean) != 26816:
              raise SystemExit(f'unexpected profile banner base64 length: {len(clean)}')
          archive = base64.b64decode(clean, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != 'c9b03adbbf09c1d063d61f2b2aafd8c9db8a2dd82e27e4a4e7dc23744821b30e':
              raise SystemExit(f'unexpected profile banner archive digest: {digest}')
          Path('.github/profile-banner-source.tar.gz').write_bytes(archive)
          PY
          tar -xzf .github/profile-banner-source.tar.gz
          rm .github/profile-banner-source.tar.gz
          python3 .github/profile-banner-materialize.py
          python3 - <<'PY'
          from pathlib import Path

          surface_path = Path('apps/frontend/src/lib/components/users/UserProfileSurface.svelte')
          surface = surface_path.read_text(encoding='utf-8')
          surface = surface.replace(
              '  let bannerVisible = $state(Boolean(bannerUrl));\n',
              '  let bannerVisible = $derived(Boolean(bannerUrl));\n',
              1,
          )
          surface = surface.replace(
              "\n  $effect(() => {\n    bannerVisible = Boolean(bannerUrl);\n  });\n",
              '',
              1,
          )
          surface_path.write_text(surface, encoding='utf-8')

          editor_path = Path('apps/frontend/src/lib/components/users/ProfileBannerEditor.svelte')
          editor = editor_path.read_text(encoding='utf-8')
          editor = editor.replace(
              '  let currentBannerUrl = $state(bannerUrl);\n',
              '  let currentBannerUrl = $derived(bannerUrl);\n',
              1,
          )
          editor_path.write_text(editor, encoding='utf-8')
          PY
          rm -rf .github/profile-banner-source-parts

      - name: Format source
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            cli/internal/assets/profile_banner.go \
            cli/internal/assets/profile_banner_test.go \
            cli/internal/core/user_profile_banner.go \
            cli/internal/core/user_profile_banner_test.go \
            cli/internal/http_server/profile_banner.go \
            cli/internal/http_server/profile_banner_test.go \
            cli/internal/http_server/assets.go \
            cli/internal/core/users.go
          pnpm --dir apps/frontend exec prettier --write \
            messages/de/profile-banner.json \
            messages/en/profile-banner.json \
            messages/es/profile-banner.json \
            messages/fr/profile-banner.json \
            messages/pt/profile-banner.json \
            src/lib/profileBanner.ts \
            src/lib/profileBanner.spec.ts \
            src/lib/i18n/profileBanner.ts \
            src/lib/i18n/profileBanner.spec.ts \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.svelte \
            src/lib/components/users/ProfileBannerEditor.svelte.spec.ts \
            src/lib/components/users/UserProfileSurface.svelte \
            src/lib/components/users/UserProfileSurface.stories.svelte \
            src/lib/components/users/UserProfileSurface.polish.css \
            src/lib/components/users/UserProfileSurface.polish.spec.ts

      - name: Print generated profile diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '--- polish spec file references ---'
          grep -n -E '\bfile\b' apps/frontend/src/lib/components/users/UserProfileSurface.polish.spec.ts || true
          echo '--- polish spec lines 50-85 ---'
          nl -ba apps/frontend/src/lib/components/users/UserProfileSurface.polish.spec.ts | sed -n '50,85p'
          echo '--- editor state references ---'
          grep -n -E 'currentBannerUrl|bannerUrl' apps/frontend/src/lib/components/users/ProfileBannerEditor.svelte | head -20

      - name: Run focused frontend checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec eslint \
            src/lib/profileBanner.ts \
            src/lib/profileBanner.spec.ts \
            src/lib/i18n/profileBanner.ts \
            src/lib/i18n/profileBanner.spec.ts \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.svelte \
            src/lib/components/users/ProfileBannerEditor.svelte.spec.ts \
            src/lib/components/users/UserProfileSurface.svelte \
            src/lib/components/users/UserProfileSurface.stories.svelte \
            src/lib/components/users/UserProfileSurface.polish.spec.ts
          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec vitest --run --project server \
            src/lib/profileBanner.spec.ts \
            src/lib/i18n/profileBanner.spec.ts \
            src/lib/components/users/UserProfileSurface.polish.spec.ts
          pnpm --dir apps/frontend exec vitest --run --project client \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.svelte.spec.ts

      - name: Run focused Go checks
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -trimpath ./internal/assets ./internal/core ./internal/http_server \
            -run 'ProfileBanner|UserContextMenu' -count=1
          go vet ./internal/assets ./internal/core ./internal/http_server

      - name: Validate diff and commit under maintainer identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/profile-banner-source.b64
          test ! -d .github/profile-banner-source-parts
          test ! -e .github/profile-banner-materialize.py
          git status --short
          git add -A
          git commit -m "feat(profiles): add secure profile banners"
          git push origin HEAD:feat/profile-surface-redesign
