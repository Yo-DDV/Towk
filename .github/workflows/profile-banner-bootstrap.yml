name: materialize profile banner feature

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

concurrency:
  group: profile-banner-materialization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event.pull_request.number == 295 && github.event.pull_request.head.ref == 'feat/profile-surface-redesign' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/profile-surface-redesign
          fetch-depth: 0

      - name: Integrate current main additively
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yo-DDV"
          git config user.email "116607353+Yo-DDV@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit origin/main

      - name: Setup pinned Towk toolchain
        uses: ./.github/actions/setup

      - name: Verify and materialize source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "1af6de9f87ce526c51801a1819a5f869bae998fedb67ec972f8ddf4f8cc0ebb9" ".github/profile-banner-source.tar.gz" > /tmp/profile-banner.sha256
          base64 --decode .github/profile-banner-source.b64 > .github/profile-banner-source.tar.gz
          sha256sum --check /tmp/profile-banner.sha256
          tar -xzf .github/profile-banner-source.tar.gz
          rm .github/profile-banner-source.tar.gz
          python3 .github/profile-banner-materialize.py

      - name: Format source
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            cli/internal/assets/profile_banner.go \
            cli/internal/assets/profile_banner_test.go \
            cli/internal/core/user_profile_banner.go \
            cli/internal/core/user_profile_banner_test.go \
            cli/internal/http_server/profile_banner.go \
            cli/internal/http_server/profile_banner_test.go \
            cli/internal/http_server/assets.go \
            cli/internal/core/users.go
          pnpm --dir apps/frontend exec prettier --write \
            messages/de/profile-banner.json \
            messages/en/profile-banner.json \
            messages/es/profile-banner.json \
            messages/fr/profile-banner.json \
            messages/pt/profile-banner.json \
            src/lib/profileBanner.ts \
            src/lib/profileBanner.spec.ts \
            src/lib/i18n/profileBanner.ts \
            src/lib/i18n/profileBanner.spec.ts \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.svelte \
            src/lib/components/users/ProfileBannerEditor.svelte.spec.ts \
            src/lib/components/users/UserProfileSurface.svelte \
            src/lib/components/users/UserProfileSurface.stories.svelte \
            src/lib/components/users/UserProfileSurface.polish.css \
            src/lib/components/users/UserProfileSurface.polish.spec.ts

      - name: Run focused frontend checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec eslint \
            src/lib/profileBanner.ts \
            src/lib/profileBanner.spec.ts \
            src/lib/i18n/profileBanner.ts \
            src/lib/i18n/profileBanner.spec.ts \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.svelte \
            src/lib/components/users/ProfileBannerEditor.svelte.spec.ts \
            src/lib/components/users/UserProfileSurface.svelte \
            src/lib/components/users/UserProfileSurface.stories.svelte \
            src/lib/components/users/UserProfileSurface.polish.spec.ts
          pnpm --dir apps/frontend run check
          pnpm --dir apps/frontend exec vitest --run --project server \
            src/lib/profileBanner.spec.ts \
            src/lib/i18n/profileBanner.spec.ts \
            src/lib/components/users/UserProfileSurface.polish.spec.ts
          pnpm --dir apps/frontend exec vitest --run --project client \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.svelte.spec.ts

      - name: Run focused Go checks
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -trimpath ./internal/assets ./internal/core ./internal/http_server \
            -run 'ProfileBanner|UserContextMenu' -count=1
          go vet ./internal/assets ./internal/core ./internal/http_server

      - name: Validate diff and commit under maintainer identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/profile-banner-source.b64
          test ! -e .github/profile-banner-materialize.py
          git status --short
          git add -A
          git commit -m "feat(profiles): add secure profile banners"
          git push origin HEAD:feat/profile-surface-redesign
