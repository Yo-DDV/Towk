name: pr312 safe pnpm source diagnosis

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-final-clean
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'chore(ci): record PR 312 diagnostic v14'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Extract pnpm version
        id: version
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          import pathlib
          import re
          import tomllib

          def normalized(value):
              if not isinstance(value, str):
                  return ''
              text = value.strip()
              if text.startswith('pnpm@'):
                  text = text[5:]
              text = text.split('+', 1)[0]
              match = re.search(r'[0-9]+(?:\.[0-9]+){1,2}', text)
              return match.group(0) if match else ''

          version = ''
          for name in ('package.json', 'apps/frontend/package.json'):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              package = json.loads(path.read_text())
              values = [
                  package.get('packageManager'),
                  package.get('engines', {}).get('pnpm'),
                  package.get('devEngines', {}).get('packageManager', {}).get('version')
                  if isinstance(package.get('devEngines', {}).get('packageManager'), dict)
                  else '',
              ]
              for value in values:
                  version = normalized(value)
                  if version:
                      break
              if version:
                  break

          if not version:
              data = tomllib.loads(pathlib.Path('mise.toml').read_text())
              stack = [data]
              while stack and not version:
                  current = stack.pop()
                  if isinstance(current, dict):
                      for key, value in current.items():
                          if 'pnpm' in str(key).lower():
                              if isinstance(value, list):
                                  for item in value:
                                      version = normalized(str(item))
                                      if version:
                                          break
                              else:
                                  version = normalized(str(value))
                          if isinstance(value, (dict, list)):
                              stack.append(value)
                          if version:
                              break
                  elif isinstance(current, list):
                      stack.extend(current)

          if not version:
              for line in pathlib.Path('mise.toml').read_text().splitlines():
                  if 'pnpm' not in line.lower():
                      continue
                  version = normalized(line)
                  if version:
                      break

          print(version)
          PY
          )"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check runtimes
        id: runtimes
        continue-on-error: true
        run: node --version && npm --version && go version

      - name: Install locked pnpm
        id: pnpm_install
        if: steps.version.outcome == 'success' && steps.runtimes.outcome == 'success'
        continue-on-error: true
        run: npm install --global "pnpm@${{ steps.version.outputs.version }}"

      - name: Resolve pnpm
        id: pnpm
        if: steps.pnpm_install.outcome == 'success'
        continue-on-error: true
        run: pnpm --version

      - name: Install locked dependencies
        id: dependencies
        if: steps.pnpm.outcome == 'success'
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Record diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage='V14_SETUP_SUCCESS'
          test '${{ steps.version.outcome }}' = success || stage='V14_VERSION_FAILED'
          if test "${stage}" = V14_SETUP_SUCCESS; then test '${{ steps.runtimes.outcome }}' = success || stage='V14_RUNTIMES_FAILED'; fi
          if test "${stage}" = V14_SETUP_SUCCESS; then test '${{ steps.pnpm_install.outcome }}' = success || stage='V14_PNPM_INSTALL_FAILED'; fi
          if test "${stage}" = V14_SETUP_SUCCESS; then test '${{ steps.pnpm.outcome }}' = success || stage='V14_PNPM_RESOLVE_FAILED'; fi
          if test "${stage}" = V14_SETUP_SUCCESS; then test '${{ steps.dependencies.outcome }}' = success || stage='V14_DEPENDENCIES_FAILED'; fi
          rm -rf .github/pr312-diag
          mkdir -p .github/pr312-diag
          : > ".github/pr312-diag/${stage}"
          git add .github/pr312-diag
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'chore(ci): record PR 312 diagnostic v14'
          git push origin HEAD:feat/localized-default-grades
