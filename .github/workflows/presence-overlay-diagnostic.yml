name: presence overlay diagnostic

on:
  push:
    branches:
      - feat/pwa-presence-leases

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify fragment identity
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/presence-source/hardened-[0-9][0-9].txt
          sha256sum .github/presence-source/hardened-[0-9][0-9].txt
          cat .github/presence-source/hardened-[0-9][0-9].txt | base64 -d > /tmp/overlay.tar.gz
          sha256sum /tmp/overlay.tar.gz
          tar -tzf /tmp/overlay.tar.gz
