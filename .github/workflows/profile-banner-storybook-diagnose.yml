name: isolate profile banner Storybook failure

on:
  pull_request:
    types: [synchronize]
    branches: [main]

concurrency:
  group: profile-banner-storybook-diagnose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnose:
    if: ${{ github.repository == 'Yo-DDV/Towk' && github.event.pull_request.number == 295 && github.event.pull_request.head.ref == 'feat/profile-surface-redesign' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      GIT_AUTHOR_NAME: Yo-DDV
      GIT_AUTHOR_EMAIL: 116607353+Yo-DDV@users.noreply.github.com
      GIT_COMMITTER_NAME: Yo-DDV
      GIT_COMMITTER_EMAIL: 116607353+Yo-DDV@users.noreply.github.com

    steps:
      - name: Checkout and merge current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/profile-surface-redesign
          fetch-depth: 0

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge --no-edit origin/main

      - name: Setup pinned Towk toolchain
        uses: ./.github/actions/setup

      - name: Materialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mise codegen-proto >/tmp/codegen.log 2>&1
          mise build-api-types >>/tmp/codegen.log 2>&1
          python3 .github/pr295-direct-hardening.py >/tmp/materialize.log 2>&1
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/frontend/src/lib/components/users/ProfileBannerEditor.svelte.spec.ts')
          content = path.read_text(encoding='utf-8')
          old = """    const first = new File(['first'], 'first.png', { type: 'image/png' });
              const second = new File(['second'], 'second.png', { type: 'image/png' });
              mocks.inspect.mockImplementation((file: File) =>
          """
          new = """    const first = new File(['first'], 'first.png', { type: 'image/png' });
              const second = new File(['second'], 'second.png', { type: 'image/png' });
              const createObjectURL = vi.mocked(URL.createObjectURL);
              createObjectURL.mockClear();
              mocks.inspect.mockImplementation((file: File) =>
          """
          if content.count(old) != 1:
              raise SystemExit('race test setup anchor not found exactly once')
          content = content.replace(old, new, 1)
          old = """    await vi.waitFor(() => expect(URL.createObjectURL).toHaveBeenCalledWith(second));
              resolveFirst({ width: 1536, height: 512 });
              await Promise.resolve();

              expect(URL.createObjectURL).not.toHaveBeenCalledWith(first);
          """
          new = """    await vi.waitFor(() => expect(createObjectURL).toHaveBeenCalledTimes(1));
              expect(createObjectURL.mock.calls[0]?.[0]).toBe(second);
              resolveFirst({ width: 1536, height: 512 });
              await Promise.resolve();
              expect(createObjectURL).toHaveBeenCalledTimes(1);
          """
          if content.count(old) != 1:
              raise SystemExit('race test assertion anchor not found exactly once')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
          pnpm --dir apps/frontend exec prettier --write \
            messages/{de,en,es,fr,pt}/profile-banner.json \
            src/lib/profileBanner.ts src/lib/profileBanner.spec.ts \
            src/lib/i18n/profileBanner.ts src/lib/i18n/profileBanner.spec.ts \
            src/lib/components/menus/UserContextMenu.svelte \
            src/lib/components/menus/UserContextMenu.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.svelte \
            src/lib/components/users/ProfileBannerEditor.svelte.spec.ts \
            src/lib/components/users/ProfileBannerEditor.stories.svelte \
            src/lib/components/users/UserProfileSurface.svelte \
            src/lib/components/users/UserProfileSurface.stories.svelte \
            src/lib/components/users/UserProfileSurface.polish.css \
            src/lib/components/users/UserProfileSurface.polish.spec.ts >/tmp/prettier.log 2>&1

      - name: Print isolated Storybook build failure
        shell: bash
        run: |
          set +e
          pnpm --dir apps/frontend run build-storybook >/tmp/storybook-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "STORYBOOK_BUILD_EXIT=$status"
            echo '--- relevant diagnostics ---'
            grep -nE '(^| )Error|ERROR|failed|Failed|Cannot|Unexpected|SyntaxError|TypeError|ReferenceError|RollupError|Svelte' /tmp/storybook-build.log | tail -n 120 || true
            echo '--- final 240 lines ---'
            tail -n 240 /tmp/storybook-build.log
            exit "$status"
          fi
          echo 'STORYBOOK_BUILD_PASS=true'
