name: presence product materializer

on:
  push:
    branches:
      - feat/pwa-presence-leases

concurrency:
  group: presence-product-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Materialize candidate on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git -c user.name='Yo-DDV' \
              -c user.email='116607353+Yo-DDV@users.noreply.github.com' \
              merge --no-edit origin/main

          cat .github/presence-source/chunk-*.txt | base64 -d > /tmp/presence-source.tar.gz
          tar -xzf /tmp/presence-source.tar.gz -C .

          cat .github/presence-source/hardened-[0-9][0-9].txt | base64 -d > /tmp/presence-hardened-overlay.tar.gz
          test "$(sha256sum /tmp/presence-hardened-overlay.tar.gz | cut -d' ' -f1)" = f95fae79f6e4f271187c89a655bc907e8935cfe38d80ba3e62b2dd543e16542e
          tar -xzf /tmp/presence-hardened-overlay.tar.gz -C .

          cat .github/presence-source/hardening2-[0-9][0-9].txt | base64 -d > /tmp/presence-ordering-overlay.tar.gz
          test "$(sha256sum /tmp/presence-ordering-overlay.tar.gz | cut -d' ' -f1)" = 8ee913b0d1565b0efddc07b791b59b61d98e3eed317d0babf82935711f5cb7df
          tar -xzf /tmp/presence-ordering-overlay.tar.gz -C .

          gofmt -w \
            cli/internal/core/presence.go \
            cli/internal/core/presence_model.go \
            cli/internal/core/presence_session.go \
            cli/internal/core/presence_session_hub.go \
            cli/internal/core/presence_session_test.go \
            cli/internal/connectapi/presence.go \
            cli/internal/connectapi/presence_session_test.go

          rm -rf .github/presence-source
          rm -f .github/workflows/presence-candidate.yml
          rm -f .github/workflows/presence-publish-candidate.yml
          git diff --check

      - name: Setup repository toolchain
        uses: ./.github/actions/setup

      - name: Generate deterministic bindings
        shell: bash
        run: |
          set -euo pipefail
          mise codegen-proto
          pnpm --dir packages/api-types run build

      - name: Publish clean product branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary origin/main > /tmp/presence-product.patch
          test -s /tmp/presence-product.patch

          if git diff --name-only origin/main | grep -E '^\.github/(presence-source/|workflows/presence-(candidate|publish-candidate)\.yml$)'; then
            echo 'temporary transfer surface leaked into product diff' >&2
            exit 1
          fi
          if git diff origin/main | grep -Ei 'Co-authored-by:|Generated-by:|Assisted-by:|Pair-programmed-by:'; then
            echo 'forbidden authorship trailer found' >&2
            exit 1
          fi

          git worktree add /tmp/presence-product origin/main
          cd /tmp/presence-product
          git switch -c feat/resilient-pwa-presence
          git apply --index --whitespace=error /tmp/presence-product.patch
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

          if git ls-files | grep -E '^\.github/(presence-source/|workflows/presence-(candidate|publish-candidate)\.yml$)'; then
            echo 'temporary transfer surface exists in product tree' >&2
            exit 1
          fi

          git -c user.name='Yo-DDV' \
              -c user.email='116607353+Yo-DDV@users.noreply.github.com' \
              commit -m 'feat(presence): add resilient PWA presence leases'
          git push origin HEAD:refs/heads/feat/resilient-pwa-presence
