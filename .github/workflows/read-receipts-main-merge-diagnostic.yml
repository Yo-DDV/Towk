name: read-receipts main merge diagnostic

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-main-merge-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr173-merge-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Inspect additive merge with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'

          feature_head="$(git rev-parse HEAD)"
          main_head="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "${feature_head}" "${main_head}")"
          report=".github/read-receipts-main-merge-diagnostic.txt"
          merge_stdout="${RUNNER_TEMP}/read-receipts-merge.stdout"
          merge_stderr="${RUNNER_TEMP}/read-receipts-merge.stderr"

          set +e
          git merge --no-commit --no-ff origin/main > "${merge_stdout}" 2> "${merge_stderr}"
          merge_status=$?
          set -e

          {
            printf 'feature_head=%s\n' "${feature_head}"
            printf 'main_head=%s\n' "${main_head}"
            printf 'merge_base=%s\n' "${merge_base}"
            printf 'merge_status=%s\n' "${merge_status}"
            printf '%s\n' '--- merge stdout ---'
            cat "${merge_stdout}" || true
            printf '%s\n' '--- merge stderr ---'
            cat "${merge_stderr}" || true
            printf '%s\n' '--- unmerged index entries: mode blob stage path ---'
            git ls-files -u || true
            printf '%s\n' '--- conflict paths ---'
            git diff --name-only --diff-filter=U || true
          } > "${RUNNER_TEMP}/read-receipts-main-merge-diagnostic.txt"

          git merge --abort 2>/dev/null || true
          cp "${RUNNER_TEMP}/read-receipts-main-merge-diagnostic.txt" "${report}"

          git add "${report}"
          git diff --cached --check
          git commit -m 'chore(ci): record additive main merge diagnostic [skip pr173-merge-diagnostic]'
          git push origin HEAD:feat/read-receipts
