name: avatar framing bootstrap validation

on:
  push:
    branches:
      - feat/avatar-framing
  pull_request:
    branches:
      - main

concurrency:
  group: avatar-framing-bootstrap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'chore(ci): stage avatar framing validation') ||
      (github.event_name == 'pull_request' && github.head_ref == 'feat/avatar-framing')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/avatar-framing
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize prepared source tree when needed
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.github/avatar-framing-source/part-*' >/dev/null; then
            cat .github/avatar-framing-source/part-* | base64 --decode | tar -xz
            rm -r .github/avatar-framing-source
          else
            echo 'Prepared source is already materialized on this head.'
          fi
          git status --short

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Install Chromium dependencies
        run: cd apps/frontend && pnpm exec playwright install chromium --with-deps
        timeout-minutes: 15

      - name: Format prepared sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/frontend exec prettier --write \
            messages/de/avatar-framing.json \
            messages/en/avatar-framing.json \
            messages/es/avatar-framing.json \
            messages/fr/avatar-framing.json \
            messages/pt/avatar-framing.json \
            src/app.d.ts \
            src/lib/api-client-tests/avatarUploadHeaders.spec.ts \
            src/lib/api-client/account.ts \
            src/lib/avatarFraming.spec.ts \
            src/lib/avatarFraming.ts \
            src/lib/components/settings/AvatarFramingDialog.svelte \
            src/lib/components/settings/AvatarFramingDialog.svelte.spec.ts \
            src/lib/i18n/avatarFraming.spec.ts \
            src/lib/i18n/avatarFraming.ts \
            'src/routes/chat/[serverId]/settings/+page.svelte' \
            ../../docs/fdr/FDR-022-user-profile.md \
            ../../docs/fdr/INDEX.md
          gofmt -w \
            cli/internal/assets/avatar.go \
            cli/internal/assets/avatar_framing.go \
            cli/internal/assets/avatar_framing_test.go \
            cli/internal/connectapi/account.go \
            cli/internal/connectapi/avatar_framing.go \
            cli/internal/connectapi/avatar_framing_test.go \
            cli/internal/connectapi/server.go \
            cli/internal/connectapi/server_capabilities_test.go \
            cli/internal/core/user_avatar_media.go \
            cli/internal/http_server/cors.go \
            cli/internal/http_server/cors_avatar_framing_test.go

      - name: Frontend typecheck and localization audit
        run: pnpm run check:frontend

      - name: Targeted frontend lint
        run: |
          pnpm --dir apps/frontend exec eslint \
            src/app.d.ts \
            src/lib/api-client-tests/avatarUploadHeaders.spec.ts \
            src/lib/api-client/account.ts \
            src/lib/avatarFraming.spec.ts \
            src/lib/avatarFraming.ts \
            src/lib/components/settings/AvatarFramingDialog.svelte \
            src/lib/components/settings/AvatarFramingDialog.svelte.spec.ts \
            src/lib/i18n/avatarFraming.spec.ts \
            src/lib/i18n/avatarFraming.ts \
            'src/routes/chat/[serverId]/settings/+page.svelte'

      - name: Avatar framing unit tests
        run: |
          pnpm --filter towk-frontend exec vitest --run \
            src/lib/avatarFraming.spec.ts \
            src/lib/api-client-tests/avatarUploadHeaders.spec.ts \
            src/lib/i18n/avatarFraming.spec.ts

      - name: Avatar framing browser component tests
        run: |
          pnpm --filter towk-frontend exec vitest --run --project client \
            src/lib/components/settings/AvatarFramingDialog.svelte.spec.ts

      - name: Frontend production build
        run: pnpm run build:frontend

      - name: Targeted Go tests, vet, and race
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go test -trimpath -p 1 ./internal/assets ./internal/connectapi ./internal/core ./internal/http_server
          go vet ./internal/assets ./internal/connectapi ./internal/core ./internal/http_server
          go test -race -trimpath -p 1 ./internal/assets ./internal/connectapi ./internal/http_server

      - name: Repository guards
        shell: bash
        run: |
          set -euo pipefail
          mise license-check
          mise public-surface-check
          git diff --check f6e10b0b7143d22f983d1ba38c58b73f76330adf

      - name: Commit validated source under maintainer identity
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'Validated head is already formatted and committed.'
            exit 0
          fi
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' \
            commit -m 'feat(profiles): add responsive avatar framing'
          git push origin HEAD:feat/avatar-framing
