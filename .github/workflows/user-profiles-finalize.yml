name: publish user profiles candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/profile-patch/READY
      - .github/workflows/user-profiles-finalize.yml

permissions:
  contents: write

concurrency:
  group: user-profiles-publish-candidate
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/user-profiles
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize reviewed source delta
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/profile-patch/00-00.b64 \
            .github/profile-patch/00-01.b64 \
            .github/profile-patch/00-02.b64 \
            .github/profile-patch/00-03.b64 \
            .github/profile-patch/00-04.b64 \
            .github/profile-patch/00-05.b64 \
            .github/profile-patch/01.b64 \
            .github/profile-patch/02.b64 \
            .github/profile-patch/03.b64 \
            > "${RUNNER_TEMP}/user-profiles.patch.xz.b64"
          test "$(wc -c < "${RUNNER_TEMP}/user-profiles.patch.xz.b64")" -eq 42920
          printf '%s  %s\n' \
            '55d558580bed45de9a72887f4318ebb02359a4bad9bb2ceec134b7a5039b1466' \
            "${RUNNER_TEMP}/user-profiles.patch.xz.b64" | sha256sum --check --strict
          base64 --decode "${RUNNER_TEMP}/user-profiles.patch.xz.b64" > "${RUNNER_TEMP}/user-profiles.patch.xz"
          printf '%s  %s\n' \
            '31dda5fa47eb305b5d60bd66a15c2be402c1516db694076f377e73f8763eae84' \
            "${RUNNER_TEMP}/user-profiles.patch.xz" | sha256sum --check --strict
          xz --test "${RUNNER_TEMP}/user-profiles.patch.xz"
          xz --decompress --stdout "${RUNNER_TEMP}/user-profiles.patch.xz" > "${RUNNER_TEMP}/user-profiles.patch"
          printf '%s  %s\n' \
            'b66e764c82af0910ee6a880b3436f950bffa45ff522bab50cafa01d5daaf1af0' \
            "${RUNNER_TEMP}/user-profiles.patch" | sha256sum --check --strict
          git apply --check "${RUNNER_TEMP}/user-profiles.patch"
          git apply --index "${RUNNER_TEMP}/user-profiles.patch"

      - name: Remove temporary publication files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/profile-patch
          rm -f .github/workflows/user-profiles-chunk-export.yml
          rm -f .github/workflows/user-profiles-finalize.yml
          rm -f .github/workflows/user-profiles-recovery.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          ! git ls-files | grep -E '^\.github/(profile-patch/|workflows/user-profiles-(chunk-export|finalize|recovery)\.yml$)'
          ! git diff --cached | grep -Ei '(^|[[:space:]])(Co-authored-by|Generated-by|Assisted-by):'

      - name: Commit completed profile system
        shell: bash
        run: |
          set -euo pipefail
          author_name=$(git show -s --format=%an HEAD)
          author_email=$(git show -s --format=%ae HEAD)
          test -n "$author_name"
          test -n "$author_email"
          GIT_AUTHOR_NAME="$author_name" GIT_AUTHOR_EMAIL="$author_email" \
          GIT_COMMITTER_NAME="$author_name" GIT_COMMITTER_EMAIL="$author_email" \
            git commit -m 'feat(profiles): complete responsive user profiles'
          git push origin HEAD:feat/user-profiles
