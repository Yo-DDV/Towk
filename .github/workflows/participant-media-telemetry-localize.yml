name: Participant media telemetry localization

on:
  pull_request:
    branches:
      - main

concurrency:
  group: participant-media-telemetry-localization
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  localize:
    if: github.event.pull_request.head.ref == 'feat/participant-media-telemetry'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEMETRY_BRANCH: feat/participant-media-telemetry
      GIT_AUTHOR_NAME: Yo-DDV
      GIT_AUTHOR_EMAIL: 116607353+Yo-DDV@users.noreply.github.com
      GIT_COMMITTER_NAME: Yo-DDV
      GIT_COMMITTER_EMAIL: 116607353+Yo-DDV@users.noreply.github.com
    steps:
      - name: Checkout telemetry branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/participant-media-telemetry
          fetch-depth: 0

      - name: Setup frontend toolchain
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"

      - name: Build generated API types
        run: pnpm --filter @towk/api-types build

      - name: Install Chromium for browser component tests
        run: pnpm --dir apps/frontend exec playwright install chromium

      - name: Apply localized telemetry labels
        shell: bash
        run: |
          set -euo pipefail
          echo "BOOTSTRAP_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 -m py_compile tools/telemetry-localize.py
          python3 tools/telemetry-localize.py
          rm -f \
            tools/telemetry-localize.py \
            .github/workflows/participant-media-telemetry-localize.yml

      - name: Format localized product files
        shell: bash
        run: |
          set -euo pipefail
          pushd apps/frontend >/dev/null
          pnpm exec prettier --write \
            src/lib/components/voice/ParticipantMediaTelemetryPanel.svelte \
            messages/en/voice.json \
            messages/fr/voice.json \
            messages/de/voice.json \
            messages/es/voice.json \
            messages/pt/voice.json
          popd >/dev/null
          git diff --check

      - name: Generate and audit localization
        run: pnpm --dir apps/frontend run paraglide

      - name: Lint localized telemetry panel
        run: |
          pnpm --dir apps/frontend exec eslint \
            src/lib/components/voice/ParticipantMediaTelemetryPanel.svelte

      - name: Test telemetry product and call integration
        run: |
          pnpm --dir apps/frontend exec vitest run \
            src/lib/voice/participantMediaTelemetry.spec.ts \
            src/lib/components/voice/ParticipantMediaTelemetryPanel.svelte.spec.ts \
            src/lib/state/server/voiceCall.svelte.spec.ts \
            src/lib/components/voice/VoiceCallPanel.svelte.spec.ts

      - name: Check telemetry types and locales
        run: pnpm --dir apps/frontend run check

      - name: Build telemetry frontend
        run: pnpm --dir apps/frontend run build

      - name: Verify public surface and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          node tools/check-public-surface.mjs
          test ! -e .github/workflows/participant-media-telemetry-localize.yml
          test ! -e tools/telemetry-localize.py

      - name: Publish clean localized head
        shell: bash
        run: |
          set -euo pipefail
          tree="$(git write-tree)"
          commit="$(
            printf '%s\n' 'fix(calls): localize telemetry status labels' \
              | git commit-tree "$tree" -p "$BOOTSTRAP_HEAD"
          )"
          git push origin "$commit:refs/heads/$TELEMETRY_BRANCH"
