name: pr312 canonical pnpm stage diagnosis

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-final-clean
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'chore(ci): record PR 312 diagnostic v18'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Extract canonical pnpm channel
        id: version
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -i 'pnpm' mise.toml | grep -Eo '[0-9]+(\.[0-9]+){0,2}' | head -n 1 || true)"
          if test -z "${version}"; then
            version="$(grep -i 'pnpm' .github/actions/setup/action.yml | grep -Eo '[0-9]+(\.[0-9]+){0,2}' | head -n 1 || true)"
          fi
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install pnpm package
        id: pnpm_install
        if: steps.version.outcome == 'success'
        continue-on-error: true
        run: npm install --global "pnpm@${{ steps.version.outputs.version }}"

      - name: Resolve pnpm executable
        id: pnpm
        if: steps.pnpm_install.outcome == 'success'
        continue-on-error: true
        run: pnpm --version

      - name: Install locked dependencies
        id: dependencies
        if: steps.pnpm.outcome == 'success'
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Record diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage='V18_SETUP_SUCCESS'
          test '${{ steps.version.outcome }}' = success || stage='V18_VERSION_FAILED'
          if test "${stage}" = V18_SETUP_SUCCESS; then test '${{ steps.pnpm_install.outcome }}' = success || stage='V18_PNPM_INSTALL_FAILED'; fi
          if test "${stage}" = V18_SETUP_SUCCESS; then test '${{ steps.pnpm.outcome }}' = success || stage='V18_PNPM_RESOLVE_FAILED'; fi
          if test "${stage}" = V18_SETUP_SUCCESS; then test '${{ steps.dependencies.outcome }}' = success || stage='V18_DEPENDENCIES_FAILED'; fi
          rm -rf .github/pr312-diag
          mkdir -p .github/pr312-diag
          : > ".github/pr312-diag/${stage}"
          git add .github/pr312-diag
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'chore(ci): record PR 312 diagnostic v18'
          git push origin HEAD:feat/localized-default-grades
