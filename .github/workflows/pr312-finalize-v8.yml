name: pr312 toolchain diagnosis

on:
  push:
    branches:
      - feat/localized-default-grades

concurrency:
  group: pr312-final-clean
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'chore(ci): record PR 312 diagnostic v8'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/localized-default-grades
          fetch-depth: 0

      - name: Check Node
        id: node
        continue-on-error: true
        run: node --version

      - name: Check Go
        id: go
        continue-on-error: true
        run: go version

      - name: Locate Corepack
        id: corepack
        continue-on-error: true
        run: command -v corepack

      - name: Enable Corepack
        id: corepack_enable
        if: steps.corepack.outcome == 'success'
        continue-on-error: true
        run: corepack enable

      - name: Resolve pnpm
        id: pnpm
        if: steps.corepack_enable.outcome == 'success'
        continue-on-error: true
        run: pnpm --version

      - name: Install locked dependencies
        id: install
        if: steps.pnpm.outcome == 'success'
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Record diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage='V8_SETUP_SUCCESS'
          test '${{ steps.node.outcome }}' = success || stage='V8_NODE_FAILED'
          if test "${stage}" = V8_SETUP_SUCCESS; then test '${{ steps.go.outcome }}' = success || stage='V8_GO_FAILED'; fi
          if test "${stage}" = V8_SETUP_SUCCESS; then test '${{ steps.corepack.outcome }}' = success || stage='V8_COREPACK_MISSING'; fi
          if test "${stage}" = V8_SETUP_SUCCESS; then test '${{ steps.corepack_enable.outcome }}' = success || stage='V8_COREPACK_ENABLE_FAILED'; fi
          if test "${stage}" = V8_SETUP_SUCCESS; then test '${{ steps.pnpm.outcome }}' = success || stage='V8_PNPM_FAILED'; fi
          if test "${stage}" = V8_SETUP_SUCCESS; then test '${{ steps.install.outcome }}' = success || stage='V8_INSTALL_FAILED'; fi
          rm -rf .github/pr312-diag
          mkdir -p .github/pr312-diag
          : > ".github/pr312-diag/${stage}"
          git add .github/pr312-diag
          git -c user.name='Yo-DDV' -c user.email='116607353+Yo-DDV@users.noreply.github.com' commit -m 'chore(ci): record PR 312 diagnostic v8'
          git push origin HEAD:feat/localized-default-grades
