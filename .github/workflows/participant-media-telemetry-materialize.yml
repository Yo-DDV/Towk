name: Participant media telemetry state diagnostic

on:
  pull_request:
    branches:
      - main

concurrency:
  group: participant-media-telemetry-materialization
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose-state:
    if: github.event.pull_request.head.ref == 'feat/participant-media-telemetry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/participant-media-telemetry
          fetch-depth: 0

      - name: Materialize telemetry tree
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.telemetry-materializer/part-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/materialize-telemetry.py
          test "$(sha256sum /tmp/materialize-telemetry.py | cut -d' ' -f1)" = "bd7d51398518cdee9c235d5236611ff573c1235a63077d921ff4f6d9ac67a472"
          git fetch --no-tags origin fix/cross-browser-noise-suppression
          git checkout --detach origin/fix/cross-browser-noise-suppression
          cp /tmp/materialize-telemetry.py tools/materialize-participant-media-telemetry.py
          python3 tools/materialize-participant-media-telemetry.py

      - name: Print telemetry state surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== participant telemetry fields ==='
          grep -n -C 4 -E 'reception|Reception|mediaTelemetry|MediaTelemetry|networkHealth|packetLossPercent|jitterMs|latencyMs' \
            apps/frontend/src/lib/state/server/voiceCall.svelte.ts \
            | head -n 700
          echo '=== legacy quality test block ==='
          sed -n '5200,5555p' apps/frontend/src/lib/state/server/voiceCall.svelte.spec.ts
          exit 1
