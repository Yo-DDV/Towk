name: Participant media telemetry panel diagnostic

on:
  pull_request:
    branches:
      - main

concurrency:
  group: participant-media-telemetry-materialization
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose-panel:
    if: github.event.pull_request.head.ref == 'feat/participant-media-telemetry'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/participant-media-telemetry
          fetch-depth: 0

      - name: Setup frontend toolchain
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"

      - name: Build generated API types
        run: pnpm --filter @towk/api-types build

      - name: Install Chromium
        run: pnpm --dir apps/frontend exec playwright install chromium

      - name: Materialize telemetry tree
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.telemetry-materializer/part-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/materialize-telemetry.py
          test "$(sha256sum /tmp/materialize-telemetry.py | cut -d' ' -f1)" = "bd7d51398518cdee9c235d5236611ff573c1235a63077d921ff4f6d9ac67a472"
          git fetch --no-tags origin fix/cross-browser-noise-suppression
          git checkout --detach origin/fix/cross-browser-noise-suppression
          cp /tmp/materialize-telemetry.py tools/materialize-participant-media-telemetry.py
          python3 tools/materialize-participant-media-telemetry.py
          pnpm --dir apps/frontend exec prettier --write \
            src/lib/components/voice/ParticipantMediaTelemetryPanel.svelte \
            src/lib/components/voice/ParticipantMediaTelemetryPanel.svelte.spec.ts \
            src/lib/voice/participantMediaTelemetry.ts

      - name: Diagnose telemetry detail panel
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 180s \
            pnpm --dir apps/frontend exec vitest run \
              src/lib/components/voice/ParticipantMediaTelemetryPanel.svelte.spec.ts \
            > /tmp/panel-test.log 2>&1
          rc=$?
          echo "vitest exit code: $rc"
          tail -n 220 /tmp/panel-test.log
          {
            echo '## Participant telemetry panel test'
            echo '```text'
            echo "vitest exit code: $rc"
            tail -n 160 /tmp/panel-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
