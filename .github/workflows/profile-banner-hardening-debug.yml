name: diagnose profile banner hardening

on:
  pull_request:
    types: [synchronize]
    branches: [main]

concurrency:
  group: profile-banner-hardening-debug-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnose:
    if: ${{ github.repository == 'Yo-DDV/Towk' && github.event.pull_request.number == 295 && github.event.pull_request.head.ref == 'feat/profile-surface-redesign' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_AUTHOR_NAME: Yo-DDV
      GIT_AUTHOR_EMAIL: 116607353+Yo-DDV@users.noreply.github.com
      GIT_COMMITTER_NAME: Yo-DDV
      GIT_COMMITTER_EMAIL: 116607353+Yo-DDV@users.noreply.github.com
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/profile-surface-redesign
          fetch-depth: 0

      - name: Inspect recovered payload without executing it
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge --no-edit origin/main
          cat .github/profile-banner-hardening-parts/part-* > /tmp/profile-banner-hardening.py.gz.b64
          base64 -d /tmp/profile-banner-hardening.py.gz.b64 > /tmp/profile-banner-hardening.py.gz
          set +e
          gzip -dc /tmp/profile-banner-hardening.py.gz > /tmp/profile-banner-hardening.py
          gzip_status=$?
          set -e
          echo "GZIP_EXIT=$gzip_status"
          wc -c /tmp/profile-banner-hardening.py
          sha256sum /tmp/profile-banner-hardening.py
          python3 -m py_compile /tmp/profile-banner-hardening.py
          echo '--- imports and file operations ---'
          grep -nE '^(from |import )|Path\(|write_text|read_text|replace\(|unlink|rmdir|subprocess|os\.' /tmp/profile-banner-hardening.py || true
          echo '--- beginning ---'
          sed -n '1,100p' /tmp/profile-banner-hardening.py
          echo '--- ending ---'
          tail -n 100 /tmp/profile-banner-hardening.py
