name: read-receipts patch trace

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-patch-trace
  cancel-in-progress: true

jobs:
  trace:
    if: ${{ !contains(github.event.head_commit.message, '[skip read-receipts-patch-trace]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Trace corrected patch and frontend gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          script="${RUNNER_TEMP}/read-receipts-patch-step.sh"
          report="${RUNNER_TEMP}/read-receipts-frontend-trace.txt"
          patch_log="${RUNNER_TEMP}/patch.log"
          codegen_log="${RUNNER_TEMP}/codegen.log"
          api_log="${RUNNER_TEMP}/api.log"
          check_log="${RUNNER_TEMP}/check.log"
          vitest_log="${RUNNER_TEMP}/vitest.log"
          eslint_log="${RUNNER_TEMP}/eslint.log"

          python3 - "${script}" <<'PY'
          from pathlib import Path
          import sys

          workflow = Path('.github/workflows/read-receipts-realtime-privacy-finalizer-v2.yml')
          text = workflow.read_text(encoding='utf-8')
          step = text.index('      - name: Apply anonymous realtime invalidation contract\n')
          start = text.index('        run: |\n', step) + len('        run: |\n')
          end = text.index('\n      - name: Regenerate protobuf bindings and API documentation\n', start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old_buf = '(cd proto && mise x -- buf format -w chatto/core/v1/live_events.proto chatto/realtime/v1/realtime.proto)'
          new_buf = '''(cd proto && mise x -- buf format -w chatto/core/v1/live_events.proto)
          (cd proto && mise x -- buf format -w chatto/realtime/v1/realtime.proto)'''
          script = script.replace(old_buf, new_buf, 1)

          slash = chr(92)
          old_docs = '\n'.join([
              f'pnpm exec prettier --write {slash}',
              f'  docs/fdr/FDR-031-read-receipts.md {slash}',
              '  docs/adr/ADR-054-read-receipt-publication-boundary.md',
          ])
          new_docs = '\n'.join([
              f'pnpm --dir apps/frontend exec prettier --write {slash}',
              f'  ../../docs/fdr/FDR-031-read-receipts.md {slash}',
              '  ../../docs/adr/ADR-054-read-receipt-publication-boundary.md',
          ])
          if script.count(old_docs) != 1:
              raise SystemExit(f'expected one root prettier command, got {script.count(old_docs)}')
          Path(sys.argv[1]).write_text(script.replace(old_docs, new_docs, 1), encoding='utf-8')
          PY

          run_capture() {
            local log="$1"
            shift
            set +e
            "$@" >"${log}" 2>&1
            local status=$?
            set -e
            printf '%s' "${status}"
          }

          patch_status="$(run_capture "${patch_log}" bash "${script}")"
          codegen_status=125
          api_status=125
          check_status=125
          vitest_status=125
          eslint_status=125

          if test "${patch_status}" -eq 0; then
            codegen_status="$(run_capture "${codegen_log}" mise run codegen-proto)"
          fi
          if test "${codegen_status}" -eq 0; then
            api_status="$(run_capture "${api_log}" pnpm --filter @towk/api-types build)"
          fi
          if test "${api_status}" -eq 0; then
            check_status="$(run_capture "${check_log}" pnpm --dir apps/frontend run check)"
            vitest_status="$(run_capture "${vitest_log}" pnpm --dir apps/frontend exec vitest --run \
              src/lib/realtimeEventMapper.spec.ts \
              src/lib/api-client-tests/account.spec.ts \
              src/lib/api-client-tests/viewer.spec.ts \
              src/lib/api-client-tests/serverState.spec.ts \
              'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
              'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts' \
              'src/routes/chat/[serverId]/[roomId]/readReceiptVisibility.spec.ts' \
              'src/routes/chat/[serverId]/settings/preferences/readReceiptPreference.server.spec.ts')"
            eslint_status="$(run_capture "${eslint_log}" pnpm --dir apps/frontend exec eslint \
              src/lib/api-client/renderTypes.ts \
              src/lib/eventBus.svelte.ts \
              src/lib/realtimeEventMapper.ts \
              src/lib/realtimeEventMapper.spec.ts \
              'src/routes/chat/[serverId]/[roomId]/EventList.svelte' \
              'src/routes/chat/[serverId]/[roomId]/RoomEvent.svelte' \
              'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte' \
              'src/routes/chat/[serverId]/[roomId]/ReadReceiptBadge.svelte.spec.ts' \
              'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.ts' \
              'src/routes/chat/[serverId]/[roomId]/readReceiptPresentation.spec.ts')"
          fi

          {
            printf 'source_head=%s\n' "${GITHUB_SHA}"
            printf 'patch=%s\ncodegen=%s\napi=%s\ncheck=%s\nvitest=%s\neslint=%s\n' \
              "${patch_status}" "${codegen_status}" "${api_status}" "${check_status}" "${vitest_status}" "${eslint_status}"
            for entry in \
              "patch:${patch_log}" \
              "codegen:${codegen_log}" \
              "api:${api_log}" \
              "check:${check_log}" \
              "vitest:${vitest_log}" \
              "eslint:${eslint_log}"; do
              name="${entry%%:*}"
              file="${entry#*:}"
              printf '\n--- %s tail ---\n' "${name}"
              tail -n 100 "${file}" 2>/dev/null || true
            done
          } | sed -E \
              -e 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1***/g' \
              -e 's/(GH_TOKEN=).*/\1***/g' \
              -e 's/[[:cntrl:]]//g' > "${report}"

          encoded="$(base64 -w0 "${report}")"
          payload="$(jq -n \
            --arg message 'chore(ci): record read receipt frontend trace [skip read-receipts-privacy-v2] [skip read-receipts-privacy-executor] [skip read-receipts-command-fixer] [skip read-receipts-patch-trace]' \
            --arg content "${encoded}" \
            --arg branch 'feat/read-receipts' \
            '{message:$message,content:$content,branch:$branch}')"
          curl --fail --silent --show-error --location --retry 3 \
            --request PUT \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/read-receipts-frontend-trace.txt" \
            >/dev/null

          test "${patch_status}" -eq 0
          test "${codegen_status}" -eq 0
          test "${api_status}" -eq 0
          test "${check_status}" -eq 0
          test "${vitest_status}" -eq 0
          test "${eslint_status}" -eq 0
