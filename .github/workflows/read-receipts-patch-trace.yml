name: read-receipts patch trace

on:
  push:
    branches:
      - feat/read-receipts

permissions:
  contents: write

concurrency:
  group: read-receipts-patch-trace
  cancel-in-progress: true

jobs:
  trace:
    if: ${{ !contains(github.event.head_commit.message, '[skip read-receipts-patch-trace]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Execute fully corrected extracted patch step with trace
        id: trace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          script="${RUNNER_TEMP}/read-receipts-patch-step.sh"
          log="${RUNNER_TEMP}/read-receipts-patch-step.log"
          report="${RUNNER_TEMP}/read-receipts-patch-trace.txt"

          python3 - "${script}" <<'PY'
          from pathlib import Path
          import sys

          workflow = Path('.github/workflows/read-receipts-realtime-privacy-finalizer-v2.yml')
          text = workflow.read_text(encoding='utf-8')
          step = text.index('      - name: Apply anonymous realtime invalidation contract\n')
          start = text.index('        run: |\n', step) + len('        run: |\n')
          end = text.index('\n      - name: Regenerate protobuf bindings and API documentation\n', start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old_buf = '(cd proto && mise x -- buf format -w chatto/core/v1/live_events.proto chatto/realtime/v1/realtime.proto)'
          new_buf = '''(cd proto && mise x -- buf format -w chatto/core/v1/live_events.proto)
          (cd proto && mise x -- buf format -w chatto/realtime/v1/realtime.proto)'''
          if script.count(old_buf) != 1:
              raise SystemExit(f'expected one obsolete buf format command, got {script.count(old_buf)}')
          script = script.replace(old_buf, new_buf, 1)

          slash = chr(92)
          old_docs = '\n'.join([
              f'pnpm exec prettier --write {slash}',
              f'  docs/fdr/FDR-031-read-receipts.md {slash}',
              '  docs/adr/ADR-054-read-receipt-publication-boundary.md',
          ])
          new_docs = '\n'.join([
              f'pnpm --dir apps/frontend exec prettier --write {slash}',
              f'  ../../docs/fdr/FDR-031-read-receipts.md {slash}',
              '  ../../docs/adr/ADR-054-read-receipt-publication-boundary.md',
          ])
          if script.count(old_docs) != 1:
              raise SystemExit(f'expected one root prettier command, got {script.count(old_docs)}')
          script = script.replace(old_docs, new_docs, 1)

          Path(sys.argv[1]).write_text(script, encoding='utf-8')
          PY

          set +e
          bash -x "${script}" > "${log}" 2>&1
          status=$?
          set -e

          {
            printf 'source_head=%s\n' "${GITHUB_SHA}"
            printf 'patch_step_status=%s\n' "${status}"
            printf '%s\n' '--- trace tail ---'
            tail -n 200 "${log}" | sed -E \
              -e 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1***/g' \
              -e 's/(GH_TOKEN=).*/\1***/g' \
              -e 's/[[:cntrl:]]//g'
          } > "${report}"

          encoded="$(base64 -w0 "${report}")"
          payload="$(jq -n \
            --arg message 'chore(ci): record full read receipt patch trace [skip read-receipts-privacy-v2] [skip read-receipts-privacy-executor] [skip read-receipts-command-fixer] [skip read-receipts-patch-trace]' \
            --arg content "${encoded}" \
            --arg branch 'feat/read-receipts' \
            '{message:$message,content:$content,branch:$branch}')"
          curl --fail --silent --show-error --location --retry 3 \
            --request PUT \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/read-receipts-patch-trace-v4.txt" \
            >/dev/null

          exit "${status}"
